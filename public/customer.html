<!doctype html>
<html lang="th" data-look="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- ลิงก์ออกไปเว็บอื่น (โซเชียลมีเดีย/แชร์) ไม่ส่งที่อยู่หน้านี้ไปด้วย เพราะมีรหัส QR ของโต๊ะ -->
<meta name="referrer" content="no-referrer">
<title>สั่งอาหาร</title>
<script>
// โทนสีที่ร้านตั้งไว้ (มืด/สว่าง/ตามเครื่อง) จำจากครั้งก่อน ตั้งก่อนวาดหน้า สีไม่กะพริบ ค่าจริงมาจาก /api/menu
try{var lk=localStorage.getItem('look');if(lk==='dark'||lk==='light'||lk==='auto')document.documentElement.setAttribute('data-look',lk);}catch(e){}
</script>
<style>
:root{
  /* Restaurant OS tokens: Graphite + Lime ปุ่มหลักพื้น lime ตัวหนังสือ graphite (ตัวขาวบน lime contrast แค่ 2:1)
     ตัวหนังสือสีเน้นใช้ --accent-text (lime เข้ม) ไม่ใช้ --accent  สีที่เจ้าของร้านตั้งมาทับใน /theme.css
     โทนหน้าลูกค้า: <html data-look="dark|light|auto"> (auto = ตามเครื่องลูกค้า) */
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --ink:#111827; --muted:#4b5563; --line:#e2e8f0; --line-strong:#7c8796;
  --accent:#84cc16; --accent-line:#84cc16; --accent-ink:#111827; --accent-soft:#ecfccb; --accent-text:#3f6212; --focus:#4d7c0f;
  --nav:#111827; --nav-ink:#f9fafb;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#92400e; --warn-bg:#fef3c7; --warn-line:#d97706; --crit:#b91c1c; --crit-bg:#fee2e2; --danger:#dc2626; --danger-ink:#ffffff;
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px; --r-hero:28px; --ctl:44px; --bnav:64px;
  --scrim:rgba(17,24,39,.62); --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
  --t0:#fef3c7; --t0i:#92400e; --t1:#dcfce7; --t1i:#166534; --t2:#ffe4e6; --t2i:#9f1239; --t3:#e0f2fe; --t3i:#075985; --t4:#ede9fe; --t4i:#5b21b6;
  /* สีโลโก้แพลตฟอร์ม (ปุ่มติดตามร้าน) */
  --fb:#1877f2; --ig:#c13584; --ln:#06c755; --tt:#000000; --brand-ink:#ffffff;
  --font:'Noto Sans Thai','Sarabun','Leelawadee UI','Thonburi',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-look=light]){
  --bg:#070b11; --surface:#0f1620; --surface2:#1a2330; --ink:#f9fafb; --muted:#9ca3af; --line:#222d3b; --line-strong:#6b7280;
  --accent:#a3e635; --accent-line:#a3e635; --accent-ink:#111827; --accent-soft:#1d2b0c; --accent-text:#bef264; --focus:#bef264;
  --nav:#030712; --nav-ink:#f9fafb;
  --ok:#4ade80; --ok-bg:#0f2e1a; --warn:#fbbf24; --warn-bg:#3a2a0b; --warn-line:#f59e0b; --crit:#f87171; --crit-bg:#3b1414; --danger:#dc2626; --danger-ink:#ffffff;
  --scrim:rgba(0,0,0,.66); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --t0:#3a2a0b; --t0i:#fcd34d; --t1:#0f2e1a; --t1i:#86efac; --t2:#3b1220; --t2i:#fda4af; --t3:#0b2a3d; --t3i:#7dd3fc; --t4:#24173f; --t4i:#c4b5fd;}}
:root[data-look=dark]{
  --bg:#070b11; --surface:#0f1620; --surface2:#1a2330; --ink:#f9fafb; --muted:#9ca3af; --line:#222d3b; --line-strong:#6b7280;
  --accent:#a3e635; --accent-line:#a3e635; --accent-ink:#111827; --accent-soft:#1d2b0c; --accent-text:#bef264; --focus:#bef264;
  --nav:#030712; --nav-ink:#f9fafb;
  --ok:#4ade80; --ok-bg:#0f2e1a; --warn:#fbbf24; --warn-bg:#3a2a0b; --warn-line:#f59e0b; --crit:#f87171; --crit-bg:#3b1414; --danger:#dc2626; --danger-ink:#ffffff;
  --scrim:rgba(0,0,0,.66); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --t0:#3a2a0b; --t0i:#fcd34d; --t1:#0f2e1a; --t1i:#86efac; --t2:#3b1220; --t2i:#fda4af; --t3:#0b2a3d; --t3i:#7dd3fc; --t4:#24173f; --t4i:#c4b5fd;
  color-scheme:dark}
:root[data-look=light]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font);padding-bottom:calc(var(--bnav) + 6rem + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{flex:none}
.wrap{max-width:40rem;margin:0 auto;padding-inline:16px}
@media (min-width:700px){.wrap{max-width:60rem}}
.muted{color:var(--muted)} .small{font-size:.86rem}
.center{text-align:center;padding:48px 8px}
.ln{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- หัวหน้า: การ์ดหน้าปก (ภาพร้านด้านขวา ตัวหนังสือด้านซ้ายบนพื้นทึบ) ---------- */
header.top{padding:calc(12px + env(safe-area-inset-top,0px)) 0 2px}
.hcard{position:relative;overflow:hidden;border-radius:var(--r-hero);border:1px solid var(--line);border-color:color-mix(in srgb,var(--accent) 38%,var(--line));background:var(--surface);min-height:208px;display:flex;align-items:stretch;box-shadow:var(--shadow)}
.hcard .cov{position:absolute;inset:0;background:radial-gradient(60% 85% at 100% 0%,var(--accent-soft) 0,transparent 70%);background:radial-gradient(60% 90% at 100% 0%,color-mix(in srgb,var(--accent) 34%,transparent) 0,transparent 72%),radial-gradient(45% 60% at 85% 100%,color-mix(in srgb,var(--accent) 16%,transparent) 0,transparent 70%)}
.top.has-cover .cov{left:28%;background:var(--cover) center/cover no-repeat}
/* ภาพจางเข้าหาพื้นการ์ดด้านซ้าย: ตัวหนังสืออยู่บนพื้นทึบเสมอ อ่านได้ทุกภาพ */
.top.has-cover .cov::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--surface) 0,color-mix(in srgb,var(--surface) 72%,transparent) 26%,transparent 66%)}
.hc-in{position:relative;z-index:1;padding:18px 18px 18px 20px;max-width:74%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
@media (min-width:700px){.hc-in{max-width:58%;padding:26px 28px}.hcard{min-height:240px}}
/* จอแคบ: ภาพร้านเป็นแถบบน ตัวหนังสือใต้ภาพ (ภาพที่มีตัวหนังสือในรูปเองจะได้ไม่ทับคำโปรย) จอกว้างเป็นภาพขวา/ข้อความซ้ายแบบเดิม */
@media (max-width:559px){
  .top.has-cover .hcard{flex-direction:column}
  .top.has-cover .cov{position:relative;inset:auto;left:auto;height:150px;flex:none}
  .top.has-cover .cov::after{background:linear-gradient(to bottom,transparent 50%,var(--surface) 100%)}
  .top.has-cover .hc-in{max-width:100%;padding-top:0;margin-top:-30px}
}
/* โลโก้ไม่ถูกตัดเสมอ (โลโก้ร้านมักมีชื่อร้านในรูป): กรอบมุมมนพื้นขาว รูปพอดีกรอบ โลโก้แนวนอนกรอบกว้างตาม */
.hc-in .logo{align-self:flex-start;width:60px;height:60px;border-radius:16px;object-fit:contain;padding:4px;background:#ffffff;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(0,0,0,.2);margin-bottom:8px}
.hc-in h1{margin:0;font-size:1.6rem;line-height:1.25;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere;text-shadow:0 0 8px var(--surface),0 0 2px var(--surface)}
.hc-in .logo.wide{width:auto;max-width:min(200px,100%);padding:4px 10px}
@media (min-width:700px){.hc-in h1{font-size:2.1rem}}
.hc-in .tagline{margin:2px 0 0;color:var(--accent-text);font-weight:700;font-size:1.05rem;line-height:1.35;overflow-wrap:anywhere;text-shadow:0 0 8px var(--surface),0 0 2px var(--surface)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.tchip{display:inline-flex;align-items:center;border-radius:99px;padding:3px 14px;font-weight:700;background:var(--nav);color:var(--nav-ink);border:1px solid var(--line-strong)}
.state{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 12px;font-weight:600;font-size:.85rem;background:var(--ok-bg);color:var(--ok)}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.state.off{background:var(--crit-bg);color:var(--crit)}
.top .err{margin-bottom:0}
/* ภาพพื้นหลังจางทั้งหน้า (ตัวหนังสืออยู่บนพื้นที่จางพอให้อ่านได้เสมอ) */
body.has-cover::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--cover) center/cover no-repeat;opacity:.06;filter:saturate(.7) blur(8px);pointer-events:none}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent-text)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.hot{background:var(--nav);color:var(--nav-ink)}
.pill.rec{background:var(--accent);color:var(--accent-ink)}
.err{background:var(--crit-bg);color:var(--crit);border-radius:var(--r);padding:10px 12px;margin:10px 0;font-weight:500}

/* ---------- หมวด: ปุ่มมีไอคอน เลื่อนแนวนอน ติดด้านบน ---------- */
nav.cats{position:sticky;top:0;z-index:4;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top,0px)}
nav.cats .in{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;margin-inline:-16px;scrollbar-width:none;scroll-padding-inline:16px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
nav.cats .in::-webkit-scrollbar{display:none}
.cat{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:0 18px 0 14px;min-height:48px;font-weight:600;white-space:nowrap}
.cat svg{width:22px;height:22px}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-line);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}

/* ---------- ค้นหาเมนู ---------- */
.srch{padding-top:4px}
.sbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:0 4px 0 16px;min-height:50px;color:var(--muted)}
.sbox:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.sbox input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);height:48px;outline:none}
.sbox input::placeholder{color:var(--muted);opacity:1}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox .x{width:var(--ctl);height:var(--ctl);border:0;border-radius:50%;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}

/* ---------- หัวข้อหมวด ---------- */
.sec{scroll-margin-top:84px}
.sh{font-size:1.2rem;margin:22px 0 12px;line-height:1.35;overflow-wrap:anywhere;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.sh::before{content:"";flex:none;align-self:center;width:6px;height:1.1em;border-radius:3px;background:var(--accent);margin-right:8px}
.sh small{color:var(--muted);font-weight:500;font-size:.85rem;margin-left:6px}

/* ---------- การ์ดเมนู: รูปซ้าย ชื่อ/ราคาขวา ปุ่ม + มุมขวาล่าง (จอกว้าง 2 คอลัมน์) ---------- */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-bottom:6px}
@media (min-width:620px){.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
.item{position:relative;min-width:0}
.item .open{display:flex;gap:14px;width:100%;min-height:132px;align-items:stretch;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-xl);padding:10px;text-align:left;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.item .open:active{transform:scale(.985)}
@media (hover:hover){.item .open:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}}
.pic{position:relative;display:block;overflow:hidden;background:var(--surface2)}
.item .pic{width:110px;height:110px;flex:none;border-radius:16px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;background:var(--accent-soft);color:var(--accent-text)}
.pic .noimg{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.4),transparent 55%),var(--tb);color:var(--ti)}
.pic .noimg svg{width:46px;height:46px;opacity:.85}
.tn0{--tb:var(--t0);--ti:var(--t0i)} .tn1{--tb:var(--t1);--ti:var(--t1i)} .tn2{--tb:var(--t2);--ti:var(--t2i)} .tn3{--tb:var(--t3);--ti:var(--t3i)} .tn4{--tb:var(--t4);--ti:var(--t4i)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-top:2px}
.nm{font-weight:700;font-size:1.04rem;line-height:1.38;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ds{color:var(--muted);font-size:.84rem;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pr{margin-top:auto;color:var(--accent-text);font-weight:800;font-size:1.2rem;line-height:1.3}
.item .pr{min-height:var(--ctl);display:flex;align-items:center}
.item.out .pic img,.item.out .noimg,.rcard.out .pic img,.rcard.out .noimg{filter:grayscale(1);opacity:.55}
.item.out .nm,.item.out .pr{color:var(--muted)}
.item .ctl{position:absolute;right:11px;bottom:11px;z-index:2}
.add{position:relative;width:var(--ctl);height:var(--ctl);border-radius:50%;border:1.5px solid var(--accent-line);background:var(--surface2);color:var(--accent-text);display:flex;align-items:center;justify-content:center}
.add:active{background:var(--accent);color:var(--accent-ink)}
.add .n{position:absolute;right:-6px;top:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:99px;background:var(--surface);overflow:hidden}
.step button{border:0;background:none;width:var(--ctl);height:var(--ctl);display:flex;align-items:center;justify-content:center}
.step button:disabled{opacity:.4;cursor:default}
.step b{min-width:1.6rem;text-align:center;font-size:1.05rem}
.item .step{border-color:var(--accent-line)}
.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---------- เมนูแนะนำ: การ์ดเลื่อนแนวนอน ---------- */
.rrow{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 12px;margin-inline:-16px;scroll-snap-type:x proximity;scroll-padding-inline:16px;scrollbar-width:none}
.rrow::-webkit-scrollbar{display:none}
.rcard{position:relative;flex:none;width:min(44vw,190px);scroll-snap-align:start}
.rcard .open{display:flex;flex-direction:column;width:100%;height:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-xl);padding:8px 8px 12px;text-align:left;box-shadow:var(--shadow)}
.rcard .pic{width:100%;aspect-ratio:1/1;border-radius:14px}
.rcard .rk{position:absolute;left:14px;top:14px;z-index:1}
.rcard .txt{padding:8px 4px 0;gap:4px;width:100%}
.rcard .nm{font-size:.98rem;min-height:2.7em}
.rcard .pr{font-size:1.08rem;padding-right:48px}
.rcard .ctl{position:absolute;right:10px;bottom:10px;z-index:2}

/* ---------- สถานะออเดอร์ของโต๊ะ ---------- */
#status{scroll-margin-top:84px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:12px 16px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.srow:first-child{border-top:0}
.srow .t{min-width:0;overflow-wrap:anywhere}
.help{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:10px 18px;min-height:48px;font-weight:600;flex:1;min-width:9rem}
.btn:disabled{opacity:.6;cursor:default}

/* ---------- ท้ายหน้า: ข้อมูลร้าน ติดตาม แชร์ ---------- */
.foot{padding:28px 16px 8px;text-align:center;color:var(--muted);font-size:.88rem;line-height:1.65}
.foot b{color:var(--ink)}
.foot a{color:var(--accent-text);font-weight:600}
.socrow{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.si{width:var(--ctl);height:var(--ctl);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--brand-ink);flex:none}
.si svg{width:22px;height:22px}
.si.fb{background:var(--fb)} .si.ig{background:var(--ig)} .si.ln{background:var(--ln)} .si.tt{background:var(--tt);box-shadow:inset 0 0 0 1px var(--line-strong)}
.si.shr{background:var(--surface2);color:var(--ink);border:1px solid var(--line-strong)}
.foot .socrow a{color:var(--brand-ink)}

/* ---------- ปุ่มแคปซูล (ปุ่มหลักทุกจุด) ---------- */
.cap{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;border-radius:99px;border:1px solid var(--accent-line);background:var(--accent);color:var(--accent-ink);padding:6px 6px 6px 22px;font-weight:700;font-size:1.05rem;text-align:left;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.cap .lb{min-width:0;line-height:1.3;overflow-wrap:anywhere}
.cap .rt{display:flex;align-items:center;gap:12px;flex:none}
.cap .arr{width:46px;height:46px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.cap:disabled{background:var(--surface2);color:var(--muted);border-color:var(--line-strong);box-shadow:none;cursor:default}
.cap:disabled .arr{background:var(--line);color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:calc(var(--bnav) + env(safe-area-inset-bottom,0px));z-index:6;padding:10px 16px 8px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.bar .cap{max-width:40rem;margin:0 auto}

/* ---------- แถบล่าง: เมนู / ออเดอร์ / ร้าน ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.bnav .in{display:flex;max-width:40rem;margin:0 auto}
.bnav button{position:relative;flex:1;border:0;background:none;min-height:var(--bnav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.8rem;font-weight:600}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-current="true"]{color:var(--accent-text)}
.bnav button[aria-current="true"]::after{content:"";position:absolute;bottom:6px;width:36px;height:3px;border-radius:3px;background:var(--accent)}
.bnav .nb{position:absolute;top:8px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- หน้ารายละเอียดเมนู ---------- */
.detail{position:fixed;inset:0;z-index:12;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.d-in{max-width:40rem;margin:0 auto;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.hero{position:relative;height:min(55vh,560px);min-height:300px;border-radius:0 0 var(--r-hero) var(--r-hero);overflow:hidden;background:var(--surface2)}
@media (min-width:700px){.d-in{padding-top:16px}.hero{border-radius:var(--r-hero)}}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
/* gradient มืดบนและล่าง ให้ตัวหนังสือขาวอ่านได้ทุกรูป (ป้ายมีพื้นทึบของตัวเองอีกชั้น) */
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.45) 0,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.82) 100%)}
.hero.noimg::after{display:none}
.hero.out img{filter:grayscale(1)}
.hero .top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.circle{width:var(--ctl);height:var(--ctl);border-radius:50%;border:0;background:#ffffff;color:#111827;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.2);flex:none}
.tag{background:var(--scrim);color:#ffffff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:.92rem;min-height:36px;display:flex;align-items:center}
.hero .top .sp{width:var(--ctl)}
.hero .cap-name{position:absolute;left:0;right:0;bottom:64px;z-index:2;padding:0 20px;color:#ffffff}
.hero .cap-name .tag{display:inline-flex;font-size:.82rem;min-height:28px;padding:3px 12px;margin-bottom:6px}
.hero .cap-name h2{margin:0;font-size:1.85rem;line-height:1.3;font-weight:700;overflow-wrap:anywhere;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.hero.noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 55%),var(--tb);color:var(--ti)}
.hero.noimg .big{margin-bottom:110px;opacity:.85}
.hero.noimg .big svg{width:84px;height:84px}
.hero.noimg .cap-name{color:var(--ti)}
.hero.noimg .cap-name h2{text-shadow:none}
.hero.noimg .top .circle{border:1px solid var(--line-strong)}
.hero.noimg .tag{background:var(--nav);color:var(--nav-ink)}
.hero.noimg.out{filter:grayscale(1)}
/* ราคา (พื้นเว้าเข้ามุมซ้ายล่างของรูป) + ปุ่มแคปซูลทับขอบรูปด้านขวา */
.buy{position:relative;z-index:3;display:flex;align-items:flex-start;gap:10px;margin-top:-52px;padding-right:16px}
.notch{background:var(--bg);border-radius:0 var(--r-hero) 0 0;padding:14px 14px 0 16px;flex:none;max-width:56%}
.price{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.price b{font-size:1.75rem;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.price span{color:var(--muted);font-weight:600}
.notch .step{margin-top:8px}
.buy .cap{flex:1;min-width:0;margin-top:8px;padding-left:18px;font-size:1rem;box-shadow:0 0 0 2px var(--bg),0 8px 20px rgba(0,0,0,.25)}
.d-body{padding:18px 16px 0}
.tabs{display:inline-flex;gap:4px;background:var(--surface2);border-radius:99px;padding:4px}
.tabs button{border:0;background:none;border-radius:99px;padding:0 18px;min-height:40px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--nav);color:var(--nav-ink)}
.panel{padding-top:14px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:0 16px;min-height:var(--ctl);font-size:.95rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.d-msg{margin-top:12px}

/* ---------- แผ่นเลื่อนขึ้นจากด้านล่าง (รายการสั่ง / ข้อมูลร้าน) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:14;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:40rem;max-height:92%;overflow-y:auto;overscroll-behavior:contain;border-radius:var(--r-hero) var(--r-hero) 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet h2{margin:0 0 6px;font-size:1.3rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2 .circle{background:var(--surface2);color:var(--ink);box-shadow:none}
.cl{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.cl:first-of-type{border-top:0}
.cl .th{width:58px;height:58px;border-radius:14px;flex:none;overflow:hidden;background:var(--surface2)}
.cl .th img{width:100%;height:100%;object-fit:cover;display:block}
.cl .th.noimg{background:var(--tb);color:var(--ti)}
.cl .th.noimg svg{width:30px;height:30px}
.cl .bd{flex:1;min-width:0}
.cl .tp{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.cl .tp span:first-child{min-width:0;overflow-wrap:anywhere}
.cl .nt{color:var(--accent-text);font-size:.88rem;margin-top:2px;overflow-wrap:anywhere}
.cl .ctlrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.cl .chips{margin-top:10px}
.link{border:0;background:none;color:var(--accent-text);text-decoration:underline;min-height:var(--ctl);padding:0 4px;font-weight:600}
.memo{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);min-height:48px;padding:10px 14px;margin-top:6px}
.total{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:700;margin:16px 0 12px}
/* ข้อมูลร้าน */
.shop-cov{height:140px;border-radius:var(--r-xl);background:var(--cover) center/cover no-repeat,var(--surface2);margin:8px 0 0}
.shop-hd{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.shop-hd .logo{width:60px;height:60px;border-radius:14px;object-fit:contain;padding:4px;background:#ffffff;flex:none;border:1px solid var(--line)}
.shop-hd .logo.wide{width:auto;max-width:140px;padding:4px 8px}
.shop-hd b{font-size:1.2rem;line-height:1.3;overflow-wrap:anywhere;display:block}
.shop-hd span{color:var(--accent-text);font-weight:600;overflow-wrap:anywhere}
.irow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.irow:first-child{border-top:0}
.irow svg{width:22px;height:22px;color:var(--muted);margin-top:2px}
.irow a{color:var(--accent-text);font-weight:600}
.shop-sec{margin-top:16px}
.shop-sec h3{font-size:1rem;margin:0 0 8px}
.soc{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;min-height:60px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);text-decoration:none;color:var(--ink);margin-top:8px}
.soc .tx{flex:1;min-width:0}
.soc .tx b{display:block}
.soc .tx small{color:var(--muted);overflow-wrap:anywhere}
.soc .go{color:var(--muted)}
.sharerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sharerow .si{width:28px;height:28px}.sharerow .si svg{width:16px;height:16px}
.sharerow .btn{min-width:7.5rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}

#toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:30rem;bottom:calc(var(--bnav) + 5.6rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow-wrap:anywhere}
#toast.on{opacity:1}
.offline{position:fixed;left:0;right:0;top:0;z-index:25;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;text-align:center;font-weight:600;font-size:.92rem}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.detail,.sheet,.bump{animation:none}.item .open{transition:none}.item .open:active{transform:none}}

function catIcon(n){

function noteKey(note){return note.slice().sort().join('|');}
function loadCart(){
  try{
    var s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return;
    if(Array.isArray(s.lines))lines=s.lines;
    // ตะกร้าแบบเดิม {cart:{id:{qty,note}}} ที่ลูกค้าเปิดค้างไว้ตอนอัปเดต: แปลงเป็นแถว reqId เดิมใช้ต่อ (กดส่งซ้ำแล้วไม่เป็นออเดอร์ซ้ำ)
    else if(s.cart&&typeof s.cart==='object')lines=Object.keys(s.cart).map(function(k){var l=s.cart[k]||{};return {id:+k,qty:+l.qty||0,note:Array.isArray(l.note)?l.note:[]};});
    lines=lines.filter(function(l){return l&&l.id>0&&l.qty>0;}).map(function(l){return {id:+l.id,qty:Math.min(20,Math.floor(+l.qty)),note:Array.isArray(l.note)?l.note.filter(function(n){return typeof n==='string';}):[]};});
    memo=s.memo||'';reqId=s.reqId||null;
  }catch(e){}
}
function saveCart(){try{localStorage.setItem(STORE,JSON.stringify({v:2,lines:lines,memo:memo,reqId:reqId}));}catch(e){}}
// แถวที่เมนูและหมายเหตุเหมือนกัน รวมเป็นแถวเดียว (สูงสุด 20 ต่อแถว ตามที่เซิร์ฟเวอร์รับ)
// รวมแล้วเกิน 20 (ที่เซิร์ฟเวอร์รับต่อแถว) ส่วนเกินเป็นแถวใหม่ ไม่ตัดทิ้งเงียบๆ
function mergeLines(){
  var out=[],at={};
  lines.forEach(function(l){
    var k=l.id+'#'+noteKey(l.note),j=at[k];
    if(j!==undefined&&out[j].qty+l.qty<=20)out[j].qty+=l.qty;
    else if(j!==undefined&&out[j].qty<20){var room=20-out[j].qty;out[j].qty=20;at[k]=out.length;out.push({id:l.id,qty:l.qty-room,note:l.note});}
    else{at[k]=out.length;out.push(l);}
  });
  lines=out;
}
var MAX_QTY=60,MAX_LINES=40;   // ตรงกับที่ POST /api/order รับต่อครั้ง
function addLine(id,qty,note){lines.push({id:id,qty:qty,note:note.slice()});mergeLines();cartChanged();}

function qtyOf(id){return linesOf(id).reduce(function(n,l){return n+l.qty;},0);}
function item(id){return M.items.filter(function(m){return m.id===id;})[0];}
function catName(id){var c=M.categories.filter(function(x){return x.id===id;})[0];return c?c.name:'';}
function cartCount(){return lines.reduce(function(n,l){return n+l.qty;},0);}
function cartTotal(){return lines.reduce(function(s,l){var m=item(l.id);return s+(m?m.price*l.qty:0);},0);}

function api(path, body){
  return fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j};});});
}

  document.querySelectorAll('nav.cats .cat').forEach(function(b){var y=+b.dataset.id===id;b.setAttribute('aria-pressed',y);if(y)on=b;});

var spyT=null,spyEnd=null,spyLock=0;
function spy(){
  spyT=null;
  if(!M)return;
  // แถบล่าง: เห็นส่วนออเดอร์ของโต๊ะแล้ว = ออเดอร์
  var stt=$('#status');if(stt)setNav(stt.getBoundingClientRect().top<window.innerHeight*0.55?'orders':'menu');
  if(Q||Date.now()<spyLock)return;          // กำลังค้นหา / กำลังเลื่อนไปหมวดที่แตะ ไม่ให้ปุ่มกระพริบตามหมวดที่ผ่าน
  var secs=document.querySelectorAll('.sec[data-cat]');if(!secs.length)return;
  var nav=$('nav.cats'),top=nav?nav.getBoundingClientRect().bottom+24:96,cur=+secs[0].dataset.cat;
  secs.forEach(function(sec){if(sec.getBoundingClientRect().top<=top)cur=+sec.dataset.cat;});
  // (+24 เผื่อ scroll-margin-top ของหมวด เลื่อนไปหมวดที่แตะแล้วหัวข้อหยุดเกินเส้นเศษพิกเซล ปุ่มเคยไม่ติด)
  // เลื่อนจนสุดหน้า: หมวดสุดท้ายที่เห็นบนจอ (หมวดสั้นๆ ท้ายเมนูเลื่อนขึ้นไปถึงด้านบนไม่ได้)
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4){secs.forEach(function(sec){if(sec.getBoundingClientRect().top<window.innerHeight-80)cur=+sec.dataset.cat;});}
  if(cur!==cat)markCat(cur,true);
}

function copyText(t){
  function done(){toast('คัดลอกลิงก์ร้านแล้ว ส่งให้เพื่อนได้เลย');}
  function fallback(){
    // หน้าร้านเปิดผ่าน http ในวง WiFi: navigator.clipboard ใช้ไม่ได้ ใช้วิธีเดิมแทน
    var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.top='0';a.style.opacity='0';
    document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(a);
    if(ok)done();else toast('คัดลอกไม่ได้ ลิงก์ร้าน: '+t);
  }
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fallback);else fallback();
}
function shareShop(){
  var u=safeUrl(M.shareUrl);if(!u)return;
  if(navigator.share)navigator.share({title:M.shop,text:M.tagline||M.shop,url:u}).catch(function(e){if(e&&e.name!=='AbortError')copyText(u);});
  else copyText(u);
}

/* keep sold-out flags and the open/closed state live, and drop sold-out dishes from the cart */
function applyStat(s){
  // the back office changed the menu (price, photo, new dish, logo, colour): fetch it again, then re-apply
  if(s.menuVersion!==undefined&&s.menuVersion!==M.version){
    if(!menuLoading){
      menuLoading=true;
      api('/api/menu').then(function(r){
        menuLoading=false;
        if(r.ok){M=r.j;s.menuVersion=M.version;STAT=null;loadTheme(M.version);applyStat(s);if(shopOpen)renderShop();}   // adopt whatever version we got, so this never loops
      },function(){menuLoading=false;});
    }
    return;
  }
  var before=STAT?(STAT.open+'|'+STAT.closedReason+'|'+(STAT.soldOut||[]).join(',')):null;
  STAT=s;
  var out=s.soldOut||[],removed=[],gone=0;
  M.items.forEach(function(m){m.soldOut=out.indexOf(m.id)>=0;});
  M.svc=s.svc;M.vat=s.vat;
  lines=lines.filter(function(l){var m=item(l.id);if(!m||m.soldOut){if(m){if(removed.indexOf(m.name)<0)removed.push(m.name);}else gone++;return false;}return true;});
  if(removed.length||gone){
    openNotes={};cartChanged();
    toast((removed.length?removed.join(', ')+' หมดแล้ว ':'')+(gone?'มีเมนูที่ไม่มีขายแล้ว ':'')+'นำออกจากรายการสั่งให้แล้ว');
  }
  var after=s.open+'|'+s.closedReason+'|'+out.join(',');
  if(before!==after||removed.length||gone){
    renderAll();renderSheet();
    if(D)renderDetail();       // เมนูหมด/ร้านปิดรับ/เมนูเปลี่ยน ระหว่างเปิดหน้ารายละเอียด: ปุ่มเปลี่ยนทันที (ไม่วาดใหม่ทุกรอบ poll โฟกัสจะหลุด)
  }
  else renderStatus();
}
// เน็ตหลุด: บอกลูกค้าตรงๆ ว่าสถานะที่เห็นอาจเก่า (เดิมเงียบ ลูกค้าเห็นข้อมูลค้างเหมือนเป็นปัจจุบัน)
var netFails=0;
function setOnline(ok){netFails=ok?0:netFails+1;$('#offline').hidden=ok||(netFails<2&&navigator.onLine!==false);}
function refreshStatus(){
  api('/api/table?t='+T+'&k='+encodeURIComponent(K)).then(function(r){
    setOnline(true);
    if(r.ok)applyStat(r.j);
    // ร้านเปลี่ยนรหัส QR โต๊ะนี้ (หรือลดโต๊ะ) ระหว่างเปิดหน้าค้างไว้: บอกให้สแกนใหม่ ไม่ค้างแสดงเมนูที่สั่งไม่ได้
    else if(r.status===403||r.status===400){D=null;sheetOpen=false;shopOpen=false;document.body.classList.remove('lock');$('#detail').hidden=true;$('#sheetbg').hidden=true;$('#shopbg').hidden=true;fatal(r.j.error||'QR นี้ใช้ไม่ได้แล้ว');}
  }).catch(function(){setOnline(false);});
}
window.addEventListener('offline',function(){$('#offline').hidden=false;});
window.addEventListener('online',refreshStatus);

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b){ if(e.target.id==='sheetbg')closeSheet(); else if(e.target.id==='shopbg')closeShop(); return; }
  if(b.disabled)return;
  var a=b.dataset.a,id=+b.dataset.id,i=+b.dataset.i;
  if(a==='cat'){
    if(Q){Q='';$('#q').value='';renderMain();}       // แตะหมวดระหว่างค้นหา = เลิกค้นหาแล้วไปหมวดนั้น
    markCat(id,true);spyLock=Date.now()+900;
    var sec=$('#sec-'+id);
    if(sec)sec.scrollIntoView({behavior:smooth()?'smooth':'auto',block:'start'});
  }
  else if(a==='qclear'){Q='';var qi=$('#q');qi.value='';renderMain();markCat(cat,false);qi.focus();}
  else if(a==='nav'){
    var v=b.dataset.v;
    if(v==='shop'){openShop(b);return;}
    if(v==='menu'){window.scrollTo({top:0,behavior:smooth()?'smooth':'auto'});setNav('menu');}
    else{var st=$('#status');if(st)st.scrollIntoView({behavior:smooth()?'smooth':'auto',block:'start'});setNav('orders');}
  }
  else if(a==='sclose'){closeShop();}
  else if(a==='share'){shareShop();}
  else if(a==='copy'){var su=safeUrl(M.shareUrl);if(su)copyText(su);}
  else if(a==='detail'){openDetail(id,b.tagName==='BUTTON'?b:null);}
  else if(a==='inc'){
    var mi=item(id);if(!mi||mi.soldOut||closedForGuests())return;
    var plain=linesOf(id).filter(function(l){return !l.note.length;})[0];
    if(plain){if(plain.qty<20)plain.qty++;cartChanged();}else addLine(id,1,[]);
    bumpId=id;setTimeout(function(){bumpId=null;},400);
    renderAll();renderSheet();
  }
  else if(a==='dec'){var ld=linesOf(id);if(ld.length===1&&!ld[0].note.length){ld[0].qty--;if(ld[0].qty<=0)lines.splice(lines.indexOf(ld[0]),1);cartChanged();}renderAll();renderSheet();}
  else if(a==='open'){openSheet(b);}
  else if(a==='close'){closeSheet();}
  else if(a==='linc'){if(lines[i]&&lines[i].qty<20){lines[i].qty++;cartChanged();}renderAll();renderSheet();}
  else if(a==='ldec'){if(lines[i]){lines[i].qty--;if(lines[i].qty<=0){lines.splice(i,1);openNotes={};}cartChanged();}renderAll();renderSheet();}
  else if(a==='notes'){
    if(openNotes[i]){openNotes={};mergeLines();saveCart();}else{openNotes={};openNotes[i]=true;}   // ปิดแล้วค่อยรวมแถวที่หมายเหตุกลายเป็นเหมือนกัน
    renderAll();renderSheet();
  }
  else if(a==='note'){var l=lines[i];if(!l)return;var n=b.dataset.n,x=l.note.indexOf(n);if(x>=0)l.note.splice(x,1);else l.note.push(n);cartChanged();renderSheet();}
  else if(a==='send')send();
  else if(a==='dback'){closeDetail();}
  else if(a==='dinc'){if(D.qty<20)D.qty++;renderDetail();}
  else if(a==='ddec'){if(D.qty>1)D.qty--;renderDetail();}
  else if(a==='dtab'){D.tab=b.dataset.t;renderDetail();}
  else if(a==='dnote'){var dn=b.dataset.n,dx=D.note.indexOf(dn);if(dx>=0)D.note.splice(dx,1);else D.note.push(dn);renderDetail();}
  else if(a==='dadd'){
    var dm=item(D.id);if(!dm||dm.soldOut||closedForGuests())return;
    addLine(D.id,D.qty,D.note);
    var msg='เพิ่มลงรายการสั่งแล้ว '+D.qty+' จาน';
    closeDetail();renderAll();renderSheet();toast(msg);
  }
  else if(a==='call'){
    api('/api/call',{table:T,key:K,kind:b.dataset.k}).then(function(r){
      if(r.ok){toast(b.dataset.k==='bill'?'แจ้งขอเช็คบิลแล้ว':'แจ้งพนักงานแล้ว');refreshStatus();}
      else toast(r.j.error||'ส่งไม่สำเร็จ');
    }).catch(function(){toast('ส่งไม่สำเร็จ ลองใหม่อีกครั้ง');});
  }
});
// แป้นลูกศรซ้าย/ขวาสลับแท็บ (ตามแบบ tablist) และ Esc ปิดหน้าที่เปิดอยู่
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(D)closeDetail();else if(sheetOpen)closeSheet();else if(shopOpen)closeShop();else if(e.target.id==='q'&&Q){Q='';e.target.value='';renderMain();}return;}
  if(e.key==='Enter'&&e.target.id==='q'){e.target.blur();return;}     // ปิดคีย์บอร์ดมือถือ ดูผลค้นหา
  if(D&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.getAttribute&&e.target.getAttribute('role')==='tab'){D.tab=D.tab==='desc'?'notes':'desc';renderDetail();$('#tab-'+D.tab).focus();}
});
document.addEventListener('focusin',function(e){if(e.target.id==='q')setTimeout(keepSearch,0);});
document.addEventListener('input',function(e){
  if(e.target.id==='memo'){memo=e.target.value;cartChanged();}
  else if(e.target.id==='q'){
    Q=e.target.value.trim().slice(0,40);
    renderMain();keepSearch();
    if(!Q)markCat(cat,false);else document.querySelectorAll('nav.cats .cat').forEach(function(b){b.setAttribute('aria-pressed','false');});
  }
});

function send(){
  if(sending||closedForGuests())return;
  var items=lines.map(function(l){return {id:l.id,qty:l.qty,note:l.note};});
  if(!items.length)return;
  if(!reqId){reqId=newReqId();saveCart();}
  sending=true;sendErr='';renderSheet();
  // expect = ยอดที่ลูกค้าเห็น ถ้าราคาเปลี่ยนระหว่างนั้น เซิร์ฟเวอร์ตอบ 409 แล้วหน้านี้โหลดราคาใหม่ให้ตรวจก่อนกดอีกครั้ง
  api('/api/order',{table:T,key:K,items:items,memo:memo,reqId:reqId,expect:Math.round(cartTotal()*100)/100}).then(function(r){
    sending=false;
    if(r.ok){lines=[];openNotes={};memo='';reqId=null;saveCart();closeSheet();renderAll();renderSheet();toast('ส่งออเดอร์เข้าครัวแล้ว');refreshStatus();}
    else{sendErr=r.j.error||'ส่งไม่สำเร็จ';if(r.j.code==='price_changed'){reqId=null;saveCart();}renderSheet();refreshStatus();}
  }).catch(function(){sending=false;sendErr='ส่งไม่สำเร็จ ตรวจสอบสัญญาณ แล้วกดสั่งอีกครั้ง (ระบบจะไม่ส่งซ้ำ)';renderSheet();});
}

function fatal(msg){
  $('#app').innerHTML='<div class="wrap center"><h1 style="font-size:1.4rem">'+esc(msg)+'</h1><p class="muted">กรุณาสแกน QR ที่โต๊ะอีกครั้ง หรือเรียกพนักงาน</p></div>';
}

// รีเฟรชหน้าตอนหน้ารายละเอียดเปิดอยู่: history ยังมี state เดิม ล้างทิ้ง ปุ่มย้อนกลับจะได้ไม่ต้องกดสองครั้ง
if(history.state&&history.state.ov)history.replaceState(null,'');
if(!(T>=1)){ fatal('ไม่พบเลขโต๊ะ'); }
else {
  loadCart();
  Promise.all([api('/api/menu'),api('/api/table?t='+T+'&k='+encodeURIComponent(K))]).then(function(rs){
    if(!rs[1].ok){fatal(rs[1].j.error||'เปิดหน้านี้ไม่ได้');return;}
    M=rs[0].j;
    applyStat(rs[1].j);
    renderAll();
    setInterval(function(){if(!document.hidden)refreshStatus();},5000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshStatus();});
  }).catch(function(){fatal('เชื่อมต่อร้านไม่ได้');});
}
})();
</script>
</body>
</html>
