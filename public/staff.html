<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>หลังร้าน · ออเดอร์ไว</title>
<style>
:root{
  /* Restaurant OS tokens: Graphite + Lime ปุ่มหลักพื้น lime ตัวหนังสือ graphite (ตัวขาวบน lime contrast แค่ 2:1)
     ตัวหนังสือสีเน้นใช้ --accent-text (lime เข้ม) ไม่ใช้ --accent */
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --ink:#111827; --muted:#4b5563; --line:#e2e8f0; --line-strong:#7c8796;
  --accent:#84cc16; --accent-ink:#111827; --accent-soft:#ecfccb; --accent-text:#3f6212; --focus:#4d7c0f;
  --nav:#111827; --nav-ink:#f9fafb;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#92400e; --warn-bg:#fef3c7; --warn-line:#d97706; --crit:#b91c1c; --crit-bg:#fee2e2; --danger:#dc2626; --danger-ink:#ffffff;
  --r-sm:8px; --r:12px; --r-lg:16px; --ctl:44px;
  --font:'Inter','Noto Sans Thai','IBM Plex Sans Thai','Leelawadee UI','Sarabun','Thonburi',system-ui,-apple-system,'Segoe UI',sans-serif;
  --paper:#fdfdfb; --paper-ink:#1c1f1e; --paper-line:#bfc6c3; --paper-muted:#5a625f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f17; --surface:#111827; --surface2:#1f2937; --ink:#f9fafb; --muted:#9ca3af; --line:#273244; --line-strong:#6b7280;
  --accent:#a3e635; --accent-ink:#111827; --accent-soft:#1d2b0c; --accent-text:#bef264; --focus:#bef264;
  --nav:#030712; --nav-ink:#f9fafb;
  --ok:#4ade80; --ok-bg:#0f2e1a; --warn:#fbbf24; --warn-bg:#3a2a0b; --warn-line:#f59e0b; --crit:#f87171; --crit-bg:#3b1414; --danger:#dc2626; --danger-ink:#ffffff;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);padding-inline:16px;padding-bottom:28px;font-variant-numeric:tabular-nums}
.wrap{max-width:76rem;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h2,h3{margin:0;font-weight:600}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;margin-inline:-16px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.3rem;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent-text)}
button.pill{border:0}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.8rem;padding:2px 4px}
.tabs{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;margin-top:10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 4px;min-height:var(--ctl);font-weight:600;text-align:center;font-size:.92rem;line-height:1.3}
.tab[aria-selected="true"]{background:var(--nav);border-color:var(--nav);color:var(--nav-ink);box-shadow:inset 0 -3px 0 var(--accent)}
.badge{display:inline-block;min-width:1.35em;margin-left:5px;padding:0 5px;border-radius:99px;background:var(--danger);color:var(--danger-ink);font-size:.72rem;line-height:1.35em}
.tab[aria-selected="true"] .badge{background:var(--accent);color:var(--accent-ink)}
.view{padding-top:14px}
.view[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:9px 16px;min-height:var(--ctl);font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent-line,var(--accent));color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.block{display:flex;width:100%;padding:12px 16px;min-height:48px}
.btn.sm{padding:5px 12px;min-height:36px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.crit{background:var(--crit-bg);color:var(--crit)}
.banner.info{background:var(--accent-soft);color:var(--accent-text)}
/* kitchen */
.agg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.agg .pill{background:var(--accent-soft);color:var(--accent-text);font-size:.85rem;padding:3px 11px;white-space:normal;overflow-wrap:anywhere;max-width:100%}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(16.5rem,1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.w-ok{border-left-color:var(--accent)} .card.w-warn{border-left-color:var(--warn-line);background:var(--warn-bg)} .card.w-crit{border-left-color:var(--crit);background:var(--crit-bg)} .card.w-ready{border-left-color:var(--ok)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h .t{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.card-h b{font-size:1.1rem}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.card li{display:flex;gap:10px;font-size:1.12rem;line-height:1.4}
.card li b{min-width:1.8em}
.note-txt{font-size:.82rem;color:var(--accent-text);font-weight:500}
.memo-txt{font-size:.88rem;background:var(--surface2);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.card-act{display:flex;gap:6px}
.card-act .btn{min-height:48px;font-size:1.02rem}
.card-act .btn:first-child{flex:1}
/* tables */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.8rem,1fr));gap:8px;margin-bottom:14px}
.tbl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;text-align:left;min-height:4.6rem}
.tbl .n{font-size:1.5rem;font-weight:700;line-height:1.2}
.tbl .s{font-size:.76rem;color:var(--muted)}
.tbl.busy{border-color:var(--accent);background:var(--accent-soft)} .tbl.busy .s{color:var(--accent-text)}
.tbl.ready{border-color:var(--ok);background:var(--ok-bg)} .tbl.ready .s{color:var(--ok);font-weight:700}
.tbl.call{border-color:var(--crit);background:var(--crit-bg)} .tbl.call .s{color:var(--crit);font-weight:700}
.tbl.add{border-style:dashed;color:var(--accent-text)} .tbl.add .s{color:var(--accent-text)}
.tbl[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:860px){.detail{grid-template-columns:22rem minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sent-row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:6px 0;border-top:1px dashed var(--line)}
.sent-row:first-child{border-top:0}
.sent-row>span:first-child{min-width:0;overflow-wrap:anywhere}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{border:0;background:var(--surface2);width:2.1rem;height:2rem;font-size:1.1rem}
.step span{min-width:2rem;text-align:center;font-weight:700}
.sw{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 14px;font-size:.85rem;font-weight:600}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.receipt-box{display:flex;justify-content:center}
.receipt{width:100%;max-width:22rem;background:var(--paper);color:var(--paper-ink);padding:22px 20px;border-radius:4px;box-shadow:0 1px 0 var(--paper-line),0 8px 24px rgba(0,0,0,.18);font-size:.9rem}
.receipt .shop{font-weight:700;font-size:1.25rem;text-align:center;overflow-wrap:anywhere}
.receipt .sub{text-align:center;color:var(--paper-muted);font-size:.8rem}
.receipt .doc{text-align:center;font-weight:700;font-size:.95rem;margin-top:2px}
.receipt hr{border:0;border-top:1px dashed var(--paper-line);margin:12px 0}
.receipt .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--paper-muted);gap:8px}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:2px 0;vertical-align:top}
.receipt td.q{width:2.4em;color:var(--paper-muted)} .receipt td.a{text-align:right;white-space:nowrap}
.receipt .grand td{font-size:1.3rem;font-weight:700;padding-top:6px}
.qr{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px;text-align:center}
.qr svg{width:10.5rem;height:10.5rem;background:#fff}
.qr small{color:var(--paper-muted)}
.qr .payqr{width:12rem;max-width:100%;height:auto;background:#fff;border-radius:6px}
.payqr-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:4px 0 14px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
.payqr-box .pq{width:120px;height:120px;flex:none;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:#ffffff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;color:#4b5563;padding:6px;overflow:hidden}
.payqr-box .pq img{max-width:100%;max-height:100%;object-fit:contain}
.payqr-box .stack{flex:1;min-width:14rem}
.pay-wrap{max-width:22rem;margin:12px auto 0;width:100%;display:flex;flex-direction:column;gap:8px}
.pay-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cash{display:flex;flex-direction:column;gap:8px}
.cash .q{display:flex;gap:6px;flex-wrap:wrap}
.cash-out{font-size:1.5rem;font-weight:700;line-height:1.3}
.cash-out.short{color:var(--crit);font-size:1rem}
.audit-row{display:grid;grid-template-columns:3.6rem 1fr;gap:4px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.audit-row:first-child{border-top:0}
.audit-row .w{grid-column:2;font-size:.8rem;color:var(--muted)}
/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:.8rem;color:var(--muted)} .kpi .v{font-size:1.75rem;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.kpi .x{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(5rem,10rem) minmax(0,1fr) 4.6rem;gap:10px;align-items:center}
.bar-row>span:first-child{min-width:0;overflow-wrap:anywhere}
.bar-row .tr{background:var(--surface2);border-radius:5px;height:14px;overflow:hidden}
.bar-row .fi{height:100%;background:var(--accent);border-radius:5px}
.bar-row .n{text-align:right;font-weight:600}
.tbl-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:.9rem}
table.list th,table.list td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.list th{font-size:.8rem;color:var(--muted);font-weight:600}
table.list td.r,table.list th.r{text-align:right}
/* settings */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input.in,select.in{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 12px;min-height:var(--ctl);width:100%}
.toggles{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}
.sold{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left}
.sold[aria-pressed="true"]{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.qrsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:12px}
.qcard{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;break-inside:avoid;display:flex;flex-direction:column;align-items:center;gap:2px}
.qcard .sh{font-size:.85rem;color:#444;overflow-wrap:anywhere}
.qcard .tn{font-size:1.8rem;font-weight:700;line-height:1.2}
.qcard svg{width:100%;max-width:9rem;height:auto}
.qcard .hint{font-size:.78rem;color:#444}
/* menu manager */
.mlayout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:900px){.mlayout{grid-template-columns:19rem minmax(0,1fr)}}
.crow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .nm{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left;border:0;background:none;padding:0;font-weight:600}
.crow .nm[aria-pressed="true"]{color:var(--accent-text);text-decoration:underline}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:2rem;height:2rem;padding:0 7px;font-size:.82rem;font-weight:600}
.ibtn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.inline{display:flex;gap:6px;margin-top:10px}
.inline .in{flex:1;min-width:0}
.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mtools .in{flex:1;min-width:10rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:10px}
.mcard{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.mcard.off{opacity:.62}
.thumb{flex:none;width:4.6rem;height:4.6rem;border-radius:8px;object-fit:cover;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.72rem;text-align:center}
.mcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mcard .nm{font-weight:600;overflow-wrap:anywhere}
.mcard .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.editor{margin-bottom:14px;border-color:var(--accent)}
.eimg{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.eimg .thumb{width:7.5rem;height:7.5rem}
select.in{appearance:auto}
.small{font-size:.82rem}
.status-line{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;font-size:.9rem}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.login[hidden]{display:none}
.login form{width:100%;max-width:22rem;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.login.has-cover{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),var(--cover) center/cover no-repeat}
.err{color:var(--crit);font-weight:600;min-height:1.4em}
.logo{display:block;object-fit:contain;border-radius:var(--r-sm)}
.login .logo{width:96px;height:96px;margin:0 auto 4px;background:var(--surface);border:1px solid var(--line);padding:6px}
.login .shopname{text-align:center;font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.brand-row{display:flex;align-items:center;gap:10px;min-width:0}
.brand-row .logo{width:40px;height:40px;flex:none;background:var(--surface);border:1px solid var(--line);padding:2px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:16px;align-items:start}
.logo-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-box .logo,.logo-box .ph{width:96px;height:96px;border:1px dashed var(--line-strong);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-align:center;padding:4px}
.cover-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cover-box .cv,.cover-box .ph{width:200px;aspect-ratio:16/9;border-radius:var(--r);object-fit:cover;border:1px dashed var(--line-strong);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-align:center;padding:4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.swatch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;min-height:40px;font-size:.85rem;font-weight:600}
.swatch i{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.swatch[aria-pressed="true"]{outline:3px solid var(--focus);outline-offset:1px}
.swatch.plain{padding:4px 14px;min-height:44px}
.tpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tpick input[type=color]{width:56px;height:44px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:2px;cursor:pointer}
.tprev{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.tprev .btn.primary{align-self:flex-start}
.receipt .rlogo{display:block;max-width:40mm;max-height:18mm;margin:0 auto 6px;object-fit:contain;filter:grayscale(1)}
.qcard .qlogo{max-width:5rem;max-height:3rem;object-fit:contain}
.qcard .qact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.qcard .qact .btn{color:var(--ink)}
@page qrsheet{size:A4;margin:10mm}
/* ใบเสร็จพิมพ์จากสำเนาใน #print-area (ลูกตรงของ body) ส่วนอื่นซ่อนแบบไม่กินที่ ใบเสร็จไหลต่อหน้าตามปกติ
   เดิมซ่อนด้วย visibility + position:fixed: ส่วนที่ซ่อนยังกินความยาวกระดาษ ใบสั้นพิมพ์ออกมา 2 ใบซ้ำ ใบยาวหน้าถัดไปพิมพ์หัวใบเสร็จทับยอดรวม */
@page receipt{margin:0}
@page doc{size:A4;margin:12mm}
#print-area{display:none}
dialog.dlg{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:18px;width:min(28rem,calc(100% - 32px))}
dialog.dlg::backdrop{background:rgba(0,0,0,.5)}
.dlg h3{margin:0 0 6px}
.dlg .reasons{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.dlg .reasons label{border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;background:var(--bg)}
.dlg .reasons input{margin:0 6px 0 0}
.dlg .row{display:flex;gap:8px;margin-top:12px}

var TONES={order:[[660,0,.18],[880,.2,.18],[1100,.4,.3]],call:[[1200,0,.14],[1200,.22,.14]],bill:[[990,0,.3],[740,.32,.45]],ready:[[1320,0,.6]]};

      var o=AC.createOscillator(),g=AC.createGain(),t=t0+n[1];
      o.type='sine';o.frequency.value=n[0];o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+n[2]);

function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v;}
function ppPayload(idStr,amount){
  var d=String(idStr||'').replace(/\D/g,''),acct;
  if(d.length===10)acct=tlv('01','0066'+d.slice(1));
  else if(d.length===13)acct=tlv('02',d);
  else return null;
  var p=tlv('00','01')+tlv('01',amount>0?'12':'11')+tlv('29',tlv('00','A000000677010111')+acct)+tlv('58','TH')+tlv('53','764');
  if(amount>0)p+=tlv('54',amount.toFixed(2));
  p+='6304';
  return p+crc16(p);
}
function qrSvg(text,label){

    var s=n+m*2;
    return '<svg viewBox="0 0 '+s+' '+s+'" role="img" aria-label="'+esc(label||'QR')+'" shape-rendering="crispEdges"><rect width="'+s+'" height="'+s+'" fill="#ffffff"/><path d="'+path+'" fill="#000000"/></svg>';

}

// zip แบบไม่บีบอัด (PNG บีบอัดอยู่แล้ว) ชื่อไฟล์ภาษาไทยใช้ UTF-8 (flag 0x0800)
var CRC=null;
function crc32(b){if(!CRC){CRC=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC[n]=c>>>0;}}var x=0xFFFFFFFF;for(var i=0;i<b.length;i++)x=CRC[(x^b[i])&255]^(x>>>8);return (x^0xFFFFFFFF)>>>0;}
function makeZip(files){
  var parts=[],cen=[],off=0,enc=new TextEncoder();
  files.forEach(function(f){
    var nm=enc.encode(f.name),d=f.data,crc=crc32(d),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    var e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint32(16,crc,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
    cen.push(new Uint8Array(e.buffer),nm);
    off+=30+nm.length+d.length;
  });
  var csize=cen.reduce(function(n,p){return n+p.length;},0),z=new DataView(new ArrayBuffer(22));
  z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,csize,true);z.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(z.buffer)]),{type:'application/zip'});
}

// สั่งแทนลูกค้า: ที่อยู่เดียวกับหน้าพนักงานที่เปิดอยู่ (cookie เข้าสู่ระบบไปด้วย = โหมดพนักงาน) ไม่ใช่ที่อยู่ใน QR ซึ่งอาจเป็นคนละชื่อเครื่อง
function staffOrderUrl(t){return '/order?t='+t+'&k='+encodeURIComponent(S.d.keys[t]||'');}

/* ---------- data ---------- */
function tableTickets(t){return S.d.tickets.filter(function(k){return k.table===t;});}
function calc(sub,svcOn,vatOn){
  var svc=svcOn?Math.round(sub*.1):0,vat=vatOn?Math.round((sub+svc)*.07):0,total=Math.round((sub+svc+vat)*100)/100;
  return {sub:sub,svc:svc,vat:vat,total:total};
}
function pad(n,w){return String(n).padStart(w,'0');}
function billNo(no,at){var d=new Date(at);return 'R'+d.getFullYear()+pad(d.getMonth()+1,2)+pad(d.getDate(),2)+'-'+pad(no,4);}
function fmtDate(at){var d=new Date(at);return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});}

var readyAt={};      // ตั๋ว → เวลาที่หน้านี้เห็นว่าพร้อมเสิร์ฟ (เซิร์ฟเวอร์ไม่ได้เก็บ) ใช้เตือนซ้ำเมื่อค้าง
function detectNew(){
  // S.seen = สถานะล่าสุดของแต่ละตั๋วที่เห็นแล้ว (จับได้ทั้งตั๋วใหม่ และตั๋วที่เพิ่งเปลี่ยนเป็นพร้อมเสิร์ฟ)
  var ids={},calls={},fresh=[],ready=[],newCall=null,first=!S.seen;
  S.d.tickets.forEach(function(k){
    ids[k.id]=k.status;
    if(k.status==='ready'){if(!readyAt[k.id])readyAt[k.id]=Date.now();}else delete readyAt[k.id];
    if(first)return;
    if(!S.seen[k.id]&&k.status==='new')fresh.push(k);
    else if(k.status==='ready'&&S.seen[k.id]&&S.seen[k.id]!=='ready')ready.push(k);
  });
  Object.keys(S.d.calls).forEach(function(t){var key=t+':'+S.d.calls[t].at;calls[key]=1;if(S.seenCalls&&!S.seenCalls[key])newCall={t:t,c:S.d.calls[t]};});
  S.seen=ids;S.seenCalls=calls;
  Object.keys(readyAt).forEach(function(id){if(!ids[id])delete readyAt[id];});
  var msg=[],sound=null;
  if(fresh.length){
    msg.push('ออเดอร์ใหม่ '+where(fresh[0])+(fresh.length>1?' และอีก '+(fresh.length-1)+' ใบ':''));
    if(fresh.some(stationOk)&&hears('order'))sound='order';
  }
  if(newCall){var kb=newCall.c.kind==='bill'?'bill':'call';msg.push('โต๊ะ '+newCall.t+(kb==='bill'?' ขอเช็คบิล':' เรียกพนักงาน'));if(!sound&&hears(kb))sound=kb;}
  if(ready.length){
    var rt=ready.filter(function(k){return k.table>0;}).map(function(k){return k.table;}).filter(function(t,i,a){return a.indexOf(t)===i;});
    var rq=ready.filter(function(k){return k.table===0;}).map(function(k){return k.q;}).filter(function(t,i,a){return a.indexOf(t)===i;});
    if(rt.length)msg.push('พร้อมเสิร์ฟ โต๊ะ '+rt.join(', '));
    if(rq.length)msg.push('คิว '+rq.join(', ')+' พร้อมรับ');
    if(!sound&&hears('ready'))sound='ready';
  }
  if(msg.length)toast(msg.join(' · '));
  if(sound){beep(sound);lastRemind=Date.now();}
}
/* เตือนซ้ำทุก 1 นาที ถ้ามีเรื่องค้าง: ออเดอร์ใหม่ที่ยังไม่มีใครกดเริ่มทำเกิน 2 นาที (ครัว) / ลูกค้าเรียกหรือขอบิลแล้วยังไม่มีใครรับทราบเกิน 1 นาที / อาหารพร้อมเสิร์ฟค้างเกิน 2 นาที (หน้าร้าน)
   (เดิมดังครั้งเดียว ไม่ได้ยินก็พลาดเลย) */
var lastRemind=0,REMIND_MS=60000;
function remind(){
  if(!S.d||!$('#login').hidden||!soundReady()||Date.now()-lastRemind<REMIND_MS)return;
  // เวลาจากเซิร์ฟเวอร์ (createdAt, เวลาเรียก) เทียบกับ now() ที่ชดเชยนาฬิกาเครื่องนี้ต่างจากเครื่องร้านแล้ว (S.skew)
  // ไม่อย่างนั้นแท็บเล็ตนาฬิกาเร็วจะเห็นทุกออเดอร์ค้างแล้วเตือนทุกนาที · เวลาพร้อมเสิร์ฟจดด้วยนาฬิกาเครื่องนี้ เทียบกับ Date.now()
  var sv=now(),local=Date.now(),kind=null;
  if(hears('order')&&S.d.tickets.some(function(k){return k.status==='new'&&stationOk(k)&&sv-k.createdAt>=120000;}))kind='order';
  else if(hears('bill')&&Object.keys(S.d.calls).some(function(t){return S.d.calls[t].kind==='bill'&&sv-S.d.calls[t].at>=60000;}))kind='bill';
  else if(hears('call')&&Object.keys(S.d.calls).some(function(t){return S.d.calls[t].kind!=='bill'&&sv-S.d.calls[t].at>=60000;}))kind='call';
  else if(hears('ready')&&S.d.tickets.some(function(k){return k.status==='ready'&&local-(readyAt[k.id]||local)>=120000;}))kind='ready';
  if(kind){beep(kind);lastRemind=local;}
}
setInterval(remind,10000);

var loading=false,again=false;
function load(){
  if(loading){again=true;return;}
  loading=true;
  api('/api/state').then(function(r){
    if(r.status===401){showLogin();return;}
    if(!r.ok)return;
    $('#login').hidden=true;
    S.d=r.j;
    S.skew=S.d.now-Date.now();
    if(S.sel&&S.sel>S.d.settings.tables)S.sel=null;
    detectNew();
    $('#brand').textContent=S.d.settings.shop+' · '+S.d.me.name+' ('+(S.d.roles[S.d.me.role]||S.d.me.role)+')';
    setLogo($('#brand-logo'),S.d.settings.logo);
    applyTheme(S.d.settings.accent);
    var qc=S.d.settings.modes.table&&S.d.qrClosed;       // ร้านที่ไม่ใช้โต๊ะ: ไม่มี QR โต๊ะให้ปิด ไม่ต้องขึ้นป้าย
    $('#closedpill').hidden=!qc;
    $('#closedpill').textContent=qc==='hours'?'นอกเวลารับออเดอร์ QR ('+S.d.settings.hours.open+'–'+S.d.settings.hours.close+')':'ปิดรับออเดอร์ QR';
    if(S.tab==='report')loadReport();
    if(S.tab==='docs')refreshDocs();
    render();
    connect();
  },function(){setConn(false);}).then(function(){
    loading=false;
    if(again){again=false;load();}
  });
}
function loadReport(){
  if(isOwner()&&!S.bizList)loadBiz();              // ชื่อประเภทธุรกิจในประวัติการแก้ไข
  if(isOwner())api('/api/audit').then(function(r){if(r.ok){S.audit=r.j;if(S.tab==='report'&&!S.viewSale)renderReport();}},function(){});
  return api('/api/report').then(function(r){if(r.ok){S.report=r.j;if(S.tab==='report')renderReport();}},function(){});
}

/* live updates; reload everything after a reconnect so nothing is missed */
var es=null,opened=false;
/* จอครัวไม่ดับระหว่างทำงาน (เบราว์เซอร์อนุญาตเฉพาะ https/localhost ที่อื่นข้ามไปเงียบๆ) */
var wake=null;
function keepAwake(){if(wake||document.hidden||!navigator.wakeLock||S.tab!=='kitchen')return;navigator.wakeLock.request('screen').then(function(w){wake=w;w.addEventListener('release',function(){wake=null;});},function(){});}
document.addEventListener('visibilitychange',keepAwake);
document.addEventListener('click',keepAwake);
function setConn(ok){var c=$('#conn');c.textContent=ok?'ออนไลน์':'ขาดการเชื่อมต่อ';c.className='pill '+(ok?'ok':'crit');}
function connect(){
  if(es&&es.readyState!==2)return;
  es=new EventSource('/api/events');
  es.onopen=function(){setConn(true);if(opened)load();opened=true;};
  es.addEventListener('change',load);
  es.onerror=function(){setConn(false);};
}
setInterval(function(){if(S.d&&(!es||es.readyState===2)){es=null;load();}},10000);
function showLogin(){if(es){es.close();es=null;}opened=false;$('#login').hidden=false;setTimeout(function(){$('#pin').focus();},50);}
$('#loginform').addEventListener('submit',function(e){
  e.preventDefault();
  api('/api/login',{pin:$('#pin').value}).then(function(r){
    if(r.ok){$('#pin').value='';$('#loginerr').textContent='';load();}
    else $('#loginerr').textContent=r.j.error||'เข้าสู่ระบบไม่สำเร็จ';
  },function(){$('#loginerr').textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';});
});

/* ---------- render ---------- */
function readyQueues(){var q={};S.d.tickets.forEach(function(k){if(k.table===0)q[k.q]=(q[k.q]!==false)&&k.status==='ready';});return Object.keys(q).filter(function(n){return q[n];}).map(Number);}
function renderTabs(){
  var d=S.d,t=words(),act=d.tickets.filter(function(k){return k.status==='new'||k.status==='cooking';}).length;
  var rd=d.tickets.filter(function(k){return k.status==='ready'&&k.table>0;}).length+Object.keys(d.calls).length;
  var allow=allowedTabs();
  if(allow.indexOf(S.tab)<0)S.tab=allow[0];
  var L={counter:['ขายหน้าร้าน',readyQueues().length],kitchen:[t.kitchen,act],tables:['โต๊ะ & บิล',rd],docs:['เอกสาร',d.docStats?d.docStats.overdue:0],stock:['สต็อก',modes().stock?lowItems().length:0],
    menu:[isOwner()?t.item:t.item+'หมด',0],report:['สรุปยอด',0],settings:['ตั้งค่า',0]};
  $('#tabs').style.setProperty('--n',allow.length);
  $('#tabs').classList.toggle('many',allow.length>5);
  $('#tabs').innerHTML=allow.map(function(v){
    return '<button class="tab" role="tab" data-a="tab" data-v="'+v+'" aria-selected="'+(S.tab===v)+'">'+esc(L[v][0])+(L[v][1]?'<span class="badge">'+L[v][1]+'</span>':'')+'</button>';
  }).join('');
  ['counter','kitchen','tables','docs','stock','menu','report','settings'].forEach(function(v){$('#v-'+v).hidden=S.tab!==v;});
}

function renderKitchen(){
  var d=S.d,h='';
  if(!d.settings.acceptOrders)h+='<div class="banner warn"><span>ปิดรับออเดอร์ผ่าน QR อยู่ ลูกค้าสั่งเองไม่ได้ (พนักงานยังสั่งแทนได้)</span><button class="btn sm" data-a="openorders">เปิดรับออเดอร์</button></div>';
  h+='<div class="tools">';
  [['all','ทั้งหมด']].concat(Object.keys(d.stations).map(function(k){return [k,d.stations[k]];})).forEach(function(s){
    h+='<button class="cat" data-a="kst" data-s="'+esc(s[0])+'" aria-pressed="'+(S.kStation===s[0])+'">'+esc(s[1])+'</button>';
  });
  h+='</div>';
  var list=d.tickets.filter(function(k){return k.status!=='served'&&(S.kStation==='all'||k.station===S.kStation);});
  var rank={new:0,cooking:0,ready:1};
  list.sort(function(a,b){return rank[a.status]-rank[b.status]||a.createdAt-b.createdAt;});
  var agg={},keys=[];
  list.forEach(function(k){if(k.status==='ready')return;k.items.forEach(function(it){if(!agg[it.name]){agg[it.name]=0;keys.push(it.name);}agg[it.name]+=it.qty;});});
  if(keys.length){
    keys.sort(function(a,b){return agg[b]-agg[a];});
    h+='<div class="agg"><span class="muted" style="font-size:.85rem">ทำรวม</span>'+keys.map(function(n){return '<span class="pill">'+esc(n)+' ×'+agg[n]+'</span>';}).join('')+'</div>';
  }
  if(!list.length){
    var m0=modes();
    h+='<div class="panel empty">ไม่มีออเดอร์ค้าง<br>'+(m0.table&&m0.counter?'ออเดอร์จากลูกค้าที่สแกน QR และคิวจากหน้าร้านจะขึ้นที่นี่ทันที':m0.table?'ออเดอร์จากลูกค้าที่สแกน QR จะขึ้นที่นี่ทันที':'คิวจากหน้าขายหน้าร้านจะขึ้นที่นี่ทันที')+'</div>';
    $('#v-kitchen').innerHTML=h;return;
  }
  var NEXT={new:['cooking','เริ่มทำ'],cooking:['ready','ทำเสร็จ'],ready:['served','เสิร์ฟแล้ว']};
  h+='<div class="board">'+list.map(function(k){
    var nx=k.table===0&&k.status==='ready'?['served','ลูกค้ารับแล้ว']:NEXT[k.status];
    var m=mins(k.createdAt),cls='w-ok';
    if(k.status==='ready')cls='w-ready';else if(m>=CRIT)cls='w-crit';else if(m>=WARN)cls='w-warn';
    var pill=k.status==='ready'?'<span class="pill ok">พร้อมเสิร์ฟ</span>':(k.status==='cooking'?'<span class="pill acc">กำลังทำ</span>':'<span class="pill">ใหม่</span>');
    return '<div class="card '+cls+'"><div class="card-h"><span class="t">'+where(k)+'</span><b>'+m+' นาที</b></div>'+
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="muted" style="font-size:.85rem">'+esc(d.stations[k.station]||k.station)+'</span>'+pill+(cls==='w-crit'?'<span class="pill crit">รอนาน</span>':cls==='w-warn'?'<span class="pill warn">เริ่มช้า</span>':'')+(k.table===0?'<span class="pill">หน้าร้าน · จ่ายแล้ว</span>':k.by==='staff'?'<span class="pill">พนักงานสั่ง</span>':'')+'</div>'+
      '<ul>'+k.items.map(function(it){return '<li><b>×'+it.qty+'</b><span>'+esc(it.name)+(it.note.length?'<br><span class="note-txt">'+esc(it.note.join(' · '))+'</span>':'')+'</span></li>';}).join('')+'</ul>'+
      (k.memo?'<div class="memo-txt">'+esc(k.memo)+'</div>':'')+
      '<div class="card-act"><button class="btn primary" data-a="adv" data-id="'+k.id+'" data-from="'+k.status+'" data-st="'+nx[0]+'">'+nx[1]+'</button>'+
      (k.status==='ready'||!canMoney()||k.table===0?'':'<button class="btn" data-a="void" data-id="'+k.id+'">ยกเลิก</button>')+'</div></div>';
  }).join('')+'</div>';
  $('#v-kitchen').innerHTML=h;
}

function receiptHtml(o){
  var s=S.d.settings;
  var h=(s.logo?'<img class="rlogo" src="/img/'+esc(s.logo)+'" alt="">':'')+'<div class="shop">'+esc(s.shop)+'</div>';
  if(s.address)h+='<div class="sub">'+esc(s.address)+'</div>';
  if(s.phone)h+='<div class="sub">โทร '+esc(s.phone)+'</div>';
  if(s.taxId)h+='<div class="sub">เลขประจำตัวผู้เสียภาษี '+esc(s.taxId)+'</div>';
  h+='<div class="doc">'+o.title+'</div><hr>';
  // ขายหน้าร้านไม่มีโต๊ะ: แสดงเลขคิว หรือ "ขายหน้าร้าน" · รับซื้อ: ร้านเป็นคนจ่าย
  var place=o.table?'โต๊ะ '+o.table:(o.q?'คิว '+o.q:o.doc?'ชำระตาม '+esc(o.doc):'ขายหน้าร้าน');
  h+='<div class="meta"><span>'+(o.no?'เลขที่ '+o.no:'ยังไม่ได้ชำระเงิน')+'</span><span>'+place+'</span></div><div class="meta"><span>'+fmtDate(o.at)+'</span>'+(o.method?'<span>'+(o.buy?'จ่ายโดย ':'ชำระโดย ')+(o.method==='transfer'?'โอน/QR':'เงินสด')+'</span>':'')+'</div>';
  if(o.memo)h+='<div class="meta"><span>หมายเหตุ: '+esc(o.memo)+'</span></div>';
  h+='<hr>';
  // จำนวนทศนิยม/มีหน่วย (ขายตามน้ำหนัก): บรรทัดเล็กบอก จำนวน หน่วย × ราคาต่อหน่วย
  h+='<table>'+o.lines.map(function(l){var w=l.unit||l.qty!==Math.floor(l.qty);return '<tr>'+(w?'<td colspan="2">'+esc(l.name)+'<span class="ux">'+fmtQty(l.qty)+(l.unit?' '+esc(l.unit):'')+' × '+baht(l.price)+'</span>':'<td class="q">'+l.qty+'×</td><td>'+esc(l.name))+'</td><td class="a">'+baht(round2(l.price*l.qty))+'</td></tr>';}).join('')+'</table><hr>';
  h+='<table><tr><td>'+esc(o.doc?'รวมเป็นเงิน':words().sub)+'</td><td class="a">'+baht(o.sub)+'</td></tr>';
  if(o.disc)h+='<tr><td>ส่วนลด</td><td class="a">−'+baht(o.disc)+'</td></tr>';
  if(o.svc)h+='<tr><td>ค่าบริการ 10%</td><td class="a">'+baht(o.svc)+'</td></tr>';
  if(o.vat)h+='<tr><td>VAT 7%</td><td class="a">'+baht(o.vat)+'</td></tr>';
  h+='<tr class="grand"><td>'+(o.buy?'รวมเงินที่จ่าย':'รวมสุทธิ')+'</td><td class="a">'+baht(o.total)+'</td></tr>';
  if(o.received!=null)h+='<tr><td>รับเงิน</td><td class="a">'+baht(o.received)+'</td></tr><tr><td>เงินทอน</td><td class="a">'+baht(o.change)+'</td></tr>';
  h+='</table>';
  if(o.qr){
    var pay=o.total;
    h+='<hr><div class="qr">';
    // ร้านอัปโหลดรูป QR ของตัวเอง: ใช้รูปนั้น (ใส่ยอดให้ไม่ได้ บอกยอดตัวใหญ่ให้ลูกค้าพิมพ์เอง) ไม่มีรูปใช้ QR ที่สร้างจากเบอร์ (ใส่ยอดให้แล้ว)
    var payload=s.payQr?null:ppPayload(s.promptpay,pay),svg=payload?qrSvg(payload,'PromptPay QR'):'';
    if(s.payQr)h+='<img class="payqr" src="/img/'+esc(s.payQr)+'" alt="QR รับเงินของร้าน"><small>สแกนจ่าย แล้วใส่ยอด <b>'+baht(pay)+'</b></small>';
    else if(svg)h+=svg+'<small>สแกนจ่ายผ่าน PromptPay '+baht(pay)+'</small>';
    else h+='<small>ตั้งค่าเบอร์ PromptPay ในแท็บ "ตั้งค่า" เพื่อแสดง QR รับเงิน</small>';
    h+='</div>';
  }
  if(s.footer)h+='<hr><div class="sub">'+esc(s.footer)+'</div>';
  return h;
}

/* เงินทอน: คิดในหน้าจอ เซิร์ฟเวอร์ตรวจซ้ำและบันทึกลง audit log */
function round2(n){return Math.round(n*100)/100;}
// กำลังพิมพ์เงินที่รับมา: อย่าวาดหน้าโต๊ะใหม่ทับ (เฉพาะตอนปุ่มรับเงินสดรอยืนยันอยู่)
function cashTyping(){var a=document.activeElement;return !!(a&&a.id==='cash-in'&&S.confirm&&/:cash$/.test(S.confirm));}
// raw = ตัวเลขที่พิมพ์ในช่องรับเงิน (ไม่ส่ง = ช่องของหน้าโต๊ะ S.cash · หน้าขายหน้าร้านส่ง S.pos.cash)
function cashState(due,raw){var v=raw===undefined?S.cash:raw,got=v===''?null:+v;return {got:got,short:got!==null&&!(got>=due),change:got===null?null:round2(got-due)};}
function cashInfo(due,raw){
  var c=cashState(due,raw);
  if(c.got!==null&&isNaN(c.got))return '<span class="cash-out short">ใส่ตัวเลขให้ถูกต้อง</span>';
  if(c.got===null)return '<span class="muted small">ใส่จำนวนเงินที่รับมาเพื่อคำนวณเงินทอน (รับพอดีไม่ต้องใส่)</span>';
  if(c.short)return '<span class="cash-out short">เงินไม่พอ ขาดอีก '+baht(round2(due-c.got))+'</span>';
  return '<span class="cash-out">ทอน '+baht(c.change)+'</span>';
}
function quickCash(due){
  var out=[due];[100,500,1000].forEach(function(u){var v=Math.ceil(due/u)*u;if(out.indexOf(v)<0)out.push(v);});
  return out.slice(0,4);
}
function updateCash(due){
  var el=$('#cash-change');if(el)el.innerHTML=cashInfo(due);
  var b=document.querySelector('[data-a="pay"][data-m="cash"]');if(b)b.disabled=cashState(due).short;
}

/* ---------- ขายหน้าร้าน ----------
   ตะกร้าอยู่ในเครื่องนี้ (localStorage) รีเฟรชแล้วไม่หาย reqId เก็บคู่กับตะกร้า (แบบเดียวกับกฎข้อ 23) ตะกร้าเปลี่ยน = reqId ใหม่
   ยอดที่เห็นคิดด้วย posTotals() แบบเดียวกับเซิร์ฟเวอร์ (รวมแถวสินค้าเดียวกันราคาเดียวกัน ปัดเป็นสตางค์ต่อแถว)
   แต่เซิร์ฟเวอร์คิดใหม่เองเสมอ และรับ expectedSub ที่จำไว้ตอนกดรับเงินครั้งแรก (กฎข้อ 22) ไม่ใช่ยอดตอนกดยืนยัน
   ช่องค้นหา #pos-q สร้างครั้งเดียว อยู่นอกส่วนที่วาดใหม่ สแกนบาร์โค้ดระหว่างมีออเดอร์เข้า ตัวอักษรไม่หาย */
var POS_KEY='ordervai-pos';
function posInit(){
  if(S.pos)return S.pos;
  var p={lines:[],memo:'',level:'retail',kind:null,kitchen:true,svc:false,vat:null,cat:0,q:'',reqId:null,cash:'',paySub:null,last:null,busy:false,noteOpen:-1};
  try{
    var j=JSON.parse(localStorage.getItem(POS_KEY)||'null');
    if(j&&j.v===1&&Array.isArray(j.lines)){
      p.lines=j.lines.filter(function(l){return l&&typeof l.id==='number'&&typeof l.qty==='number'&&l.qty>0;}).map(function(l){
        return {id:l.id,qty:l.qty,txt:String(l.qty),note:Array.isArray(l.note)?l.note.filter(function(n){return typeof n==='string';}):[]};
      });
      p.memo=typeof j.memo==='string'?j.memo:'';p.level=j.level==='wholesale'?'wholesale':'retail';
      p.kind=j.kind==='buy'||j.kind==='sell'?j.kind:null;p.reqId=typeof j.reqId==='string'&&/^[a-f0-9]{8,64}$/.test(j.reqId)?j.reqId:null;
    }
  }catch(e){}
  return (S.pos=p);
}
function savePos(){
  var p=S.pos;if(!p)return;
  try{localStorage.setItem(POS_KEY,JSON.stringify({v:1,lines:p.lines.filter(function(l){return l.qty>0;}).map(function(l){return {id:l.id,qty:l.qty,note:l.note};}),memo:p.memo,level:p.level,kind:p.kind,reqId:p.reqId}));}catch(e){}
}
function rid(){
  var a=new Uint8Array(8);
  try{crypto.getRandomValues(a);}catch(e){for(var i=0;i<8;i++)a[i]=Math.floor(Math.random()*256);}
  return Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
}
// ขาย / รับซื้อ: ร้านรับซื้อของเริ่มที่รับซื้อ ร้านอื่นเริ่มที่ขาย (ไม่ได้เปิดโหมดรับซื้อ = ขายเสมอ)
function posKind(){var p=posInit();if(!modes().buy)return 'sell';return p.kind||(S.d.biz&&S.d.biz.kind==='buy'?'buy':'sell');}
function posPrice(m,kind){return kind==='sell'&&S.pos.level==='wholesale'&&m.price2>0?m.price2:m.price;}
function okLine(l,m){return l.qty>0&&(m.dec?l.qty<=100000:(l.qty===Math.floor(l.qty)&&l.qty<=10000));}
function posTotals(){
  var p=posInit(),kind=posKind(),map={},order=[],bad=false;
  p.lines.forEach(function(l){
    var m=itemById(l.id);if(!m)return;
    if(!okLine(l,m)){bad=true;return;}
    var pr=posPrice(m,kind),k=m.id+'|'+pr;
    if(!map[k]){map[k]={qty:0,price:pr};order.push(k);}
    map[k].qty=Math.round((map[k].qty+l.qty)*1000)/1000;
  });
  var sub=0;order.forEach(function(k){sub+=round2(map[k].price*map[k].qty);});
  sub=round2(sub);
  var c=kind==='buy'?{sub:sub,svc:0,vat:0,total:sub}:calc(sub,!!p.svc,p.vat===null?!!S.d.settings.vat:!!p.vat);
  c.bad=bad;c.kind=kind;c.count=order.length;
  return c;
}
// ตะกร้าเปลี่ยน: ยอดที่จำไว้ตอนกดรับเงินใช้ไม่ได้แล้ว ต้องกดใหม่ และคำขอนี้เป็นคนละรายการกับที่เคยส่ง (reqId ใหม่)
function posChanged(){var p=S.pos;p.reqId=null;p.last=null;if(S.confirm&&/^ppay:/.test(S.confirm))disarm();}
function posVatOn(){var p=posInit();return p.vat===null?!!S.d.settings.vat:!!p.vat;}
function posAdd(id,qty,scan){
  var p=posInit(),m=itemById(id),kind=posKind();if(!m||m.hidden)return;
  if(kind==='sell'&&S.d.settings.soldOut.indexOf(id)>=0){toast(m.name+' หมดแล้ว');return;}
  posChanged();
  var l=p.lines.filter(function(x){return x.id===id&&!x.note.length;}).pop();
  if(qty==null&&m.dec){
    // ขายตามน้ำหนัก: แตะสินค้า = ใส่น้ำหนักเอง (สแกนบาร์โค้ด = 1 หน่วย ไม่ย้ายโฟกัสออกจากช่องสแกน)
    if(!l){l={id:id,qty:1,txt:'1',note:[]};p.lines.push(l);}
    else if(scan){l.qty=Math.round((l.qty+1)*1000)/1000;l.txt=String(l.qty);}
    savePos();renderPosCart();renderPosGrid();
    if(!scan){var el=$('#pos-qty-'+p.lines.indexOf(l));if(el){el.focus();el.select();}}
    return;
  }
  qty=qty||1;
  if(l){l.qty=m.dec?Math.round((l.qty+qty)*1000)/1000:l.qty+qty;l.txt=String(l.qty);}
  else p.lines.push({id:id,qty:m.dec?Math.round(qty*1000)/1000:qty,txt:String(qty),note:[]});
  savePos();renderPosCart();renderPosGrid();
}
// สแกนบาร์โค้ด/พิมพ์รหัสแล้ว Enter: รหัสตรงทุกตัว → เพิ่มเลย ไม่ตรงแต่ค้นเจออย่างเดียว → เพิ่มอันนั้น · "3*รหัส" = 3 ชิ้น
function posScan(v){
  v=String(v||'').trim();if(!v)return;
  var qty=null,mt=v.match(/^(\d+(?:\.\d+)?)\s*[*xX×]\s*(.+)$/);
  if(mt){qty=+mt[1];v=mt[2].trim();}
  var lv=v.toLowerCase(),items=S.d.menu.items.filter(function(m){return !m.hidden;});
  var hit=items.filter(function(m){return m.sku&&m.sku.toLowerCase()===lv;})[0];
  if(!hit){var f=items.filter(function(m){return m.name.toLowerCase().indexOf(lv)>=0||(m.sku&&m.sku.toLowerCase().indexOf(lv)>=0);});if(f.length===1)hit=f[0];}
  if(!hit){toast('ไม่พบ'+words().item+' "'+v+'"');return;}
  if(qty!=null&&!(qty>0)){toast('จำนวนไม่ถูกต้อง');return;}
  if(qty!=null&&!hit.dec&&qty!==Math.floor(qty)){toast(hit.name+' ขายเป็นจำนวนเต็มเท่านั้น');return;}
  posAdd(hit.id,qty,true);
  var q=$('#pos-q');if(q){q.value='';q.focus();}S.pos.q='';renderPosGrid();
}
function renderCounter(){
  var p=posInit(),v=$('#v-counter');
  if(!$('#pos-q')){
    v.innerHTML='<div id="pos-qs"></div><div class="pos"><div class="panel"><div class="pos-search"><label class="f" for="pos-q">ค้นหา หรือสแกนบาร์โค้ด'+
      '<input class="in" id="pos-q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="done"></label></div><div class="tools" id="pos-cats"></div><div class="pgrid" id="pos-grid"></div></div>'+
      '<aside class="panel pos-cart" id="pos-cart" aria-labelledby="pos-cart-h"></aside></div><button class="pos-sum" id="pos-sum" data-a="posjump" type="button" hidden></button>';
    $('#pos-q').value=p.q;
  }
  $('#pos-q').placeholder='ชื่อ'+words().item+' หรือรหัส แล้วกด Enter · 3*รหัส = 3 ชิ้น';
  // สินค้าที่ถูกลบ/ซ่อนจากอีกเครื่อง: เอาออกจากตะกร้าแล้วบอก (ไม่ปล่อยให้กดรับเงินแล้วได้ error)
  var gone=p.lines.filter(function(l){var m=itemById(l.id);return !m||m.hidden;});
  if(gone.length){p.lines=p.lines.filter(function(l){return gone.indexOf(l)<0;});posChanged();savePos();toast('เอา'+words().item+'ที่ไม่มีขายแล้วออกจากตะกร้า '+gone.length+' รายการ');}
  renderPosQueue();renderPosCats();renderPosGrid();renderPosCart();
}
/* คิวที่ส่งเข้าจอครัว/บาร์: พร้อมรับ = ทุกจุดทำเสร็จแล้ว หน้าร้านเรียกคิวแล้วกด "ลูกค้ารับแล้ว" */
function renderPosQueue(){
  var el=$('#pos-qs');if(!el)return;
  var qs={},order=[];
  S.d.tickets.forEach(function(k){if(k.table!==0)return;if(!qs[k.q]){qs[k.q]=[];order.push(k.q);}qs[k.q].push(k);});
  if(!order.length||!modes().kitchen){redraw(el,'');return;}
  var ready=order.filter(function(q){return qs[q].every(function(k){return k.status==='ready';});}),wait=order.filter(function(q){return ready.indexOf(q)<0;});
  var h='<div class="qstrip" aria-live="polite">';
  if(ready.length)h+=ready.map(function(q){return '<span class="qchip">คิว '+q+' พร้อมรับ<button class="btn sm" data-a="qdone" data-id="'+q+'">ลูกค้ารับแล้ว</button></span>';}).join('');
  if(wait.length)h+='<span class="pill acc">กำลังทำ: คิว '+wait.join(', ')+'</span>';
  redraw(el,h+'</div>');
}
function renderPosCats(){
  var el=$('#pos-cats');if(!el)return;
  var p=S.pos,mm=S.d.menu,used={};
  mm.items.forEach(function(m){if(!m.hidden)used[m.cat]=1;});
  var cats=mm.categories.filter(function(c){return used[c.id];});
  if(p.cat&&!used[p.cat])p.cat=0;
  redraw(el,cats.length>1?[{id:0,name:'ทั้งหมด'}].concat(cats).map(function(c){return '<button class="cat" data-a="pcat" data-id="'+c.id+'" aria-pressed="'+(p.cat===c.id)+'">'+esc(c.name)+'</button>';}).join(''):'');
}
function renderPosGrid(){
  var el=$('#pos-grid');if(!el)return;
  var p=S.pos,mm=S.d.menu,q=String(p.q||'').trim().toLowerCase(),order={},kind=posKind(),so=S.d.settings.soldOut,inCart={},MAX=300;
  mm.categories.forEach(function(c,i){order[c.id]=i;});
  p.lines.forEach(function(l){if(l.qty>0)inCart[l.id]=Math.round(((inCart[l.id]||0)+l.qty)*1000)/1000;});
  // ค้นหา = ทุกหมวด
  var list=mm.items.filter(function(m){return !m.hidden&&(q?(m.name.toLowerCase().indexOf(q)>=0||(m.sku&&m.sku.toLowerCase().indexOf(q)>=0)):(!p.cat||m.cat===p.cat));})
    .sort(function(a,b){return (order[a.cat]||0)-(order[b.cat]||0);});
  var h=list.slice(0,MAX).map(function(m){
    var out=kind==='sell'&&so.indexOf(m.id)>=0,pr=posPrice(m,kind);
    return '<button class="pitem" data-a="padd" data-id="'+m.id+'"'+(out?' disabled':'')+'>'+(m.image?'<img src="/img/'+esc(m.image)+'" alt="" loading="lazy">':'')+
      '<span class="nm">'+esc(m.name)+'</span><span class="pr">'+baht(pr)+(m.unit?' <span class="muted small">/ '+esc(m.unit)+'</span>':'')+'</span>'+
      (m.sku?'<span class="sk">'+esc(m.sku)+'</span>':'')+(out?'<span class="pill crit">หมด</span>':'')+(tracked(m)?'<span class="sk'+(m.stock<=0?' negq':'')+'">'+(m.stock<=0?'สต็อกหมด':'เหลือ '+fmtQty(m.stock))+'</span>':'')+(inCart[m.id]?'<span class="inc" aria-label="ในตะกร้า '+fmtQty(inCart[m.id])+'">'+fmtQty(inCart[m.id])+'</span>':'')+'</button>';
  }).join('');
  if(!list.length)h='<div class="empty" style="grid-column:1/-1">'+(mm.items.length?(q?'ไม่พบ'+esc(words().item)+'ที่ตรงกับ “'+esc(p.q)+'”':'หมวดนี้ไม่มี'+esc(words().item)):'ยังไม่มี'+esc(words().item)+' '+(isOwner()?'เพิ่มได้ที่แท็บ'+esc(words().item):'ให้เจ้าของร้านเพิ่มก่อน'))+'</div>';
  else if(list.length>MAX)h+='<div class="muted small" style="grid-column:1/-1">แสดง '+MAX+' จาก '+list.length+' รายการ พิมพ์ค้นหาเพื่อดูรายการอื่น</div>';
  redraw(el,h);
}
function posPayBox(c){
  var p=S.pos,s=S.d.settings,h='';
  if(armed('ppay:cash')&&c.kind==='sell'){
    h+='<div class="panel cash"><label class="f" for="pos-cash">รับเงินมา (บาท)<input class="in" id="pos-cash" type="text" inputmode="decimal" value="'+esc(p.cash)+'" autocomplete="off"></label>'+
      '<div class="q">'+quickCash(c.total).map(function(v){return '<button class="btn sm" data-a="pcashq" data-v="'+v+'">'+baht(v)+'</button>';}).join('')+'</div>'+
      '<div id="pos-change" aria-live="polite">'+cashInfo(c.total,p.cash)+'</div></div>';
  }
  if(armed('ppay:transfer')&&c.kind==='sell'){
    // ให้ลูกค้าสแกนจ่ายจากจอนี้ แล้วค่อยกดยืนยันเมื่อเห็นเงินเข้า
    var payload=s.payQr?null:ppPayload(s.promptpay,c.total),svg=payload?qrSvg(payload,'PromptPay QR'):'';
    h+='<div class="receipt" style="max-width:none"><div class="qr">'+(s.payQr?'<img class="payqr" src="/img/'+esc(s.payQr)+'" alt="QR รับเงินของร้าน"><small>สแกนจ่าย แล้วใส่ยอด <b>'+baht(c.total)+'</b></small>':
      svg?svg+'<small>สแกนจ่ายผ่าน PromptPay '+baht(c.total)+'</small>':'<small>ตั้งค่าเบอร์ PromptPay ในแท็บตั้งค่าเพื่อแสดง QR รับเงิน</small>')+'</div><p class="small" style="margin:6px 0 0;text-align:center">เห็นเงินเข้าแล้วกด "ยืนยัน"</p></div>';
  }
  var L=c.kind==='buy'?[['cash','จ่ายเงินสด'],['transfer','โอนให้ผู้ขาย']]:[['cash','รับเงินสด'],['transfer','รับโอน / QR']];
  var dis=!p.lines.length||c.bad||p.busy;
  h+='<div class="pay-two" style="margin-top:8px">'+L.map(function(x){
    var key='ppay:'+x[0],on=armed(key),short=x[0]==='cash'&&c.kind==='sell'&&on&&cashState(c.total,p.cash).short;
    return '<button class="btn '+(on?'danger':'primary')+'" data-a="ppay" data-m="'+x[0]+'"'+(dis||short?' disabled':'')+'>'+(p.busy?'กำลังบันทึก…':on?'ยืนยัน '+baht(c.total):x[1])+'</button>';
  }).join('')+'</div>';
  return h;
}
function renderPosCart(){
  var el=$('#pos-cart');if(!el)return;
  var p=S.pos,t=words(),m=modes(),c=posTotals(),kind=c.kind,h='';
  if(p.last){
    var L=p.last,sl=L.sale,buy=sl.kind==='buy',cash=L.received!=null?{received:L.received,change:L.change}:null;
    h='<div class="sec-title"><h3 id="pos-cart-h">'+(buy?'รับซื้อแล้ว':'ขายแล้ว')+'</h3><span class="muted small">เลขที่ '+billNo(sl.no,sl.at)+'</span></div>';
    if(L.queue)h+='<p class="qbig">คิว<b>'+L.queue+'</b> <span class="muted small">ส่งเข้า'+esc(t.kitchen)+'แล้ว</span></p>';
    h+='<p class="cash-out" style="margin:0 0 6px">'+(buy?'จ่าย':'รับ')+(sl.method==='transfer'?'โอน ':'เงินสด ')+baht(sl.total)+'</p>'+(cash?'<p style="margin:0 0 10px">รับมา '+baht(cash.received)+' · <b>ทอน '+baht(cash.change)+'</b></p>':'');
    h+='<div class="stack" style="gap:8px"><button class="btn primary block" data-a="printr">พิมพ์'+(buy?'ใบรับซื้อ':'ใบเสร็จ')+'</button><button class="btn block" data-a="posnext">'+(buy?'รับซื้อรายการถัดไป':'ขายรายการถัดไป')+'</button></div>';
    h+='<div class="receipt-box" style="margin-top:14px"><div class="receipt">'+saleReceipt(sl,cash)+'</div></div>';
    redraw(el,h);renderPosSum(c);return;
  }
  h+='<div class="sec-title"><h3 id="pos-cart-h">'+(kind==='buy'?'รายการรับซื้อ':'ตะกร้า')+'</h3>'+(p.lines.length?'<button class="linkbtn" data-a="posclear">'+(armed('posclear')?'แตะอีกครั้งเพื่อล้างตะกร้า':'ล้างตะกร้า')+'</button>':'')+'</div>';
  if(m.buy)h+='<div class="row" style="margin-bottom:8px"><span>รายการนี้</span><span class="seg" role="group" aria-label="ขายหรือรับซื้อ"><button data-a="pkind" data-v="sell" aria-pressed="'+(kind==='sell')+'">ขาย</button><button data-a="pkind" data-v="buy" aria-pressed="'+(kind==='buy')+'">รับซื้อ</button></span></div>';
  if(!p.lines.length)h+='<div class="empty">'+(kind==='buy'?'เลือกของที่รับซื้อ แล้วใส่น้ำหนัก':'แตะ'+esc(t.item)+' หรือสแกนบาร์โค้ดเพื่อเพิ่มลงตะกร้า')+'</div>';
  var canNote=kind==='sell'&&m.kitchen&&p.kitchen&&S.d.menu.notes.length;
  p.lines.forEach(function(l,i){
    var mi=itemById(l.id);if(!mi)return;
    var pr=posPrice(mi,kind),ok=okLine(l,mi);
    // ขายเกินสต็อกในระบบได้ (ของอยู่ในมือแคชเชียร์แล้ว ยอดในระบบอาจผิด) แค่เตือน · รวมทุกแถวของสินค้าเดียวกัน
    var inCart=kind==='sell'&&tracked(mi)?p.lines.reduce(function(a2,x){return x.id===mi.id&&x.qty>0?a2+x.qty:a2;},0):0;
    h+='<div class="cline"><div><div class="nm">'+esc(mi.name)+'</div><div class="muted small">'+baht(pr)+(mi.unit?' / '+esc(mi.unit):'')+(pr!==mi.price?' · ราคาส่ง':'')+'</div>'+

function renderPosSum(c){
  var b=$('#pos-sum');if(!b)return;
  var p=S.pos;
  b.hidden=!p.lines.length&&!p.last;
  b.innerHTML=p.last?'<span>'+(p.last.sale.kind==='buy'?'รับซื้อแล้ว':'ขายแล้ว')+' '+baht(p.last.sale.total)+'</span><span>ดูใบเสร็จ ↓</span>':'<span>'+(c.kind==='buy'?'รับซื้อ':'ตะกร้า')+' '+p.lines.length+' รายการ</span><span>'+baht(c.total)+' ↓</span>';
}
function posQty(i,txt){
  var p=S.pos,l=p.lines[i],m=l&&itemById(l.id);if(!l||!m)return;
  var v=+String(txt).replace(/,/g,'').trim();
  l.txt=String(txt);
  l.qty=String(txt).trim()!==''&&isFinite(v)?(m.dec?Math.round(v*1000)/1000:v):NaN;
  posChanged();savePos();renderPosCart();renderPosGrid();
}
function posPay(method){
  var p=S.pos,c=posTotals(),kind=c.kind;
  if(!p.reqId)p.reqId=rid();
  savePos();
  p.busy=true;renderPosCart();
  var body={items:p.lines.map(function(l){return {id:l.id,qty:l.qty,note:l.note};}),kind:kind,level:p.level,kitchen:modes().kitchen&&kind==='sell'&&!!p.kitchen,
    svc:kind==='sell'&&!!p.svc,vat:kind==='sell'&&posVatOn(),method:method,memo:p.memo,reqId:p.reqId,expectedSub:p.paySub};
  if(method==='cash'&&kind==='sell'&&p.cash!=='')body.received=+p.cash;
  act('/api/sale',body).then(function(r){
    p.busy=false;
    if(r&&r.ok){
      p.lines=[];p.memo='';p.reqId=null;p.cash='';p.noteOpen=-1;p.paySub=null;savePos();
      p.last={sale:r.j.sale,received:r.j.received,change:r.j.change,queue:r.j.queue};
      if(document.activeElement&&document.activeElement.id==='pos-cash')document.activeElement.blur();
      toast((kind==='buy'?'รับซื้อแล้ว จ่าย ':'ขายแล้ว รับ ')+baht(r.j.sale.total)+(r.j.change?' ทอน '+baht(r.j.change):'')+(r.j.queue?' · คิว '+r.j.queue:''));
    }
    render();
  });
}

function fv(v){
  if(v&&typeof v==='object'){var k=Object.keys(v).filter(function(x){return v[x]!==''&&v[x]!=null;});return k.length?k.map(function(x){return x+' '+(typeof v[x]==='object'?JSON.stringify(v[x]):v[x]);}).join(' '):'(ว่าง)';}
  return v===true?'เปิด':v===false?'ปิด':(v===''||v==null)?'(ว่าง)':String(v);
}
// ประเภทธุรกิจ/วิธีขายใน log เก็บเป็นรหัส แปลงเป็นชื่อที่อ่านได้
function fieldVal(k,v){
  if(k==='biz'){var p=(S.bizList||[]).filter(function(x){return x.key===v;})[0];return v?(p?p.name:v):'(ยังไม่ได้เลือก)';}
  if(k==='modes'&&v&&typeof v==='object'){var on=['table','kitchen','counter','buy','stock','docs'].filter(function(m){return v[m];}).map(function(m){return {table:'โต๊ะ',kitchen:'จอทำ',counter:'หน้าร้าน',buy:'รับซื้อ',stock:'สต็อก',docs:'เอกสาร'}[m];});return on.join(' + ')||'(ไม่มี)';}
  return fv(v);
}
function changes(e){return Object.keys(e.after||{}).map(function(k){return (FLD[k]||k)+' '+fieldVal(k,e.before&&e.before[k])+' → '+fieldVal(k,e.after[k]);}).join(', ');}

/* ---------- เอกสาร: ใบเสนอราคา ใบส่งของ/ใบแจ้งหนี้ ใบเสร็จ A4 ใบสั่งซื้อ ใบรับสินค้า ใบเบิก ใบตรวจนับ ----------
   ยอดเงินในหน้าจอคิดด้วย docCalc() สูตรเดียวกับ store.docTotals() (ปัดสตางค์ทีละแถว ส่วนลดเป็นบาท VAT 7% คิดเพิ่มหลังหักส่วนลด) แก้ต้องแก้ทั้งสองที่
   เซิร์ฟเวอร์คิดยอดใหม่เองเสมอ รับชำระส่ง expectedTotal ที่จำไว้ตอนกดครั้งแรก (แบบกฎข้อ 22)
   ช่องกรอกทุกช่องมี data-f / data-k / data-c เก็บค่าลง S.dc / S.sk ทันทีที่พิมพ์ วาดใหม่กี่ครั้งค่าก็ไม่หาย */
var DOC_NAME={QT:'ใบเสนอราคา',INV:'ใบส่งของ/ใบแจ้งหนี้',PO:'ใบสั่งซื้อ',GR:'ใบรับสินค้า',OUT:'ใบเบิก/ตัดสต็อก',CNT:'ใบตรวจนับสต็อก'};
var DOC_ST={open:{QT:'รอลูกค้าตอบ',PO:'รอรับของ'},accepted:'ลูกค้าตกลงแล้ว',cancelled:'ยกเลิกแล้ว',unpaid:'ค้างชำระ',paid:'ชำระแล้ว',received:'รับของแล้ว',done:'บันทึกแล้ว'};
var DOC_RE=/^(QT|INV|PO|GR|OUT|CNT)\d{4}-\d{4,6}$/;
function r3(n){return Math.round(n*1000)/1000;}
function docCalc(lines,discount,vatOn){
  var sub=round2(lines.reduce(function(a,l){return a+round2(l.qty*l.price);},0)),disc=Math.min(sub,round2(Math.max(0,+discount||0))),net=round2(sub-disc),vatAmt=vatOn?round2(net*0.07):0;
  return {sub:sub,disc:disc,net:net,vatAmt:vatAmt,total:round2(net+vatAmt)};
}
// จำนวนเงินเป็นตัวหนังสือ (แบบ BAHTTEXT): 21 = ยี่สิบเอ็ด, 101 = หนึ่งร้อยเอ็ด, 1,000,001 = หนึ่งล้านเอ็ด
var TH_D=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],TH_P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
function bahtText(n){
  var c=Math.round(Math.abs(+n||0)*100),b=Math.floor(c/100),s=c%100;
  function six(t,more){
    var o='',L=t.length;
    for(var i=0;i<L;i++){
      var d=+t[i],p=L-1-i;if(!d)continue;
      o+=(p===0&&d===1&&(more||+t.slice(0,-1)>0)?'เอ็ด':p===1&&d===2?'ยี่':p===1&&d===1?'':TH_D[d])+TH_P[p];
    }
    return o;
  }
  function read(t){return t.length>6?read(t.slice(0,-6))+'ล้าน'+six(t.slice(-6),true):six(t,false);}
  return (b?read(String(b))+'บาท':s?'':'ศูนย์บาท')+(s?six(String(s),false)+'สตางค์':'ถ้วน');
}
function money2(n){return Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ymdOf(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);}
function addDays(ymd,n){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd||'');if(!m)return '';return ymdOf(new Date(+m[1],+m[2]-1,+m[3]+n).getTime());}
function fmtDay(ts){return new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});}
function defDue(type,ymd){var s=S.d.settings;return type==='QT'?addDays(ymd,s.quoteDays):type==='INV'?addDays(ymd,s.creditDays):'';}
function overdue(d){return d.type==='INV'&&d.status==='unpaid'&&d.due!=null&&d.due+86400000<=now();}
function docStatus(d){
  var t=d.status==='open'?DOC_ST.open[d.type]:DOC_ST[d.status]||d.status;
  var cls=d.status==='cancelled'?'':d.status==='unpaid'?(overdue(d)?'crit':'warn'):d.status==='open'?'acc':'ok';
  return '<span class="pill '+cls+'">'+esc(overdue(d)?'เกินกำหนดชำระ':t)+'</span>';
}
/* สต็อก: นับเฉพาะเมื่อร้านเปิดโหมดสต็อก และสินค้านั้นเปิด "นับสต็อก" (แบบเดียวกับ store.tracked) */

// เอกสารเปิดจากที่ไหนก็ได้ (บัตรสต็อก ใบที่อ้างถึง) ร้านที่ไม่ได้เปิดแท็บเอกสาร (สต็อกอย่างเดียว) เปิดในแท็บสต็อก
function openDoc(no){

    D.doc=j.doc;D.sale=j.sale;D.view='view';D.paper=j.doc.type==='INV'&&j.doc.status==='paid'?'rc':'';D.recv=null;D.cancel=null;D.payTotal=null;disarm();

// มีการเปลี่ยนแปลงจากเครื่องอื่น (SSE): รายการ หรือเอกสารที่เปิดดูอยู่ (เช่น อีกเครื่องรับชำระไปแล้ว ปุ่มรับเงินต้องหาย)
function refreshDocs(){
  var D=S.dc;if(!D)return;
  if(D.view==='list')loadDocs();
  else if(D.view==='view'&&D.doc){
    var no=D.doc.no,rev=D.doc.rev;
    fetchDoc(no,true).then(function(j){
      if(!j||!S.dc.doc||S.dc.doc.no!==no||j.doc.rev===rev)return;
      S.dc.doc=j.doc;S.dc.sale=j.sale;
      if(j.doc.status!=='unpaid'&&armed('dpay:'+no))disarm();
      if(j.doc.status!=='open')S.dc.recv=null;
      if(S.dc.paper==='rc'&&j.doc.status!=='paid')S.dc.paper='';
      if(S.tab==='docs')renderDocs();
    });
  }
}

function blankLine(){return {id:0,name:'',qty:'1',unit:'',price:''};}

function edNew(type,src,edit){
  var s=S.d.settings,today=ymdOf(now());
  var e={type:type,no:null,rev:null,party:{name:'',address:'',taxId:'',branch:'',phone:'',contactId:''},lines:[],discount:'',vat:!!s.vat,
    note:type==='PO'?'':(s.docNote||''),date:today,due:defDue(type,today),saveContact:true,err:'',busy:false};
  if(src){
    ['name','address','taxId','branch','phone'].forEach(function(k){e.party[k]=src.party[k]||'';});
    e.party.contactId=src.party.contactId&&(dcInit().contacts||[]).some(function(c){return c.id===src.party.contactId;})?src.party.contactId:'';
    e.lines=src.lines.map(function(l){return {id:l.id&&itemById(l.id)?l.id:0,name:l.name,qty:String(l.qty),unit:l.unit||'',price:String(l.price)};});
    e.discount=src.discount?String(src.discount):'';e.vat=!!src.vat;e.note=src.note||'';
    if(edit){e.no=src.no;e.rev=src.rev;e.date=ymdOf(src.date);e.due=src.due!=null?ymdOf(src.due):'';e.saveContact=false;}
  }
  if(!e.lines.length)e.lines.push(blankLine());
  var D=dcInit();D.ed=e;D.view='edit';disarm();
}
// แถวที่ใช้ได้ (ข้ามแถวว่างทั้งแถว) + ข้อผิดพลาดแรกที่เจอ
function edLines(e){
  var out=[],err='';
  e.lines.forEach(function(l,i){
    var name=l.name.trim(),qs=String(l.qty).replace(/,/g,'').trim(),ps=String(l.price).replace(/,/g,'').trim(),q=+qs,p=+ps;
    if(!name&&!ps)return;
    if(!err){
      if(!name)err='รายการที่ '+(i+1)+': ใส่ชื่อรายการ';
      else if(!qs||!isFinite(q)||!(r3(q)>0))err='รายการที่ '+(i+1)+': จำนวนต้องมากกว่า 0';
      else if(!ps||!isFinite(p)||p<0)err='รายการที่ '+(i+1)+': ใส่ราคาต่อหน่วย';
    }
    out.push({id:l.id,name:name,qty:isFinite(q)&&q>0?r3(q):0,unit:l.unit.trim(),price:isFinite(p)&&p>0?round2(p):0});
  });
  return {lines:out,err:err};
}
function lineAmt(l){var qs=String(l.qty).replace(/,/g,'').trim(),ps=String(l.price).replace(/,/g,'').trim(),q=+qs,p=+ps;return qs&&ps&&isFinite(q)&&isFinite(p)&&q>0&&p>=0?baht(round2(r3(q)*round2(p))):'';}
function lineLink(e,l){
  var m=l.id&&itemById(l.id),t=words();
  if(!m)return l.name.trim()?'พิมพ์เอง'+(e.type==='INV'?' (ไม่ตัดสต็อก)':e.type==='PO'?' (รับของแล้วไม่เพิ่มสต็อก)':''):'';
  var h='✓ '+esc(t.item)+'ในระบบ'+(m.sku?' · '+esc(m.sku):'');
  if(tracked(m)){
    var q=+String(l.qty).replace(/,/g,'');
    h+=' · เหลือ '+fmtQty(m.stock)+(m.unit?' '+esc(m.unit):'');
    if(e.type==='INV'&&q>m.stock)h+=' <span class="negq">เกินสต็อกในระบบ</span>';
  }
  return h;
}

// พิมพ์ชื่อตรงกับสินค้า (หรือสแกนรหัส) = ผูกกับสินค้านั้น ใส่ราคา/หน่วยให้ถ้ายังว่างหรือยังเป็นค่าของสินค้าที่ผูกไว้ก่อน
function linkLine(e,l,i,scan){
  var m=findItem(l.name,scan),was=l.id&&itemById(l.id);
  if(!m){l.id=0;return false;}
  if(l.id===m.id)return true;
  var def=function(x){return e.type==='PO'?(x.cost>0?String(x.cost):''):String(x.price);};
  if(String(l.price).trim()===''||(was&&String(l.price)===def(was)))l.price=def(m);
  if(!l.unit.trim()||(was&&l.unit===(was.unit||'')))l.unit=m.unit||'';
  l.id=m.id;
  if(scan)l.name=m.name;
  var P=$('#d-lp-'+i),Un=$('#d-lu-'+i),N=$('#d-ln-'+i);
  if(P)P.value=l.price;if(Un)Un.value=l.unit;if(scan&&N)N.value=l.name;
  return true;
}
function linkContact(e){
  var c=findContact(e.party.name,e.type==='PO'?['supplier','both']:['customer','both']);
  if(c&&e.party.contactId!==c.id){
    e.party.contactId=c.id;
    [['d-paddr','address'],['d-ptax','taxId'],['d-pbranch','branch'],['d-pphone','phone']].forEach(function(x){e.party[x[1]]=c[x[1]]||'';var el=$('#'+x[0]);if(el)el.value=e.party[x[1]];});
  } else if(!c)e.party.contactId='';
  var cs=$('#d-cst');if(cs)cs.innerHTML=contactState(e);
}
function docField(el){
  var D=dcInit(),e=D.ed;
  if(el.id==='dc-q'){D.q=el.value;clearTimeout(dqT);dqT=setTimeout(loadDocs,300);return;}
  if(el.id==='dc-month'){D.month=el.value;D.list=null;renderDocs();loadDocs();return;}
  if(el.dataset.c&&D.ct){D.ct[el.dataset.c]=el.value;return;}
  if(D.view==='view'){
    if(el.id==='d-cancel'&&D.cancel)D.cancel.reason=el.value;
    else if(el.id==='r-note'&&D.recv)D.recv.note=el.value;
    else if(el.dataset.r!=null&&D.recv&&D.recv.lines[+el.dataset.r])D.recv.lines[+el.dataset.r][el.dataset.k]=el.value;
    return;
  }
  if(!e)return;
  if(el.dataset.l!=null){
    var i=+el.dataset.l,l=e.lines[i];if(!l)return;
    l[el.dataset.k]=el.value;
    if(el.dataset.k==='name')linkLine(e,l,i,false);
    var am=$('#d-la-'+i),lk=$('#d-lk-'+i);if(am)am.innerHTML=lineAmt(l);if(lk)lk.innerHTML=lineLink(e,l);
  } else if(el.dataset.f){
    var f=el.dataset.f;
    if(f==='date'){var old=e.date;e.date=el.value;if(e.due===defDue(e.type,old)){e.due=defDue(e.type,e.date);var du=$('#d-due');if(du)du.value=e.due;}}
    else if(f.indexOf('party.')===0){e.party[f.slice(6)]=el.value;if(f==='party.name')linkContact(e);}
    else e[f]=el.value;
  }
  var tt=$('#d-tot');if(tt)tt.innerHTML=edTotHtml(e);
}
function saveDoc(){
  var D=S.dc,e=D.ed;if(!e||e.busy)return;
  var ls=edLines(e),ds=String(e.discount).replace(/,/g,'').trim(),disc=ds===''?0:+ds;
  e.err=!e.party.name.trim()?'ใส่ชื่อ'+(e.type==='PO'?'ผู้ขาย':'ลูกค้า'):!ls.lines.length?'ยังไม่มีรายการ':ls.err||'';
  if(!e.err&&(!isFinite(disc)||disc<0))e.err='ส่วนลดไม่ถูกต้อง';
  if(!e.err&&round2(disc)>docCalc(ls.lines,0,false).sub)e.err='ส่วนลดมากกว่ายอดรวม';
  if(e.err){renderDocs();var er=$('#d-err');if(er)er.scrollIntoView({block:'center'});return;}
  e.busy=true;renderDocs();
  var party={name:e.party.name.trim(),address:e.party.address,taxId:e.party.taxId,branch:e.party.branch,phone:e.party.phone};
  if(e.party.contactId)party.contactId=e.party.contactId;

      return '<label class="f" for="ct-'+f[0]+'"'+(f[0]==='address'||f[0]==='note'?' style="grid-column:1/-1"':'')+'>'+f[1]+'<input class="in" id="ct-'+f[0]+'" data-c="'+f[0]+'" maxlength="'+f[2]+'" value="'+esc(c[f[0]]||'')+'" autocomplete="off"></label>';
    }).join('')+
    '<label class="f" for="ct-kind">ประเภท<select class="in" id="ct-kind" data-c="kind">'+[['customer','ลูกค้า'],['supplier','ผู้ขาย'],['both','เป็นทั้งลูกค้าและผู้ขาย']].map(function(k){return '<option value="'+k[0]+'"'+(c.kind===k[0]?' selected':'')+'>'+k[1]+'</option>';}).join('')+'</select></label></div>'+
    '<div class="err" role="alert">'+esc(c.err||'')+'</div><div class="row" style="justify-content:flex-start;gap:8px"><button class="btn primary" data-a="ctsave">บันทึก</button><button class="btn" data-a="ctcancel">ยกเลิก</button></div></div>';
}
function docClick(a,b){
  var D=dcInit(),d=D.doc,v=b.dataset.v;
  if(a==='dnew'){edNew(v);renderDocs();window.scrollTo({top:0});var pn=$('#d-pname');if(pn)pn.focus();if(!D.contacts)loadContacts();}
  else if(a==='dopen'){openDoc(v);}
  else if(a==='dfilter'){D.filter=v;D.list=null;renderDocs();loadDocs();}
  else if(a==='dmonthclear'){D.month='';D.list=null;renderDocs();loadDocs();}
  else if(a==='dcontacts'){D.view='contacts';D.ct=null;renderDocs();loadContacts();}
  else if(a==='dback'){D.view='list';D.ed=null;D.ct=null;D.doc=null;D.recv=null;D.cancel=null;disarm();renderDocs();loadDocs();}
  else if(a==='dladd'){D.ed.lines.push(blankLine());renderDocs();var nl=$('#d-ln-'+(D.ed.lines.length-1));if(nl)nl.focus();}
  else if(a==='dldel'){D.ed.lines.splice(+b.dataset.i,1);if(!D.ed.lines.length)D.ed.lines.push(blankLine());renderDocs();}
  else if(a==='dtog'){var k=b.dataset.k;D.ed[k]=!D.ed[k];renderDocs();}
  else if(a==='dsave'){saveDoc();}
  else if(a==='dpaper'){D.paper=v;renderDocs();}
  else if(a==='dprint'){printMode('doc');}
  else if(a==='dpaym'){D.payM=v==='transfer'?'transfer':'cash';renderDocs();}
  else if(a==='dpay'){
    var pk='dpay:'+d.no;
    // จำยอดตอนกดครั้งแรก ถ้าระหว่างนั้นใบนี้ถูกแก้/ยกเลิกจากอีกเครื่อง เซิร์ฟเวอร์ตอบ 409
    if(!armed(pk)){D.payTotal=d.total;arm(pk,8000);return true;}
    disarm();if(D.busy)return true;
    D.busy=true;renderDocs();
    act('/api/doc/pay',{no:d.no,expectedTotal:D.payTotal,method:D.payM}).then(function(r){
      D.busy=false;
      if(r&&r.ok){D.doc=r.j.doc;D.sale=r.j.sale;D.paper='rc';toast('รับชำระ '+r.j.doc.no+' แล้ว '+baht(r.j.sale.total)+' · ใบเสร็จ '+billNo(r.j.sale.no,r.j.sale.at));}
      else if(r&&r.status===409)refreshDocs();
      renderDocs();
    });
  }
  else if(a==='dconv'){
    var ck='dconv:'+d.no;
    if(!armed(ck)){arm(ck,6000);return true;}
    disarm();if(D.busy)return true;
    D.busy=true;renderDocs();
    act('/api/doc/convert',{no:d.no,rev:d.rev}).then(function(r){
      D.busy=false;
      if(r&&r.ok){D.doc=r.j.doc;D.sale=null;D.paper='';toast('ออก '+r.j.doc.no+' จาก '+d.no+' แล้ว');}
      renderDocs();
    });
  }
  else if(a==='dedit'){edNew(d.type,d,true);renderDocs();window.scrollTo({top:0});if(!D.contacts)loadContacts();}
  else if(a==='dcopy'){edNew(d.type,d,false);renderDocs();window.scrollTo({top:0});toast('คัดลอกจาก '+d.no+' แล้ว ตรวจแล้วกดออกใบใหม่');}
  else if(a==='drecv'){D.recv={lines:d.lines.map(function(l){return {qty:String(l.qty),price:String(l.price)};}),note:'',err:''};renderDocs();var rq=$('#r-q-0');if(rq)rq.focus();}
  else if(a==='drecvno'){D.recv=null;renderDocs();}
  else if(a==='drecvgo'){
    var R=D.recv,lines=[],err='';
    R.lines.forEach(function(x,i){
      var q=+String(x.qty).replace(/,/g,'').trim(),p=String(x.price).replace(/,/g,'').trim();
      if(!err&&(String(x.qty).trim()===''||!isFinite(q)||q<0))err='รายการที่ '+(i+1)+': ใส่จำนวนที่ได้รับ (ไม่ได้ใส่ 0)';
      if(!err&&p!==''&&(!isFinite(+p)||+p<0))err='รายการที่ '+(i+1)+': ราคาไม่ถูกต้อง';
      lines.push({qty:r3(q)||0,price:p===''?undefined:round2(+p)});
    });
    if(!err&&!lines.some(function(l){return l.qty>0;}))err='ยังไม่ได้รับของสักรายการ';
    R.err=err;if(err){renderDocs();return true;}
    D.busy=true;renderDocs();
    act('/api/doc/receive',{no:d.no,rev:d.rev,lines:lines,note:R.note}).then(function(r){
      D.busy=false;
      if(r&&r.ok){D.recv=null;D.doc=r.j.doc;D.paper='';toast('รับสินค้าแล้ว '+r.j.doc.no+' สต็อกเพิ่มแล้ว');}
      else if(r)R.err=r.j.error||'';
      renderDocs();
    });
  }
  else if(a==='dcancel'){D.cancel={reason:'',err:''};renderDocs();var dc=$('#d-cancel');if(dc)dc.focus();}
  else if(a==='dcancelno'){D.cancel=null;renderDocs();}
  else if(a==='dcancelgo'){
    var C=D.cancel;
    if(C.reason.trim().length<2){C.err='ใส่เหตุผลที่ยกเลิก';renderDocs();var dc2=$('#d-cancel');if(dc2)dc2.focus();return true;}
    var lines2=[DOC_NAME[d.type]+' '+d.no+' ('+baht(d.total)+') ใช้ไม่ได้อีก เลขที่นี้ไม่ถูกใช้ซ้ำ','ย้อนกลับไม่ได้ ถ้าต้องการออกใหม่ ใช้ "คัดลอกเป็นใบใหม่"'];
    if(d.type==='INV')lines2.splice(1,0,words().item+'ที่ตัดสต็อกไปตอนออกใบนี้คืนเข้าสต็อก');
    confirmBox({title:'ยกเลิก '+d.no+'?',lines:lines2,ok:'ยกเลิกเอกสาร',no:'ไม่ยกเลิก'}).then(function(ok){
      if(!ok)return;
      act('/api/doc/cancel',{no:d.no,reason:C.reason.trim()},'ยกเลิก '+d.no+' แล้ว').then(function(r){if(r&&r.ok){D.cancel=null;D.doc=r.j.doc;D.paper='';renderDocs();}});
    });
  }
  else if(a==='ctnew'){D.ct={id:'',name:'',kind:'customer',taxId:'',branch:'',address:'',phone:'',email:'',note:'',err:''};renderDocs();var cn=$('#ct-name');if(cn)cn.focus();}
  else if(a==='ctedit'){var c0=(D.contacts||[]).filter(function(x){return x.id===v;})[0];if(c0){D.ct=Object.assign({err:''},c0);renderDocs();window.scrollTo({top:0});}}
  else if(a==='ctcancel'){D.ct=null;renderDocs();}
  else if(a==='ctsave'){
    var ct=D.ct,cb={name:ct.name,kind:ct.kind,taxId:ct.taxId,branch:ct.branch,address:ct.address,phone:ct.phone,email:ct.email,note:ct.note};
    if(ct.id)cb.id=ct.id;
    api('/api/contact',cb).then(function(r){
      if(r.ok){toast('บันทึก '+r.j.contact.name+' แล้ว');D.ct=null;loadContacts().then(renderDocs);}
      else{ct.err=r.j.error||'บันทึกไม่สำเร็จ';renderDocs();if(r.status===401)showLogin();}
    },function(){ct.err='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';renderDocs();});
  }
  else if(a==='ctdel'){
    var cd=(D.contacts||[]).filter(function(x){return x.id===v;})[0];if(!cd)return true;
    confirmBox({title:'ลบ '+cd.name+' ออกจากรายชื่อ?',lines:['เอกสารที่ออกไปแล้วยังมีชื่อและที่อยู่เดิมครบ ไม่กระทบ','ครั้งหน้าต้องพิมพ์ที่อยู่ใหม่ หรือเพิ่มรายชื่อใหม่'],ok:'ลบรายชื่อ'})
      .then(function(ok){if(ok)act('/api/contact/delete',{id:cd.id},'ลบ '+cd.name+' แล้ว').then(function(){loadContacts().then(renderDocs);});});
  }
  else return false;
  return true;
}

var SK_KEY='ordervai-stock-adj',ADJ={in:['ใบรับสินค้าเข้า','รับเข้า'],out:['ใบเบิกออก / ตัดของเสีย','เบิกออก'],count:['ใบตรวจนับสต็อก','ตรวจนับ']};
var MOVE={sale:'ขาย',buy:'รับซื้อ',inv:'ส่งของตามใบแจ้งหนี้','inv-cancel':'ยกเลิกใบแจ้งหนี้ คืนสต็อก',gr:'รับเข้า',out:'เบิกออก',count:'ปรับตามการตรวจนับ'};
function skInit(){
  if(S.sk)return S.sk;
  var K={view:'list',filter:'all',q:'',adj:null,card:null,doc:null,docs:null};
  try{
    var j=JSON.parse(localStorage.getItem(SK_KEY)||'null');
    if(j&&j.v===1&&ADJ[j.mode]&&Array.isArray(j.lines))K.adj={mode:j.mode,reason:String(j.reason||''),party:String(j.party||''),err:'',busy:false,
      lines:j.lines.filter(function(l){return l&&typeof l.id==='number';}).map(function(l){return {id:l.id,qty:String(l.qty==null?'':l.qty),price:String(l.price==null?'':l.price),expect:typeof l.expect==='number'?l.expect:null};})};
  }catch(e){}
  return (S.sk=K);
}
function saveAdj(){var A=S.sk&&S.sk.adj;try{if(A)localStorage.setItem(SK_KEY,JSON.stringify({v:1,mode:A.mode,lines:A.lines,reason:A.reason,party:A.party}));else localStorage.removeItem(SK_KEY);}catch(e){}}
function loadStockDocs(){return api('/api/docs?type=stock').then(function(r){if(r.ok){skInit().docs=r.j.docs;if(S.tab==='stock'&&S.sk.view==='list')renderStock();}},function(){});}

  else if(none)h+='<p class="muted small" style="margin:0 0 8px">'+esc(t.item)+'เหล่านี้ขายได้ไม่จำกัด ไม่มีบัตรสต็อก'+(own?' กด "เริ่มนับ" เพื่อใส่ยอดที่มีอยู่จริง':'')+'</p><div class="tbl-wrap"><table class="list"><thead><tr><th>'+esc(t.item)+'</th><th>รหัส</th><th></th></tr></thead><tbody>'+list.slice(0,MAX).map(function(m){

    }).join('')+'</tbody></table></div>';

  h+='</div>';
  var sd=K.docs||[];
  if(sd.length)h+='<div class="panel" style="margin-top:14px"><div class="sec-title"><h3>เอกสารสต็อกล่าสุด</h3><span class="muted small">8 วันล่าสุด</span></div><div class="tbl-wrap"><table class="list"><thead><tr><th>เลขที่</th><th>วันที่</th><th>ประเภท</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>'+sd.slice(0,30).map(function(d){

function adjAfter(A,l){
  var m=itemById(l.id);if(!m)return '';
  var qs=String(l.qty).replace(/,/g,'').trim(),q=+qs;
  if(qs==='')return '<span class="muted">—</span>';
  if(!isFinite(q)||q<0||(A.mode!=='count'&&!(q>0)))return '<span class="err small">จำนวนไม่ถูกต้อง</span>';
  var cur=m.track?m.stock:0;
  if(A.mode==='count'){var base=m.track&&l.expect!==null?l.expect:cur,df=r3(q-base);return '<b class="'+(df<0?'negq':'')+'">'+(df>0?'+':'')+fmtQty(df)+'</b>';}
  var after=r3(cur+(A.mode==='in'?q:-q));
  return '<b class="'+(after<0?'negq':'')+'">'+fmtQty(after)+'</b>';
}
// ยอดในระบบของแถว (ตรวจนับ: ยอดตอนเริ่มนับรายการนั้น) และคำเตือนถ้าระหว่างนับมีการขาย/รับของ

function adjAdd(m){
  var A=S.sk.adj;if(!m||!A)return;
  var i=-1;A.lines.forEach(function(l,j){if(l.id===m.id)i=j;});
  if(i<0){A.lines.push({id:m.id,qty:'',price:'',expect:m.stock});i=A.lines.length-1;}
  A.err='';saveAdj();renderStock();
  var q=$('#sk-q-'+i);if(q){q.focus();q.select();}
}
function adjStart(mode){
  var K=skInit();
  if(!K.adj)K.adj={mode:mode,lines:[],reason:'',party:'',err:'',busy:false};
  else if(K.adj.mode!==mode){if(K.adj.lines.length)toast('มี'+ADJ[K.adj.mode][0]+'ที่ทำค้างไว้ บันทึกหรือทิ้งใบนั้นก่อน (หรือเปลี่ยนประเภทที่ปุ่มด้านบน)');else K.adj.mode=mode;}
  K.view='adjust';saveAdj();if(!S.dc||!S.dc.contacts)loadContacts();
}
function adjGo(){
  var A=S.sk.adj;if(!A||A.busy)return;
  var lines=[],err='';
  A.lines.forEach(function(l){
    var m=itemById(l.id),qs=String(l.qty).replace(/,/g,'').trim();if(!m||qs==='')return;
    var q=+qs;
    if(!err&&(!isFinite(q)||q<0||(A.mode!=='count'&&!(q>0))))err=m.name+': จำนวนไม่ถูกต้อง';
    var o={id:m.id,qty:r3(q)};
    var ps=String(l.price).replace(/,/g,'').trim();
    if(A.mode==='in'&&ps!==''){if(!err&&(!isFinite(+ps)||+ps<0))err=m.name+': ต้นทุนไม่ถูกต้อง';o.price=round2(+ps);}
    if(A.mode==='count')o.expect=l.expect===null?m.stock:l.expect;
    lines.push(o);
  });
  if(!err&&!lines.length)err='ยังไม่ได้ใส่จำนวนสักรายการ';
  if(!err&&A.mode==='out'&&A.reason.trim().length<2)err='ใส่เหตุผลที่เบิกออก';
  A.err=err;if(err){renderStock();return;}
  A.busy=true;renderStock();
  var body={mode:A.mode,reason:A.reason.trim(),lines:lines};
  if(A.mode==='in'&&A.party.trim()){var c=findContact(A.party,['supplier','both']);body.party=c?{name:c.name,address:c.address,taxId:c.taxId,branch:c.branch,phone:c.phone,contactId:c.id}:{name:A.party.trim()};}
  api('/api/stock/adjust',body).then(function(r){
    A.busy=false;
    if(!r.ok){A.err=r.j.error||'บันทึกไม่สำเร็จ';renderStock();if(r.status===401)showLogin();return;}
    var K=S.sk;K.adj=null;saveAdj();K.doc=r.j.doc;K.view='doc';
    toast('บันทึก '+r.j.doc.no+' แล้ว');load();loadStockDocs();window.scrollTo({top:0});
  },function(){A.busy=false;A.err='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองอีกครั้ง';renderStock();});
}

function stockField(el,ev){

  if(el.id==='sk-add'){if(ev&&ev.inputType&&ev.inputType!=='insertReplacementText')return;var m=findItem(el.value,true);if(m){el.value='';adjAdd(m);}return;}

function stockClick(a,b){
  var K=skInit(),A=K.adj,v=b.dataset.v;
  if(a==='skadj'){adjStart(v);renderStock();var sa=$('#sk-add');if(sa)sa.focus();}
  else if(a==='skresume'){K.view='adjust';renderStock();}
  else if(a==='skmode'){if(A&&A.mode!==v){A.mode=v;A.err='';saveAdj();renderStock();}}
  else if(a==='skall'){S.d.menu.items.forEach(function(m){if(tracked(m)&&!A.lines.some(function(l){return l.id===m.id;}))A.lines.push({id:m.id,qty:'',price:'',expect:m.stock});});saveAdj();renderStock();}
  else if(a==='sklow'){lowItems().forEach(function(m){if(!A.lines.some(function(l){return l.id===m.id;}))A.lines.push({id:m.id,qty:'',price:'',expect:m.stock});});saveAdj();renderStock();}
  else if(a==='skdel'){A.lines.splice(+b.dataset.i,1);saveAdj();renderStock();}
  else if(a==='skre'){var rl=A.lines[+b.dataset.i],rm=rl&&itemById(rl.id);if(rm){rl.expect=rm.stock;rl.qty='';saveAdj();renderStock();var rq=$('#sk-q-'+b.dataset.i);if(rq)rq.focus();}}
  else if(a==='skrsn'){A.reason=v;saveAdj();renderStock();}
  else if(a==='skgo'){adjGo();}
  else if(a==='skback'){K.view='list';K.card=null;K.doc=null;renderStock();loadStockDocs();}
  else if(a==='skdiscard'){
    var n=A?A.lines.length:0;
    (n?confirmBox({title:'ทิ้ง'+ADJ[A.mode][0]+'ที่ทำค้างไว้?',lines:['รายการที่ใส่ไว้ '+n+' รายการหายไป ยังไม่ได้บันทึกอะไรลงสต็อก'],ok:'ทิ้งใบนี้',no:'ไม่ทิ้ง'}):Promise.resolve(true))
      .then(function(ok){if(!ok)return;K.adj=null;saveAdj();K.view='list';renderStock();});
  }
  else if(a==='skfilter'){K.filter=v;renderStock();}
  else if(a==='skcard'){openCard(+b.dataset.id);window.scrollTo({top:0});}
  else if(a==='skstart'){var sm=itemById(+b.dataset.id);adjStart(A?A.mode:'count');adjAdd(sm);}
  else if(a==='skdoc'){
    if(allowedTabs().indexOf('docs')>=0)openDoc(v);
    else fetchDoc(v).then(function(j){if(j){K.doc=j.doc;K.view='doc';renderStock();window.scrollTo({top:0});}});
  }
  else if(a==='skreport'){K.view='report';renderStock();}
  else return false;
  return true;
}

   สีทั้งหมดคำนวณที่เซิร์ฟเวอร์ (lib/theme.js) หน้านี้แค่ขอผล /api/theme/preview มาแสดงตัวอย่าง */
/* โหลดสีร้าน (/theme.css): โหลดไฟล์ใหม่ให้เสร็จก่อนแล้วค่อยเอาอันเก่าออก (สีไม่กะพริบ)
   โหลดไม่สำเร็จ (เซิร์ฟเวอร์รีสตาร์ท/เน็ตสะดุด) ลองใหม่ทุก 5 วินาที ระหว่างนั้นใช้สีที่มีอยู่ */
var themeTry=null;
function loadTheme(v){
  clearTimeout(themeTry);
  var old=document.getElementById('theme-css'),l=document.createElement('link');
  l.rel='stylesheet';l.href='/theme.css?v='+encodeURIComponent(v);
  l.onload=function(){document.querySelectorAll('link[rel=stylesheet]').forEach(function(x){if(x!==l)x.parentNode.removeChild(x);});l.id='theme-css';};
  l.onerror=function(){if(l.parentNode)l.parentNode.removeChild(l);themeTry=setTimeout(function(){loadTheme(v);},5000);};
  document.head.appendChild(l);
}
// ไฟล์ใน <head> โหลดเสร็จ (หรือล้ม) ก่อนสคริปต์นี้ทำงานเสมอ โหลดล้มแล้ว Chromium ยังมี sheet เปล่าให้ แต่อ่าน cssRules ไม่ได้
function sheetOk(l){try{return !!(l&&l.sheet&&l.sheet.cssRules);}catch(e){return false;}}
if(!sheetOk(document.getElementById('theme-css')))loadTheme(Date.now());
var themeApplied=null;
function setLogo(img,name){if(name){img.src='/img/'+name;img.hidden=false;}else{img.removeAttribute('src');img.hidden=true;}}
function applyTheme(accent){
  if(themeApplied===null){themeApplied=accent;return;}       // ครั้งแรก: /theme.css ใน <head> ตรงอยู่แล้ว
  if(accent===themeApplied)return;
  themeApplied=accent;loadTheme(Date.now());
}

  if((s.accent||'')!==T.base){if(T.pick===T.base){T.pick=s.accent||'';T.err='';previewTheme(T.pick);}T.base=s.accent||'';}
