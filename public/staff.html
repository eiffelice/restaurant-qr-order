<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>หลังร้าน · ออเดอร์ไว</title>
<style>
:root{
  /* Restaurant OS tokens: Graphite + Lime ปุ่มหลักพื้น lime ตัวหนังสือ graphite (ตัวขาวบน lime contrast แค่ 2:1)
     ตัวหนังสือสีเน้นใช้ --accent-text (lime เข้ม) ไม่ใช้ --accent */
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --ink:#111827; --muted:#4b5563; --line:#e2e8f0; --line-strong:#7c8796;
  --accent:#84cc16; --accent-ink:#111827; --accent-soft:#ecfccb; --accent-text:#3f6212; --focus:#4d7c0f;
  --nav:#111827; --nav-ink:#f9fafb;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#92400e; --warn-bg:#fef3c7; --warn-line:#d97706; --crit:#b91c1c; --crit-bg:#fee2e2; --danger:#dc2626; --danger-ink:#ffffff;
  --r-sm:8px; --r:12px; --r-lg:16px; --ctl:44px;
  --font:'Inter','Noto Sans Thai','IBM Plex Sans Thai','Leelawadee UI','Sarabun','Thonburi',system-ui,-apple-system,'Segoe UI',sans-serif;
  --paper:#fdfdfb; --paper-ink:#1c1f1e; --paper-line:#bfc6c3; --paper-muted:#5a625f;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f17; --surface:#111827; --surface2:#1f2937; --ink:#f9fafb; --muted:#9ca3af; --line:#273244; --line-strong:#6b7280;
  --accent:#a3e635; --accent-ink:#111827; --accent-soft:#1d2b0c; --accent-text:#bef264; --focus:#bef264;
  --nav:#030712; --nav-ink:#f9fafb;
  --ok:#4ade80; --ok-bg:#0f2e1a; --warn:#fbbf24; --warn-bg:#3a2a0b; --warn-line:#f59e0b; --crit:#f87171; --crit-bg:#3b1414; --danger:#dc2626; --danger-ink:#ffffff;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);padding-inline:16px;padding-bottom:28px;font-variant-numeric:tabular-nums}
.wrap{max-width:76rem;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h2,h3{margin:0;font-weight:600}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;margin-inline:-16px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.3rem;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent-text)}
button.pill{border:0}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.8rem;padding:2px 4px}
.tabs{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;margin-top:10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 4px;min-height:var(--ctl);font-weight:600;text-align:center;font-size:.92rem;line-height:1.3}
.tab[aria-selected="true"]{background:var(--nav);border-color:var(--nav);color:var(--nav-ink);box-shadow:inset 0 -3px 0 var(--accent)}
.badge{display:inline-block;min-width:1.35em;margin-left:5px;padding:0 5px;border-radius:99px;background:var(--danger);color:var(--danger-ink);font-size:.72rem;line-height:1.35em}
.tab[aria-selected="true"] .badge{background:var(--accent);color:var(--accent-ink)}
.view{padding-top:14px}
.view[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:9px 16px;min-height:var(--ctl);font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent-line,var(--accent));color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.block{display:flex;width:100%;padding:12px 16px;min-height:48px}
.btn.sm{padding:5px 12px;min-height:36px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.crit{background:var(--crit-bg);color:var(--crit)}
.banner.info{background:var(--accent-soft);color:var(--accent-text)}
/* kitchen */
.agg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.agg .pill{background:var(--accent-soft);color:var(--accent-text);font-size:.85rem;padding:3px 11px;white-space:normal;overflow-wrap:anywhere;max-width:100%}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(16.5rem,1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.w-ok{border-left-color:var(--accent)} .card.w-warn{border-left-color:var(--warn-line);background:var(--warn-bg)} .card.w-crit{border-left-color:var(--crit);background:var(--crit-bg)} .card.w-ready{border-left-color:var(--ok)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h .t{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.card-h b{font-size:1.1rem}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.card li{display:flex;gap:10px;font-size:1.12rem;line-height:1.4}
.card li b{min-width:1.8em}
.note-txt{font-size:.82rem;color:var(--accent-text);font-weight:500}
.memo-txt{font-size:.88rem;background:var(--surface2);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
.card-act{display:flex;gap:6px}
.card-act .btn{min-height:48px;font-size:1.02rem}
.card-act .btn:first-child{flex:1}
/* tables */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.8rem,1fr));gap:8px;margin-bottom:14px}
.tbl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;text-align:left;min-height:4.6rem}
.tbl .n{font-size:1.5rem;font-weight:700;line-height:1.2}
.tbl .s{font-size:.76rem;color:var(--muted)}
.tbl.busy{border-color:var(--accent);background:var(--accent-soft)} .tbl.busy .s{color:var(--accent-text)}
.tbl.ready{border-color:var(--ok);background:var(--ok-bg)} .tbl.ready .s{color:var(--ok);font-weight:700}
.tbl.call{border-color:var(--crit);background:var(--crit-bg)} .tbl.call .s{color:var(--crit);font-weight:700}
.tbl.add{border-style:dashed;color:var(--accent-text)} .tbl.add .s{color:var(--accent-text)}
.tbl[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:860px){.detail{grid-template-columns:22rem minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sent-row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:6px 0;border-top:1px dashed var(--line)}
.sent-row:first-child{border-top:0}
.sent-row>span:first-child{min-width:0;overflow-wrap:anywhere}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{border:0;background:var(--surface2);width:2.1rem;height:2rem;font-size:1.1rem}
.step span{min-width:2rem;text-align:center;font-weight:700}
.sw{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 14px;font-size:.85rem;font-weight:600}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.receipt-box{display:flex;justify-content:center}
.receipt{width:100%;max-width:22rem;background:var(--paper);color:var(--paper-ink);padding:22px 20px;border-radius:4px;box-shadow:0 1px 0 var(--paper-line),0 8px 24px rgba(0,0,0,.18);font-size:.9rem}
.receipt .shop{font-weight:700;font-size:1.25rem;text-align:center;overflow-wrap:anywhere}
.receipt .sub{text-align:center;color:var(--paper-muted);font-size:.8rem}
.receipt .doc{text-align:center;font-weight:700;font-size:.95rem;margin-top:2px}
.receipt hr{border:0;border-top:1px dashed var(--paper-line);margin:12px 0}
.receipt .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--paper-muted);gap:8px}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:2px 0;vertical-align:top}
.receipt td.q{width:2.4em;color:var(--paper-muted)} .receipt td.a{text-align:right;white-space:nowrap}
.receipt .grand td{font-size:1.3rem;font-weight:700;padding-top:6px}
.qr{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px;text-align:center}
.qr svg{width:10.5rem;height:10.5rem;background:#fff}
.qr small{color:var(--paper-muted)}
.qr .payqr{width:12rem;max-width:100%;height:auto;background:#fff;border-radius:6px}
.payqr-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:4px 0 14px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
.payqr-box .pq{width:120px;height:120px;flex:none;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:#ffffff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;color:#4b5563;padding:6px;overflow:hidden}
.payqr-box .pq img{max-width:100%;max-height:100%;object-fit:contain}
.payqr-box .stack{flex:1;min-width:14rem}
.pay-wrap{max-width:22rem;margin:12px auto 0;width:100%;display:flex;flex-direction:column;gap:8px}
.pay-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cash{display:flex;flex-direction:column;gap:8px}
.cash .q{display:flex;gap:6px;flex-wrap:wrap}
.cash-out{font-size:1.5rem;font-weight:700;line-height:1.3}
.cash-out.short{color:var(--crit);font-size:1rem}
.audit-row{display:grid;grid-template-columns:3.6rem 1fr;gap:4px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.audit-row:first-child{border-top:0}
.audit-row .w{grid-column:2;font-size:.8rem;color:var(--muted)}
/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:.8rem;color:var(--muted)} .kpi .v{font-size:1.75rem;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.kpi .x{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(5rem,10rem) minmax(0,1fr) 4.6rem;gap:10px;align-items:center}
.bar-row>span:first-child{min-width:0;overflow-wrap:anywhere}
.bar-row .tr{background:var(--surface2);border-radius:5px;height:14px;overflow:hidden}
.bar-row .fi{height:100%;background:var(--accent);border-radius:5px}
.bar-row .n{text-align:right;font-weight:600}
.tbl-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:.9rem}
table.list th,table.list td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.list th{font-size:.8rem;color:var(--muted);font-weight:600}
table.list td.r,table.list th.r{text-align:right}
/* settings */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input.in,select.in{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 12px;min-height:var(--ctl);width:100%}
.toggles{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}
.sold{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left}
.sold[aria-pressed="true"]{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.qrsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:12px}
.qcard{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;break-inside:avoid;display:flex;flex-direction:column;align-items:center;gap:2px}
.qcard .sh{font-size:.85rem;color:#444;overflow-wrap:anywhere}
.qcard .tn{font-size:1.8rem;font-weight:700;line-height:1.2}
.qcard svg{width:100%;max-width:9rem;height:auto}
.qcard .hint{font-size:.78rem;color:#444}
/* menu manager */
.mlayout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:900px){.mlayout{grid-template-columns:19rem minmax(0,1fr)}}
.crow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .nm{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left;border:0;background:none;padding:0;font-weight:600}
.crow .nm[aria-pressed="true"]{color:var(--accent-text);text-decoration:underline}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:2rem;height:2rem;padding:0 7px;font-size:.82rem;font-weight:600}
.ibtn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.inline{display:flex;gap:6px;margin-top:10px}
.inline .in{flex:1;min-width:0}
.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mtools .in{flex:1;min-width:10rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:10px}
.mcard{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.mcard.off{opacity:.62}
.thumb{flex:none;width:4.6rem;height:4.6rem;border-radius:8px;object-fit:cover;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.72rem;text-align:center}
.mcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mcard .nm{font-weight:600;overflow-wrap:anywhere}
.mcard .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.editor{margin-bottom:14px;border-color:var(--accent)}
.eimg{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.eimg .thumb{width:7.5rem;height:7.5rem}
select.in{appearance:auto}
.small{font-size:.82rem}
.status-line{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;font-size:.9rem}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.login[hidden]{display:none}
.login form{width:100%;max-width:22rem;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.login.has-cover{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),var(--cover) center/cover no-repeat}
.err{color:var(--crit);font-weight:600;min-height:1.4em}
.logo{display:block;object-fit:contain;border-radius:var(--r-sm)}
.login .logo{width:96px;height:96px;margin:0 auto 4px;background:var(--surface);border:1px solid var(--line);padding:6px}
.login .shopname{text-align:center;font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.brand-row{display:flex;align-items:center;gap:10px;min-width:0}
.brand-row .logo{width:40px;height:40px;flex:none;background:var(--surface);border:1px solid var(--line);padding:2px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:16px;align-items:start}
.logo-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-box .logo,.logo-box .ph{width:96px;height:96px;border:1px dashed var(--line-strong);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-align:center;padding:4px}
.cover-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cover-box .cv,.cover-box .ph{width:200px;aspect-ratio:16/9;border-radius:var(--r);object-fit:cover;border:1px dashed var(--line-strong);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-align:center;padding:4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.swatch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;min-height:40px;font-size:.85rem;font-weight:600}
.swatch i{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.swatch[aria-pressed="true"]{outline:3px solid var(--focus);outline-offset:1px}
.swatch.plain{padding:4px 14px;min-height:44px}
.tpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tpick input[type=color]{width:56px;height:44px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:2px;cursor:pointer}
.tprev{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.tprev .btn.primary{align-self:flex-start}
.receipt .rlogo{display:block;max-width:40mm;max-height:18mm;margin:0 auto 6px;object-fit:contain;filter:grayscale(1)}
.qcard .qlogo{max-width:5rem;max-height:3rem;object-fit:contain}
.qcard .qact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.qcard .qact .btn{color:var(--ink)}
@page qrsheet{size:A4;margin:10mm}
/* ใบเสร็จพิมพ์จากสำเนาใน #print-area (ลูกตรงของ body) ส่วนอื่นซ่อนแบบไม่กินที่ ใบเสร็จไหลต่อหน้าตามปกติ
   เดิมซ่อนด้วย visibility + position:fixed: ส่วนที่ซ่อนยังกินความยาวกระดาษ ใบสั้นพิมพ์ออกมา 2 ใบซ้ำ ใบยาวหน้าถัดไปพิมพ์หัวใบเสร็จทับยอดรวม */
@page receipt{margin:0}
#print-area{display:none}
dialog.dlg{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:18px;width:min(28rem,calc(100% - 32px))}
dialog.dlg::backdrop{background:rgba(0,0,0,.5)}
.dlg h3{margin:0 0 6px}
.dlg .reasons{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.dlg .reasons label{border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;background:var(--bg)}
.dlg .reasons input{margin:0 6px 0 0}
.dlg .row{display:flex;gap:8px;margin-top:12px}
.dlg .row .btn{flex:1}

<script>
(function(){
'use strict';
var WARN=10, CRIT=15;
var S={tab:null,kStation:'all',sel:null,bSvc:true,bVat:false,d:null,report:null,seen:null,seenCalls:null,cash:'',lastCash:null,audit:null,staff:null,stEdit:null,stErr:'',sf:null,
       skew:0,dirty:false,confirm:null,lastSale:null,viewSale:null,busy:false,
       mCat:null,q:'',edit:null,saving:false,catEdit:null,bk:null,rs:null,restoring:false};

function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
/* บทบาท: ซ่อนสิ่งที่ทำไม่ได้ (เซิร์ฟเวอร์ตรวจสิทธิ์ซ้ำทุกครั้งอยู่แล้ว ส่วนนี้แค่ไม่ให้เห็นปุ่มที่กดแล้วได้ 403)
   แท็บที่เห็น = บทบาท × โหมดการขายของร้าน (ร้านที่ไม่ใช้โต๊ะไม่มีแท็บโต๊ะ ฯลฯ) ลำดับ: ร้านที่มีโต๊ะ ครัวกับโต๊ะมาก่อนแบบเดิม ร้านที่ขายหน้าร้านอย่างเดียว หน้าขายมาก่อน */
var TABS={owner:['counter','kitchen','tables','menu','report','settings'],cashier:['counter','kitchen','tables','menu','report'],waiter:['kitchen','tables','menu'],kitchen:['kitchen','menu']};
function allowedTabs(){
  var m=modes(),r=TABS[role()]||TABS.kitchen,on={counter:m.counter,kitchen:m.kitchen,tables:m.table,menu:true,report:true,settings:true};
  var order=m.table?['kitchen','tables','counter','menu','report','settings']:['counter','kitchen','tables','menu','report','settings'];
  return order.filter(function(t){return on[t]&&r.indexOf(t)>=0;});
}
/* ประเภทธุรกิจ: คำที่ใช้ในหน้าจอ (lib/biz.js ส่งมาใน /api/state) และโหมดการขาย */
function words(){return (S.d&&S.d.biz&&S.d.biz.terms)||{item:'เมนู',kitchen:'ครัว',order:'สั่งอาหาร',food:'อาหาร',sub:'รวมค่าอาหาร',memo:''};}
function modes(){return (S.d&&S.d.settings.modes)||{table:true,kitchen:true,counter:false,buy:false};}
function where(k){return k.table?'โต๊ะ '+k.table:'คิว '+k.q;}
function fmtQty(n){return Number(n).toLocaleString('th-TH',{maximumFractionDigits:3});}
function itemById(id){return S.d.menu.items.filter(function(x){return x.id===id;})[0];}
// วาดส่วนหนึ่งของหน้าใหม่ แล้วคืนโฟกัสและเคอร์เซอร์ให้ช่อง/ปุ่มเดิม (กฎข้อ 32: ไม่บล็อกการวาด แต่ไม่ให้คนพิมพ์อยู่หลุด)
function redraw(el,html){
  var a=document.activeElement,key=null,s0=null,s1=null;
  if(a&&a!==document.body&&el.contains(a)){
    if(a.id)key='#'+a.id;
    else if(a.dataset&&a.dataset.a)key='[data-a="'+a.dataset.a+'"]'+(a.dataset.id?'[data-id="'+a.dataset.id+'"]':'')+(a.dataset.i?'[data-i="'+a.dataset.i+'"]':'')+(a.dataset.v?'[data-v="'+a.dataset.v+'"]':'')+(a.dataset.m?'[data-m="'+a.dataset.m+'"]':'');
    try{s0=a.selectionStart;s1=a.selectionEnd;}catch(e){}
  }
  el.innerHTML=html;
  if(!key)return;
  var b=null;try{b=el.querySelector(key);}catch(e){}
  if(b){b.focus();try{if(s0!=null)b.setSelectionRange(s0,s1);}catch(e){}}
}
function role(){return S.d&&S.d.me?S.d.me.role:'owner';}
function isOwner(){return role()==='owner';}
function front(){return role()!=='kitchen';}
// แตะเงินได้ (รับเงิน ยกเลิกออเดอร์ ค่าบริการ/VAT ของบิล) = เจ้าของและแคชเชียร์ พนักงานเสิร์ฟดูแลโต๊ะได้แต่ไม่แตะเงิน (เซิร์ฟเวอร์ตรวจซ้ำใน PERM)
function canMoney(){var r=role();return r==='owner'||r==='cashier';}
function baht(n){return '฿'+Number(n).toLocaleString('th-TH',{maximumFractionDigits:2});}
function now(){return Date.now()+S.skew;}
function mins(t){return Math.max(0,Math.floor((now()-t)/60000));}
var tt;
function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on');},3000);}

/* ---------- sound: one AudioContext, unlocked by the first tap ---------- */
var AC=null;
function soundReady(){return !!AC&&AC.state==='running';}
/* ป้ายเปิดเสียงหายตอนแตะครั้งแรก ถ้าหายระหว่างที่นิ้วยังกดอยู่ ปุ่มทั้งหน้าเลื่อนขึ้นแล้วนิ้วยกบนปุ่มอื่น
   (แตะแท็บแล้วไม่เปลี่ยน แตะสินค้าแล้วได้อีกชิ้น) จึงซ่อนป้ายหลังยกนิ้วเท่านั้น */
var pressing=false;
document.addEventListener('pointerdown',function(){pressing=true;},true);
['pointerup','pointercancel'].forEach(function(t){document.addEventListener(t,function(){setTimeout(function(){pressing=false;updateSound();},0);},true);});
function updateSound(){if(pressing)return;$('#sound').hidden=soundReady()||!S.d;}
function unlockAudio(){
  try{
    if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(A){AC=new A();AC.onstatechange=updateSound;}}
    if(AC&&AC.state==='suspended')AC.resume().then(updateSound,updateSound);
  }catch(e){}
  updateSound();

var TONES={order:[[660,0,.18],[880,.2,.18],[1100,.4,.3]],call:[[1200,0,.14],[1200,.22,.14]],bill:[[990,0,.3],[740,.32,.45]],ready:[[1320,0,.6]]};
function beep(kind){
  if(!soundReady())return;
  try{
    var t0=AC.currentTime;
    (TONES[kind]||TONES.order).forEach(function(n){
      var o=AC.createOscillator(),g=AC.createGain(),t=t0+n[1];
      o.type='sine';o.frequency.value=n[0];o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+n[2]);
      o.start(t);o.stop(t+n[2]+.02);
    });
  }catch(e){}
}

function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v;}
function ppPayload(idStr,amount){
  var d=String(idStr||'').replace(/\D/g,''),acct;
  if(d.length===10)acct=tlv('01','0066'+d.slice(1));
  else if(d.length===13)acct=tlv('02',d);
  else return null;
  var p=tlv('00','01')+tlv('01',amount>0?'12':'11')+tlv('29',tlv('00','A000000677010111')+acct)+tlv('58','TH')+tlv('53','764');
  if(amount>0)p+=tlv('54',amount.toFixed(2));
  p+='6304';
  return p+crc16(p);
}

var QR_BOX={x:150,y:520,size:900,margin:4};

// zip แบบไม่บีบอัด (PNG บีบอัดอยู่แล้ว) ชื่อไฟล์ภาษาไทยใช้ UTF-8 (flag 0x0800)
var CRC=null;
function crc32(b){if(!CRC){CRC=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC[n]=c>>>0;}}var x=0xFFFFFFFF;for(var i=0;i<b.length;i++)x=CRC[(x^b[i])&255]^(x>>>8);return (x^0xFFFFFFFF)>>>0;}
function makeZip(files){
  var parts=[],cen=[],off=0,enc=new TextEncoder();
  files.forEach(function(f){
    var nm=enc.encode(f.name),d=f.data,crc=crc32(d),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer),nm,d);
    var e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint32(16,crc,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
    cen.push(new Uint8Array(e.buffer),nm);
    off+=30+nm.length+d.length;
  });
  var csize=cen.reduce(function(n,p){return n+p.length;},0),z=new DataView(new ArrayBuffer(22));
  z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,csize,true);z.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(z.buffer)]),{type:'application/zip'});
}

function tableTickets(t){return S.d.tickets.filter(function(k){return k.table===t;});}
function calc(sub,svcOn,vatOn){

var readyAt={};      // ตั๋ว → เวลาที่หน้านี้เห็นว่าพร้อมเสิร์ฟ (เซิร์ฟเวอร์ไม่ได้เก็บ) ใช้เตือนซ้ำเมื่อค้าง
function detectNew(){
  // S.seen = สถานะล่าสุดของแต่ละตั๋วที่เห็นแล้ว (จับได้ทั้งตั๋วใหม่ และตั๋วที่เพิ่งเปลี่ยนเป็นพร้อมเสิร์ฟ)
  var ids={},calls={},fresh=[],ready=[],newCall=null,first=!S.seen;
  S.d.tickets.forEach(function(k){
    ids[k.id]=k.status;
    if(k.status==='ready'){if(!readyAt[k.id])readyAt[k.id]=Date.now();}else delete readyAt[k.id];
    if(first)return;
    if(!S.seen[k.id]&&k.status==='new')fresh.push(k);
    else if(k.status==='ready'&&S.seen[k.id]&&S.seen[k.id]!=='ready')ready.push(k);
  });
  Object.keys(S.d.calls).forEach(function(t){var key=t+':'+S.d.calls[t].at;calls[key]=1;if(S.seenCalls&&!S.seenCalls[key])newCall={t:t,c:S.d.calls[t]};});
  S.seen=ids;S.seenCalls=calls;
  Object.keys(readyAt).forEach(function(id){if(!ids[id])delete readyAt[id];});
  var msg=[],sound=null;
  if(fresh.length){
    msg.push('ออเดอร์ใหม่ '+where(fresh[0])+(fresh.length>1?' และอีก '+(fresh.length-1)+' ใบ':''));
    if(fresh.some(stationOk)&&hears('order'))sound='order';
  }
  if(newCall){var kb=newCall.c.kind==='bill'?'bill':'call';msg.push('โต๊ะ '+newCall.t+(kb==='bill'?' ขอเช็คบิล':' เรียกพนักงาน'));if(!sound&&hears(kb))sound=kb;}
  if(ready.length){
    var rt=ready.filter(function(k){return k.table>0;}).map(function(k){return k.table;}).filter(function(t,i,a){return a.indexOf(t)===i;});
    var rq=ready.filter(function(k){return k.table===0;}).map(function(k){return k.q;}).filter(function(t,i,a){return a.indexOf(t)===i;});
    if(rt.length)msg.push('พร้อมเสิร์ฟ โต๊ะ '+rt.join(', '));
    if(rq.length)msg.push('คิว '+rq.join(', ')+' พร้อมรับ');
    if(!sound&&hears('ready'))sound='ready';
  }
  if(msg.length)toast(msg.join(' · '));
  if(sound){beep(sound);lastRemind=Date.now();}
}
/* เตือนซ้ำทุก 1 นาที ถ้ามีเรื่องค้าง: ออเดอร์ใหม่ที่ยังไม่มีใครกดเริ่มทำเกิน 2 นาที (ครัว) / ลูกค้าเรียกหรือขอบิลแล้วยังไม่มีใครรับทราบเกิน 1 นาที / อาหารพร้อมเสิร์ฟค้างเกิน 2 นาที (หน้าร้าน)
   (เดิมดังครั้งเดียว ไม่ได้ยินก็พลาดเลย) */
var lastRemind=0,REMIND_MS=60000;
function remind(){
  if(!S.d||!$('#login').hidden||!soundReady()||Date.now()-lastRemind<REMIND_MS)return;
  // เวลาจากเซิร์ฟเวอร์ (createdAt, เวลาเรียก) เทียบกับ now() ที่ชดเชยนาฬิกาเครื่องนี้ต่างจากเครื่องร้านแล้ว (S.skew)
  // ไม่อย่างนั้นแท็บเล็ตนาฬิกาเร็วจะเห็นทุกออเดอร์ค้างแล้วเตือนทุกนาที · เวลาพร้อมเสิร์ฟจดด้วยนาฬิกาเครื่องนี้ เทียบกับ Date.now()
  var sv=now(),local=Date.now(),kind=null;
  if(hears('order')&&S.d.tickets.some(function(k){return k.status==='new'&&stationOk(k)&&sv-k.createdAt>=120000;}))kind='order';
  else if(hears('bill')&&Object.keys(S.d.calls).some(function(t){return S.d.calls[t].kind==='bill'&&sv-S.d.calls[t].at>=60000;}))kind='bill';
  else if(hears('call')&&Object.keys(S.d.calls).some(function(t){return S.d.calls[t].kind!=='bill'&&sv-S.d.calls[t].at>=60000;}))kind='call';

/* ---------- ขายหน้าร้าน ----------
   ตะกร้าอยู่ในเครื่องนี้ (localStorage) รีเฟรชแล้วไม่หาย reqId เก็บคู่กับตะกร้า (แบบเดียวกับกฎข้อ 23) ตะกร้าเปลี่ยน = reqId ใหม่
   ยอดที่เห็นคิดด้วย posTotals() แบบเดียวกับเซิร์ฟเวอร์ (รวมแถวสินค้าเดียวกันราคาเดียวกัน ปัดเป็นสตางค์ต่อแถว)
   แต่เซิร์ฟเวอร์คิดใหม่เองเสมอ และรับ expectedSub ที่จำไว้ตอนกดรับเงินครั้งแรก (กฎข้อ 22) ไม่ใช่ยอดตอนกดยืนยัน
   ช่องค้นหา #pos-q สร้างครั้งเดียว อยู่นอกส่วนที่วาดใหม่ สแกนบาร์โค้ดระหว่างมีออเดอร์เข้า ตัวอักษรไม่หาย */
var POS_KEY='ordervai-pos';
function posInit(){
  if(S.pos)return S.pos;
  var p={lines:[],memo:'',level:'retail',kind:null,kitchen:true,svc:false,vat:null,cat:0,q:'',reqId:null,cash:'',paySub:null,last:null,busy:false,noteOpen:-1};
  try{
    var j=JSON.parse(localStorage.getItem(POS_KEY)||'null');
    if(j&&j.v===1&&Array.isArray(j.lines)){
      p.lines=j.lines.filter(function(l){return l&&typeof l.id==='number'&&typeof l.qty==='number'&&l.qty>0;}).map(function(l){
        return {id:l.id,qty:l.qty,txt:String(l.qty),note:Array.isArray(l.note)?l.note.filter(function(n){return typeof n==='string';}):[]};
      });
      p.memo=typeof j.memo==='string'?j.memo:'';p.level=j.level==='wholesale'?'wholesale':'retail';
      p.kind=j.kind==='buy'||j.kind==='sell'?j.kind:null;p.reqId=typeof j.reqId==='string'&&/^[a-f0-9]{8,64}$/.test(j.reqId)?j.reqId:null;
    }
  }catch(e){}
  return (S.pos=p);
}
function savePos(){
  var p=S.pos;if(!p)return;
  try{localStorage.setItem(POS_KEY,JSON.stringify({v:1,lines:p.lines.filter(function(l){return l.qty>0;}).map(function(l){return {id:l.id,qty:l.qty,note:l.note};}),memo:p.memo,level:p.level,kind:p.kind,reqId:p.reqId}));}catch(e){}
}
function rid(){
  var a=new Uint8Array(8);
  try{crypto.getRandomValues(a);}catch(e){for(var i=0;i<8;i++)a[i]=Math.floor(Math.random()*256);}
  return Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
}
// ขาย / รับซื้อ: ร้านรับซื้อของเริ่มที่รับซื้อ ร้านอื่นเริ่มที่ขาย (ไม่ได้เปิดโหมดรับซื้อ = ขายเสมอ)
function posKind(){var p=posInit();if(!modes().buy)return 'sell';return p.kind||(S.d.biz&&S.d.biz.kind==='buy'?'buy':'sell');}
function posPrice(m,kind){return kind==='sell'&&S.pos.level==='wholesale'&&m.price2>0?m.price2:m.price;}
function okLine(l,m){return l.qty>0&&(m.dec?l.qty<=100000:(l.qty===Math.floor(l.qty)&&l.qty<=10000));}
function posTotals(){
  var p=posInit(),kind=posKind(),map={},order=[],bad=false;
  p.lines.forEach(function(l){
    var m=itemById(l.id);if(!m)return;
    if(!okLine(l,m)){bad=true;return;}
    var pr=posPrice(m,kind),k=m.id+'|'+pr;
    if(!map[k]){map[k]={qty:0,price:pr};order.push(k);}
    map[k].qty=Math.round((map[k].qty+l.qty)*1000)/1000;
  });
  var sub=0;order.forEach(function(k){sub+=round2(map[k].price*map[k].qty);});
  sub=round2(sub);
  var c=kind==='buy'?{sub:sub,svc:0,vat:0,total:sub}:calc(sub,!!p.svc,p.vat===null?!!S.d.settings.vat:!!p.vat);
  c.bad=bad;c.kind=kind;c.count=order.length;
  return c;
}
// ตะกร้าเปลี่ยน: ยอดที่จำไว้ตอนกดรับเงินใช้ไม่ได้แล้ว ต้องกดใหม่ และคำขอนี้เป็นคนละรายการกับที่เคยส่ง (reqId ใหม่)
function posChanged(){var p=S.pos;p.reqId=null;p.last=null;if(S.confirm&&/^ppay:/.test(S.confirm))disarm();}
function posVatOn(){var p=posInit();return p.vat===null?!!S.d.settings.vat:!!p.vat;}
function posAdd(id,qty,scan){
  var p=posInit(),m=itemById(id),kind=posKind();if(!m||m.hidden)return;
  if(kind==='sell'&&S.d.settings.soldOut.indexOf(id)>=0){toast(m.name+' หมดแล้ว');return;}
  posChanged();
  var l=p.lines.filter(function(x){return x.id===id&&!x.note.length;}).pop();
  if(qty==null&&m.dec){
    // ขายตามน้ำหนัก: แตะสินค้า = ใส่น้ำหนักเอง (สแกนบาร์โค้ด = 1 หน่วย ไม่ย้ายโฟกัสออกจากช่องสแกน)
    if(!l){l={id:id,qty:1,txt:'1',note:[]};p.lines.push(l);}
    else if(scan){l.qty=Math.round((l.qty+1)*1000)/1000;l.txt=String(l.qty);}
    savePos();renderPosCart();renderPosGrid();
    if(!scan){var el=$('#pos-qty-'+p.lines.indexOf(l));if(el){el.focus();el.select();}}
    return;
  }
  qty=qty||1;
  if(l){l.qty=m.dec?Math.round((l.qty+qty)*1000)/1000:l.qty+qty;l.txt=String(l.qty);}
  else p.lines.push({id:id,qty:m.dec?Math.round(qty*1000)/1000:qty,txt:String(qty),note:[]});
  savePos();renderPosCart();renderPosGrid();
}
// สแกนบาร์โค้ด/พิมพ์รหัสแล้ว Enter: รหัสตรงทุกตัว → เพิ่มเลย ไม่ตรงแต่ค้นเจออย่างเดียว → เพิ่มอันนั้น · "3*รหัส" = 3 ชิ้น
function posScan(v){
  v=String(v||'').trim();if(!v)return;
  var qty=null,mt=v.match(/^(\d+(?:\.\d+)?)\s*[*xX×]\s*(.+)$/);
  if(mt){qty=+mt[1];v=mt[2].trim();}
  var lv=v.toLowerCase(),items=S.d.menu.items.filter(function(m){return !m.hidden;});
  var hit=items.filter(function(m){return m.sku&&m.sku.toLowerCase()===lv;})[0];
  if(!hit){var f=items.filter(function(m){return m.name.toLowerCase().indexOf(lv)>=0||(m.sku&&m.sku.toLowerCase().indexOf(lv)>=0);});if(f.length===1)hit=f[0];}
  if(!hit){toast('ไม่พบ'+words().item+' "'+v+'"');return;}
  if(qty!=null&&!(qty>0)){toast('จำนวนไม่ถูกต้อง');return;}
  if(qty!=null&&!hit.dec&&qty!==Math.floor(qty)){toast(hit.name+' ขายเป็นจำนวนเต็มเท่านั้น');return;}
  posAdd(hit.id,qty,true);
  var q=$('#pos-q');if(q){q.value='';q.focus();}S.pos.q='';renderPosGrid();
}
function renderCounter(){
  var p=posInit(),v=$('#v-counter');
  if(!$('#pos-q')){
    v.innerHTML='<div id="pos-qs"></div><div class="pos"><div class="panel"><div class="pos-search"><label class="f" for="pos-q">ค้นหา หรือสแกนบาร์โค้ด'+
      '<input class="in" id="pos-q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="done"></label></div><div class="tools" id="pos-cats"></div><div class="pgrid" id="pos-grid"></div></div>'+
      '<aside class="panel pos-cart" id="pos-cart" aria-labelledby="pos-cart-h"></aside></div><button class="pos-sum" id="pos-sum" data-a="posjump" type="button" hidden></button>';
    $('#pos-q').value=p.q;
  }
  $('#pos-q').placeholder='ชื่อ'+words().item+' หรือรหัส แล้วกด Enter · 3*รหัส = 3 ชิ้น';
  // สินค้าที่ถูกลบ/ซ่อนจากอีกเครื่อง: เอาออกจากตะกร้าแล้วบอก (ไม่ปล่อยให้กดรับเงินแล้วได้ error)
  var gone=p.lines.filter(function(l){var m=itemById(l.id);return !m||m.hidden;});
  if(gone.length){p.lines=p.lines.filter(function(l){return gone.indexOf(l)<0;});posChanged();savePos();toast('เอา'+words().item+'ที่ไม่มีขายแล้วออกจากตะกร้า '+gone.length+' รายการ');}
  renderPosQueue();renderPosCats();renderPosGrid();renderPosCart();
}
/* คิวที่ส่งเข้าจอครัว/บาร์: พร้อมรับ = ทุกจุดทำเสร็จแล้ว หน้าร้านเรียกคิวแล้วกด "ลูกค้ารับแล้ว" */
function renderPosQueue(){
  var el=$('#pos-qs');if(!el)return;
  var qs={},order=[];
  S.d.tickets.forEach(function(k){if(k.table!==0)return;if(!qs[k.q]){qs[k.q]=[];order.push(k.q);}qs[k.q].push(k);});
  if(!order.length||!modes().kitchen){redraw(el,'');return;}
  var ready=order.filter(function(q){return qs[q].every(function(k){return k.status==='ready';});}),wait=order.filter(function(q){return ready.indexOf(q)<0;});
  var h='<div class="qstrip" aria-live="polite">';
  if(ready.length)h+=ready.map(function(q){return '<span class="qchip">คิว '+q+' พร้อมรับ<button class="btn sm" data-a="qdone" data-id="'+q+'">ลูกค้ารับแล้ว</button></span>';}).join('');
  if(wait.length)h+='<span class="pill acc">กำลังทำ: คิว '+wait.join(', ')+'</span>';
  redraw(el,h+'</div>');
}
function renderPosCats(){
  var el=$('#pos-cats');if(!el)return;

}

function posPay(method){
  var p=S.pos,c=posTotals(),kind=c.kind;
  if(!p.reqId)p.reqId=rid();

  var body={items:p.lines.map(function(l){return {id:l.id,qty:l.qty,note:l.note};}),kind:kind,level:p.level,kitchen:modes().kitchen&&kind==='sell'&&!!p.kitchen,
    svc:kind==='sell'&&!!p.svc,vat:kind==='sell'&&posVatOn(),method:method,memo:p.memo,reqId:p.reqId,expectedSub:p.paySub};

}

function fv(v){
  if(v&&typeof v==='object'){var k=Object.keys(v).filter(function(x){return v[x]!==''&&v[x]!=null;});return k.length?k.map(function(x){return x+' '+(typeof v[x]==='object'?JSON.stringify(v[x]):v[x]);}).join(' '):'(ว่าง)';}
  return v===true?'เปิด':v===false?'ปิด':(v===''||v==null)?'(ว่าง)':String(v);
}
// ประเภทธุรกิจ/วิธีขายใน log เก็บเป็นรหัส แปลงเป็นชื่อที่อ่านได้
function fieldVal(k,v){
  if(k==='biz'){var p=(S.bizList||[]).filter(function(x){return x.key===v;})[0];return v?(p?p.name:v):'(ยังไม่ได้เลือก)';}
  if(k==='modes'&&v&&typeof v==='object'){var on=['table','kitchen','counter','buy'].filter(function(m){return v[m];}).map(function(m){return {table:'โต๊ะ',kitchen:'จอทำ',counter:'หน้าร้าน',buy:'รับซื้อ'}[m];});return on.join(' + ')||'(ไม่มี)';}
  return fv(v);
}
function changes(e){return Object.keys(e.after||{}).map(function(k){return (FLD[k]||k)+' '+fieldVal(k,e.before&&e.before[k])+' → '+fieldVal(k,e.after[k]);}).join(', ');}
function auditDetail(e){

  if(e.action==='sale.rejected')return (e.kind==='buy'?'รับซื้อ ':'')+'ยอดตอนกด '+baht(e.expectedSub)+' ยอดจริง '+baht(e.actualSub);

  if(e.action==='menu.item.updated')return (e.itemName||'')+' · '+changes(e);
  if(e.action==='staff.created')return (e.after&&e.after.name||'')+' · '+(S.d.roles[e.after&&e.after.role]||'');
  if(e.action==='staff.updated')return (e.targetName||'')+(e.pinChanged?' · เปลี่ยน PIN':'')+(e.after?' · '+changes(e):'');
  if(e.action==='staff.sessions_revoked')return e.target==='owner'?'เจ้าของร้าน':((S.staff||[]).filter(function(x){return x.id===e.target;})[0]||{name:e.target}).name;
  if(e.action==='settings.changed')return changes(e);
  if(e.action==='menu.soldout')return (e.itemName||'')+(e.after?' หมด':' กลับมามีขาย');

/* ---------- ธีมร้าน: โลโก้และสีปุ่ม ----------
   สีทั้งหมดคำนวณที่เซิร์ฟเวอร์ (lib/theme.js) หน้านี้แค่ขอผล /api/theme/preview มาแสดงตัวอย่าง */
/* โหลดสีร้าน (/theme.css): โหลดไฟล์ใหม่ให้เสร็จก่อนแล้วค่อยเอาอันเก่าออก (สีไม่กะพริบ)
   โหลดไม่สำเร็จ (เซิร์ฟเวอร์รีสตาร์ท/เน็ตสะดุด) ลองใหม่ทุก 5 วินาที ระหว่างนั้นใช้สีที่มีอยู่ */
var themeTry=null;
function loadTheme(v){
  clearTimeout(themeTry);
  var old=document.getElementById('theme-css'),l=document.createElement('link');
  l.rel='stylesheet';l.href='/theme.css?v='+encodeURIComponent(v);
  l.onload=function(){document.querySelectorAll('link[rel=stylesheet]').forEach(function(x){if(x!==l)x.parentNode.removeChild(x);});l.id='theme-css';};
  l.onerror=function(){if(l.parentNode)l.parentNode.removeChild(l);themeTry=setTimeout(function(){loadTheme(v);},5000);};
  document.head.appendChild(l);
}
// ไฟล์ใน <head> โหลดเสร็จ (หรือล้ม) ก่อนสคริปต์นี้ทำงานเสมอ โหลดล้มแล้ว Chromium ยังมี sheet เปล่าให้ แต่อ่าน cssRules ไม่ได้
function sheetOk(l){try{return !!(l&&l.sheet&&l.sheet.cssRules);}catch(e){return false;}}
if(!sheetOk(document.getElementById('theme-css')))loadTheme(Date.now());
var themeApplied=null;
function setLogo(img,name){if(name){img.src='/img/'+name;img.hidden=false;}else{img.removeAttribute('src');img.hidden=true;}}
function applyTheme(accent){
  if(themeApplied===null){themeApplied=accent;return;}       // ครั้งแรก: /theme.css ใน <head> ตรงอยู่แล้ว
  if(accent===themeApplied)return;
  themeApplied=accent;loadTheme(Date.now());
}
function themeBusy(){var a=document.activeElement;return !!(a&&a.closest&&a.closest('#theme')&&a.tagName==='INPUT');}
function renderTheme(){
  var el=$('#theme');if(!el)return;

  if((s.accent||'')!==T.base){if(T.pick===T.base){T.pick=s.accent||'';T.err='';previewTheme(T.pick);}T.base=s.accent||'';}

    '<div class="stack" style="gap:6px"><label class="btn" for="logo-file">'+(s.logo?'เปลี่ยนโลโก้':'เลือกรูปโลโก้')+'</label>'+
    (s.logo?'<button class="btn'+(armed('logodel')?' danger':'')+'" data-a="logodel">'+(armed('logodel')?'ยืนยันเอาโลโก้ออก':'เอาโลโก้ออก')+'</button>':'')+'</div></div>'+
    '<span class="muted small">PNG พื้นใส หรือ JPG สี่เหลี่ยมจัตุรัส ระบบย่อเหลือ 512 px ให้เอง</span>'+
    '<b style="margin-top:10px">ภาพพื้นหลังหน้าลูกค้า</b><div class="cover-box">'+(s.cover?'<img class="cv" src="/img/'+esc(s.cover)+'" alt="ภาพพื้นหลังปัจจุบัน">':'<div class="ph">ยังไม่มีภาพ (ใช้สีร้านไล่สีแทน)</div>')+
    '<div class="stack" style="gap:6px"><label class="btn" for="cover-file">'+(s.cover?'เปลี่ยนภาพพื้นหลัง':'เลือกภาพพื้นหลัง')+'</label>'+

    '<span class="muted small">ภาพแนวนอน เช่น หน้าร้าน หรืออาหารเด่น แสดงเต็มที่หัวหน้าลูกค้า และจางๆ เป็นพื้นหลังทั้งหน้า (ตัวหนังสือยังอ่านชัด) ใช้เป็นพื้นหลังหน้าใส่รหัสพนักงานด้วย ระบบย่อเหลือ 1600 px ให้เอง</span></div>';
  var LOOK=[['dark','มืด'],['light','สว่าง'],['auto','ตามเครื่องลูกค้า']];
  h+='<div class="stack" style="gap:6px"><b>โทนสีหน้าลูกค้า</b><div class="swatches" role="group" aria-label="โทนสีหน้าลูกค้า">'+LOOK.map(function(x){

  }).join('')+'</div><span class="muted small">มืด = พื้นเข้มแบบร้านอาหารยามค่ำ สว่าง = พื้นขาว ตามเครื่องลูกค้า = ตามที่มือถือแต่ละคนตั้งไว้ (หน้าพนักงานตามเครื่องนี้เสมอ)</span>'+
    '<b style="margin-top:10px">สีปุ่มหลัก</b><div class="swatches" role="group" aria-label="ชุดสีสำเร็จรูป">'+T.presets.map(function(p){
    return '<button class="swatch" data-a="tpreset" data-c="'+esc(p.color)+'" aria-pressed="'+(cur===p.color)+'"><i style="background:'+esc(p.color||'#84cc16')+'"></i>'+esc(p.name)+'</button>';
  }).join('')+'</div>'+
    '<div class="tpick"><label class="f" for="t-color" style="flex-direction:row;align-items:center;gap:10px">เลือกสีเอง<input type="color" id="t-color" value="'+esc(cur||'#84cc16')+'"></label><code class="small">'+esc(cur||'สีตั้งต้น')+'</code></div>'+
    '<div class="tprev" id="t-prev"><span class="muted small">ตัวอย่าง</span><button class="btn primary" type="button" tabindex="-1">สั่งอาหาร ฿120</button><span><span class="pill acc">กำลังทำ</span> <span style="color:var(--accent-text);font-weight:600">+ เพิ่มหมายเหตุ</span></span></div>'+
    '<div class="err" role="alert">'+esc(T.err)+'</div>'+
    '<div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap"><button class="btn primary" data-a="tsave"'+(T.saving||T.err||cur===(s.accent||'')?' disabled':'')+'>บันทึกสี</button>'+
    (cur!==(s.accent||'')?'<button class="btn" data-a="treset">ยกเลิก</button>':'')+'</div></div></div>';

function paintPreview(){
  var p=$('#t-prev'),T=S.theme;if(!p||!T)return;
  var dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  var v=T.prev&&T.prev.ok&&T.pick?T.prev[dark?'dark':'light']:null;
  ['accent','accent-line','accent-ink','accent-soft','accent-text','focus'].forEach(function(k){if(v)p.style.setProperty('--'+k,v[k]);else p.style.removeProperty('--'+k);});
}
function previewTheme(color){
  api('/api/theme/preview'+(color?'?accent='+encodeURIComponent(color):'')).then(function(r){
    var T=S.theme;if(!T||T.pick!==color)return;           // เลือกสีอื่นไปแล้ว
    T.loading=false;
    if(r.j.presets)T.presets=r.j.presets;
    T.prev=r.j;T.err=r.ok&&r.j.ok===false?r.j.error:'';
    if(themeBusy()){
      // กำลังลากเลือกสี: อัปเดตเฉพาะตัวอย่าง ไม่วาดทับช่องเลือกสี
      paintPreview();var e=document.querySelector('#theme .err');if(e)e.textContent=T.err;
      var sv=document.querySelector('[data-a="tsave"]');if(sv)sv.disabled=!!T.err||T.saving||T.pick===(S.d.settings.accent||'');
    }
    else renderTheme();
  },function(){});
}
function pickTheme(color){var T=S.theme;T.pick=color;T.err='';previewTheme(color);if(!themeBusy())renderTheme();}
/* กรอบของเนื้อโลโก้จริง: พิกเซลที่ไม่ใส และสีต่างจากมุมซ้ายบนชัดเจน (รูปเต็มกรอบ เช่น ภาพถ่าย = ไม่ตัด) */
function trimBox(img){
  var W=img.naturalWidth,H=img.naturalHeight,all={x:0,y:0,w:W,h:H};
  try{
    var k=Math.min(1,400/Math.max(W,H)),w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
    var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    var d=x.getImageData(0,0,w,h).data,bg=[d[0],d[1],d[2],d[3]],x0=w,y0=h,x1=-1,y1=-1;
    for(var y=0;y<h;y++)for(var i=0;i<w;i++){
      var p=(y*w+i)*4,a=d[p+3];
      var ink=bg[3]<16?a>24:(a>24&&Math.abs(d[p]-bg[0])+Math.abs(d[p+1]-bg[1])+Math.abs(d[p+2]-bg[2])>48);
      if(ink){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y;}
    }
    if(x1<0||(x1-x0+1)*(y1-y0+1)>w*h*0.9)return all;
    return {x:Math.floor(x0/k),y:Math.floor(y0/k),w:Math.ceil((x1-x0+1)/k),h:Math.ceil((y1-y0+1)/k)};
  }catch(e){return all;}
}
function resizeLogo(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      // ตัดขอบว่างรอบโลโก้ (พื้นใส หรือพื้นสีเดียวกับมุมรูป) โลโก้ที่มีขอบขาวกว้างจะได้ไม่เล็กจิ๋วในกรอบ
      var b=trimBox(img),pad=Math.round(Math.max(b.w,b.h)*0.06);
      var sx=Math.max(0,b.x-pad),sy=Math.max(0,b.y-pad),sw=Math.min(img.naturalWidth-sx,b.w+pad*2),sh=Math.min(img.naturalHeight-sy,b.h+pad*2);
      var max=512,k=Math.min(1,max/Math.max(sw,sh)),w=Math.max(1,Math.round(sw*k)),h=Math.max(1,Math.round(sh*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?resolve(b):reject(new Error('แปลงรูปไม่สำเร็จ'));},'image/png');   // PNG เก็บพื้นใส
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('เปิดไฟล์รูปนี้ไม่ได้ ลองใช้ไฟล์ PNG หรือ JPG'));};
    img.src=url;
  });
}
function resizeCover(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?resolve(b):reject(new Error('แปลงรูปไม่สำเร็จ'));},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('เปิดไฟล์รูปนี้ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'));};
    img.src=url;
  });
}

function preparePayQr(file){
  if(file.size<=2.5*1024*1024&&/^image\/(png|jpeg|webp)$/.test(file.type))return Promise.resolve({blob:file,type:file.type});
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,w,h);x.imageSmoothingEnabled=false;x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?resolve({blob:b,type:'image/png'}):reject(new Error('แปลงรูปไม่สำเร็จ'));},'image/png');
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('เปิดไฟล์รูปนี้ไม่ได้ ลองแคปหน้าจอ QR เป็นไฟล์ PNG หรือ JPG'));};
    img.src=url;
  });
}

function resizeImage(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=900,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?resolve(b):reject(new Error('แปลงรูปไม่สำเร็จ'));},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('เปิดไฟล์รูปนี้ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'));};
    img.src=url;
  });
}

/* อ่านไฟล์สำรองเพื่อแสดงสรุปก่อนกู้คืน: แตก gzip ในเบราว์เซอร์ ถ้าเบราว์เซอร์เก่าทำไม่ได้ ก็ยังกู้คืนได้แต่ไม่มีสรุป */
function readBackupText(file){
  return file.arrayBuffer().then(function(ab){
    var u=new Uint8Array(ab);
    if(u.length>2&&u[0]===0x1f&&u[1]===0x8b){
      if(typeof DecompressionStream==='undefined')return {gz:true,text:null};
      return new Response(new Blob([ab]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(function(t){return {gz:true,text:t};});
    }
    return {gz:false,text:new TextDecoder().decode(u)};
  });
}
function pickRestore(file){
  readBackupText(file).then(function(r){
    if(r.text===null){
      S.rs={file:file,gz:true,info:null};renderBackups();return;
    }
    var b;try{b=JSON.parse(r.text);}catch(e){b=null;}
    if(!b||b.app!=='ordervai-backup'||!b.data){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของออเดอร์ไว');return;}
    var d=b.data,open={};(d.tickets||[]).forEach(function(k){open[k.table]=1;});
    S.rs={file:file,gz:r.gz,info:{shop:(d.settings&&d.settings.shop)||'-',at:b.createdAt,items:(d.menu&&d.menu.items||[]).length,images:Object.keys(b.images||{}).length,months:Object.keys(b.sales||{}).length,open:Object.keys(open).length}};
    renderBackups();
  },function(){toast('อ่านไฟล์ไม่ได้ ไฟล์อาจเสียหาย');});
}
function doRestore(){
  if(!S.rs||S.restoring)return;
  if(!S.rsFresh){ensureFresh().then(function(ok){if(ok){S.rsFresh=true;doRestore();}});return;}
  S.rsFresh=false;
  S.restoring=true;renderBackups();
  fetch('/api/backup/restore',{method:'POST',headers:{'Content-Type':S.rs.gz?'application/gzip':'application/json'},body:S.rs.file,credentials:'same-origin'})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j};},function(){return {ok:false,j:{}};});})
    .then(function(r){
      S.restoring=false;
      if(!r.ok){toast(r.j.error||'กู้คืนไม่สำเร็จ');renderBackups();if(r.status===401)showLogin();return;}
      S.rs=null;S.dirty=false;S.sel=null;S.lastSale=null;S.seen=null;S.seenCalls=null;
      toast('กู้คืนข้อมูลแล้ว'+(r.j.dropped?' (ข้ามข้อมูลที่เสีย '+r.j.dropped+' รายการ)':'')+' · ข้อมูลก่อนกู้คืนสำรองไว้ที่ '+r.j.safetyBackup);
      load();loadBackups();
    },function(){S.restoring=false;toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');renderBackups();});
}

/* ---------- events ---------- */
function printMode(mode,extra){
  var pa=$('#print-area');
  if(mode==='receipt'){
    var src=document.querySelector('.view:not([hidden]) .receipt');
    if(!src){toast('ไม่พบใบเสร็จที่จะพิมพ์');return;}
    pa.innerHTML='';pa.appendChild(src.cloneNode(true));
  }
  document.body.classList.add('pm-'+mode);if(extra)document.body.classList.add(extra);
  var done=function(){document.body.classList.remove('pm-'+mode);if(extra)document.body.classList.remove(extra);pa.innerHTML='';document.querySelectorAll('.qcard.pick').forEach(function(c){c.classList.remove('pick');});window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  // รอรูปในสำเนา (โลโก้ / รูป QR รับเงิน) โหลดเสร็จก่อนสั่งพิมพ์ ไม่อย่างนั้นได้ช่องว่างแทนรูป QR (รอไม่เกิน 3 วินาที)
  var wait=Array.prototype.slice.call(pa.querySelectorAll('img')).filter(function(i){return !i.complete;}).map(function(i){
    return new Promise(function(r){i.addEventListener('load',r);i.addEventListener('error',r);setTimeout(r,3000);});
  });
  Promise.all(wait).then(function(){setTimeout(function(){window.print();},50);});
}
document.addEventListener('input',function(e){

  if(e.target.id==='t-color'){pickTheme(e.target.value.toLowerCase());return;}
  if(e.target.closest&&e.target.closest('#v-settings')&&e.target.tagName==='INPUT'&&e.target.type!=='file'){S.dirty=true;}
  if(e.target.id==='m-q'){S.q=e.target.value;renderMenuGrid();}
  if(e.target.id==='pos-q'){posInit().q=e.target.value;renderPosGrid();return;}
  if(e.target.id==='pos-memo'){S.pos.memo=e.target.value;savePos();return;}
  if(e.target.id&&e.target.id.indexOf('pos-qty-')===0){posQty(+e.target.dataset.i,e.target.value);return;}
  if(e.target.id==='pos-cash'){
    S.pos.cash=e.target.value.replace(/[^\d.]/g,'');if(e.target.value!==S.pos.cash)e.target.value=S.pos.cash;
    var pc=posTotals(),pch=$('#pos-change');if(pch)pch.innerHTML=cashInfo(pc.total,S.pos.cash);
    var pcb=document.querySelector('[data-a="ppay"][data-m="cash"]');if(pcb)pcb.disabled=cashState(pc.total,S.pos.cash).short;
    return;
  }
  if(e.target.id==='cash-in'){S.cash=e.target.value.replace(/[^\d.]/g,'');if(e.target.value!==S.cash)e.target.value=S.cash;var pb=document.querySelector('[data-a="pay"][data-m="cash"]');if(pb)updateCash(+pb.dataset.due);}
});
document.addEventListener('change',function(e){

});
/* หน้าขายหน้าร้าน: เครื่องสแกนบาร์โค้ดพิมพ์เหมือนคีย์บอร์ด ถ้าโฟกัสไม่ได้อยู่ในช่องกรอก (เช่น เพิ่งแตะสินค้า) ย้ายไปช่องค้นหาก่อนตัวอักษรแรกเข้า */
document.addEventListener('keydown',function(e){
  if(S.tab!=='counter'||!S.d||e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1||e.key===' ')return;
  var a=document.activeElement,tag=a&&a.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||document.querySelector('dialog[open]')||!$('#login').hidden)return;
  var q=$('#pos-q');if(q)q.focus();
},true);
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(e.target.id==='cash-in'){e.preventDefault();var cb=document.querySelector('[data-a="pay"][data-m="cash"]');if(cb&&!cb.disabled)cb.click();return;}
  if(e.target.id==='pos-q'){e.preventDefault();posScan(e.target.value);return;}
  if(e.target.id==='pos-cash'){e.preventDefault();var pb=document.querySelector('[data-a="ppay"][data-m="cash"]');if(pb&&!pb.disabled)pb.click();return;}
  if(e.target.id==='e-sku'){e.preventDefault();return;}      // เครื่องสแกนบาร์โค้ดกด Enter ต่อท้ายรหัส: ไม่ต้องทำอะไร
  if(e.target.id&&e.target.id.indexOf('pos-qty-')===0){e.preventDefault();var pq=$('#pos-q');if(pq)pq.focus();return;}
  if(e.target.id==='c-new'){e.preventDefault();var b=document.querySelector('[data-a="catadd"]');if(b)b.click();}
  if(e.target.id==='c-edit'){e.preventDefault();var b2=document.querySelector('[data-a="catsave"]');if(b2)b2.click();}
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,id=+b.dataset.id;
  if(a==='bkdl'){e.preventDefault();var href=b.getAttribute('href');ensureFresh().then(function(ok){if(ok)location.href=href;});return;}
  if(['void','pay','edel','catdel','rsgo','cashq','ppay','pcashq','posclear','pnotes','pnote','pkit','psvc','pvat'].indexOf(a)<0)disarm();
  if(a==='tab'){
    S.tab=b.dataset.v;S.viewSale=null;
    if(S.tab==='report')loadReport();
    if(S.tab==='settings'){if(!S.dirty)renderSettings();loadBackups();loadStaff();}
    if(S.tab==='menu')renderMenu();
    if(S.tab==='settings')loadBiz();
    render();
    if(S.tab==='counter'&&matchMedia('(min-width:900px)').matches){var pq0=$('#pos-q');if(pq0)pq0.focus();}
  }
  /* ขายหน้าร้าน */
  else if(a==='padd'){posAdd(id);}
  else if(a==='pcat'){S.pos.cat=id;renderPosCats();renderPosGrid();}
  else if(a==='pdel'){var pi=+b.dataset.i;S.pos.lines.splice(pi,1);S.pos.noteOpen=-1;posChanged();savePos();renderPosCart();renderPosGrid();}
  else if(a==='pinc'||a==='pdec'){
    var pl=S.pos.lines[+b.dataset.i],pm=pl&&itemById(pl.id);
    if(pl&&pm){
      var step=pm.dec?0.1:1,nq=(pl.qty>0?pl.qty:0)+(a==='pinc'?step:-step);
      nq=pm.dec?Math.round(nq*1000)/1000:Math.round(nq);
      if(nq>0){pl.qty=nq;pl.txt=String(nq);posChanged();savePos();renderPosCart();renderPosGrid();}
    }
  }
  else if(a==='pnotes'){var ni=+b.dataset.i;S.pos.noteOpen=S.pos.noteOpen===ni?-1:ni;renderPosCart();}
  else if(a==='pnote'){
    var nl=S.pos.lines[+b.dataset.i],nn=S.d.menu.notes[+b.dataset.v];
    if(nl&&nn){var nk=nl.note.indexOf(nn);if(nk>=0)nl.note.splice(nk,1);else nl.note.push(nn);S.pos.reqId=null;savePos();renderPosCart();}
  }
  else if(a==='pkind'){if(posKind()!==b.dataset.v){S.pos.kind=b.dataset.v;posChanged();savePos();render();}}
  else if(a==='plevel'){if(S.pos.level!==b.dataset.v){S.pos.level=b.dataset.v;posChanged();savePos();renderPosCart();renderPosGrid();}}
  else if(a==='pkit'){S.pos.kitchen=!S.pos.kitchen;S.pos.reqId=null;renderPosCart();}
  else if(a==='psvc'){S.pos.svc=!S.pos.svc;S.pos.reqId=null;renderPosCart();}
  else if(a==='pvat'){S.pos.vat=!posVatOn();S.pos.reqId=null;renderPosCart();}
  else if(a==='posclear'){
    if(!armed('posclear')){arm('posclear',4000);return;}
    disarm();S.pos.lines=[];S.pos.memo='';S.pos.noteOpen=-1;posChanged();savePos();render();
  }
  else if(a==='ppay'){
    var pp=S.pos,pmeth=b.dataset.m,pkey='ppay:'+pmeth,pt=posTotals();
    if(!pp.lines.length||pt.bad||pp.busy)return;
    // จำยอดตอนกดครั้งแรก (กฎข้อ 22) ถ้าราคาเปลี่ยนก่อนกดยืนยัน เซิร์ฟเวอร์ตอบ 409 ให้ตรวจยอดใหม่
    if(!armed(pkey)){
      pp.paySub=pt.sub;pp.cash='';
      arm(pkey,60000);
      if(pmeth==='cash'&&pt.kind==='sell'){var pci=$('#pos-cash');if(pci)pci.focus();}
      return;
    }
    if(pmeth==='cash'&&pt.kind==='sell'&&cashState(pt.total,pp.cash).short)return;
    disarm();
    posPay(pmeth);
  }
  else if(a==='pcashq'){
    S.pos.cash=b.dataset.v;var pc2=$('#pos-cash');if(pc2)pc2.value=S.pos.cash;
    var pt2=posTotals(),pch2=$('#pos-change');if(pch2)pch2.innerHTML=cashInfo(pt2.total,S.pos.cash);
    var pcb2=document.querySelector('[data-a="ppay"][data-m="cash"]');if(pcb2)pcb2.disabled=cashState(pt2.total,S.pos.cash).short;
  }
  else if(a==='posnext'){S.pos.last=null;render();var pq1=$('#pos-q');if(pq1)pq1.focus();}
  else if(a==='posjump'){var pcart=$('#pos-cart');if(pcart){pcart.scrollIntoView({behavior:'smooth',block:'start'});var hh=$('#pos-cart-h');if(hh){hh.tabIndex=-1;hh.focus({preventScroll:true});}}}
  else if(a==='qdone'){
    var dq=id,dts=S.d.tickets.filter(function(k){return k.table===0&&k.q===dq&&k.status==='ready';});
    dts.reduce(function(pr,k){return pr.then(function(){return act('/api/ticket',{id:k.id,from:'ready',status:'served'});});},Promise.resolve()).then(function(){toast('คิว '+dq+' รับของแล้ว');});
  }
  else if(a==='kst'){S.kStation=b.dataset.s;render();}
  else if(a==='adv'){act('/api/ticket',{id:id,from:b.dataset.from,status:b.dataset.st},b.dataset.st==='ready'?'แจ้งพนักงานไปรับอาหารแล้ว':null);}
  else if(a==='void'){openVoid(id);}
  else if(a==='sel'){S.lastSale=null;S.sel=S.sel===id?null:id;S.bSvc=S.d.settings.svc;S.bVat=S.d.settings.vat;render();}
  else if(a==='clearcall'){act('/api/call/clear',{table:id});}
  else if(a==='bsvc'){S.bSvc=!S.bSvc;render();}
  else if(a==='bvat'){S.bVat=!S.bVat;render();}
  else if(a==='printr'){printMode('receipt');}
  else if(a==='pay'){
    var key='pay:'+id+':'+b.dataset.m;
    // จำยอดตอนกดครั้งแรก ถ้าลูกค้าสั่งเพิ่มก่อนกดยืนยัน ปุ่มจะแสดงยอดใหม่ แต่เงินที่รับมาเป็นยอดเดิม เซิร์ฟเวอร์จึงต้องปฏิเสธ
    if(!armed(key)){
      S.paySub=+b.dataset.sub;S.cash='';
      // เงินสด: ให้เวลากรอกเงินที่รับมา 1 นาที
      arm(key,b.dataset.m==='cash'?60000:4000);
      // focus ทันทีในจังหวะที่แตะ (ไม่ใช้ setTimeout) ไม่อย่างนั้น iPhone ไม่เปิดคีย์บอร์ด และตัวเลขที่พิมพ์เร็วจะหาย
      if(b.dataset.m==='cash'){var ci=$('#cash-in');if(ci)ci.focus();}
      return;
    }
    var isCash=b.dataset.m==='cash';
    if(isCash&&cashState(+b.dataset.due).short)return;
    disarm();
    if(S.busy)return;
    S.busy=true;
    act('/api/pay',{table:id,svc:S.bSvc,vat:S.bVat,method:b.dataset.m,expectedSub:S.paySub,received:isCash&&S.cash!==''?+S.cash:undefined}).then(function(r){
      S.busy=false;S.cash='';
      if(document.activeElement&&document.activeElement.id==='cash-in')document.activeElement.blur();
      if(r&&r.ok){
        S.lastCash=r.j.received!=null?{received:r.j.received,change:r.j.change}:null;
        toast('ปิดโต๊ะ '+id+' แล้ว รับ '+baht(r.j.sale.total)+(S.lastCash?' ทอน '+baht(S.lastCash.change):''));
        S.sel=null;S.lastSale=r.j.sale;render();
      } else render();
    });
  }
  else if(a==='cashq'){
    S.cash=b.dataset.v;var ci2=$('#cash-in');if(ci2)ci2.value=S.cash;
    var pb2=document.querySelector('[data-a="pay"][data-m="cash"]');if(pb2)updateCash(+pb2.dataset.due);
  }
  else if(a==='donesale'){S.lastSale=null;S.lastCash=null;render();}
  else if(a==='viewsale'){var no=+b.dataset.no;S.viewSale=(S.report.bills||[]).filter(function(x){return x.no===no;})[0]||null;renderReport();}
  else if(a==='closesale'){S.viewSale=null;renderReport();}
  else if(a==='tog'){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'เปิด':'ปิด';S.dirty=true;}
  else if(a==='savesettings'){
    // ส่งเฉพาะช่องที่อยู่บนจอ (ร้านที่ไม่ใช้โต๊ะไม่มีช่องโต๊ะ/QR/หน้าลูกค้า ค่าเดิมของช่องเหล่านั้นไม่ถูกแตะ)
    var vv=function(i){var x=$('#'+i);return x?x.value:undefined;},on=function(i){var x=$('#'+i);return x?x.getAttribute('aria-pressed')==='true':undefined;};
    var sb={shop:vv('s-shop'),promptpay:vv('s-pp'),tables:$('#s-tables')?+vv('s-tables'):undefined,baseUrl:vv('s-base'),
      address:vv('s-addr'),phone:vv('s-phone'),taxId:vv('s-tax'),footer:vv('s-foot'),tagline:vv('s-tag'),shareUrl:vv('s-share'),
      acceptOrders:on('s-open'),svc:on('s-svc'),vat:on('s-vat'),requireSeat:on('s-seat')};
    if($('#s-facebook'))sb.social={facebook:vv('s-facebook'),instagram:vv('s-instagram'),line:vv('s-line'),tiktok:vv('s-tiktok')};
    if($('#s-hon'))sb.hours={on:on('s-hon'),open:vv('s-hopen'),close:vv('s-hclose')};
    act('/api/settings',sb,'บันทึกแล้ว')
      .then(function(r){if(r&&r.ok){S.dirty=false;if(document.activeElement)document.activeElement.blur();load();}});
  }
  else if(a==='tlook'){act('/api/settings',{look:b.dataset.v},'เปลี่ยนโทนหน้าลูกค้าแล้ว หน้าลูกค้าที่เปิดอยู่จะเปลี่ยนตามภายใน 5 วินาที').then(function(r){if(r&&r.ok)load();});}
  else if(a==='tpreset'){pickTheme(b.dataset.c);}
  else if(a==='treset'){pickTheme(S.d.settings.accent||'');}
  else if(a==='tsave'){
    var T=S.theme;T.saving=true;renderTheme();
    act('/api/settings',{accent:T.pick},'บันทึกสีแล้ว').then(function(r){T.saving=false;if(r&&!r.ok)T.err=r.j.error||'';if(r&&r.ok)load();else renderTheme();});
  }
  else if(a==='payqrdel'){
    var pp=S.d.settings.promptpay;
    confirmBox({title:'เลิกใช้รูป QR นี้?',lines:[pp?'ใบแจ้งยอดจะกลับไปใช้ QR ที่สร้างจากเบอร์ PromptPay '+pp:'ยังไม่ได้ตั้งเบอร์ PromptPay ใบแจ้งยอดจะไม่มี QR รับเงิน','ไฟล์รูปถูกลบจากเครื่อง ถ้าต้องการใช้อีกต้องอัปโหลดใหม่'],ok:'เลิกใช้รูปนี้'})
      .then(function(ok){if(ok)act('/api/settings/payqr/delete',{},'เลิกใช้รูป QR แล้ว').then(function(r){if(r&&r.ok){S.dirty=false;load();}});});
  }
  else if(a==='coverdel'){
    confirmBox({title:'เอาภาพพื้นหลังออก?',lines:['หน้าลูกค้าและหน้าใส่รหัสพนักงานจะกลับไปใช้สีร้านไล่สีแทน','ไฟล์ภาพถูกลบจากเครื่อง ถ้าต้องการใช้อีกต้องอัปโหลดใหม่'],ok:'เอาภาพออก'})
      .then(function(ok){if(ok)act('/api/settings/cover/delete',{},'เอาภาพพื้นหลังออกแล้ว').then(function(r){if(r&&r.ok)load();});});
  }
  else if(a==='logodel'){
    confirmBox({title:'เอาโลโก้ร้านออก?',lines:['โลโก้จะหายจากหน้าลูกค้า หน้าเข้าสู่ระบบ ใบเสร็จ และแผ่น QR','ไฟล์โลโก้ถูกลบจากเครื่อง ถ้าต้องการใช้อีกต้องอัปโหลดใหม่'],ok:'เอาโลโก้ออก'})
      .then(function(ok){if(ok)act('/api/settings/logo/delete',{},'เอาโลโก้ออกแล้ว').then(function(r){if(r&&r.ok)load();});});
  }
  else if(a==='openorders'){act('/api/settings',{acceptOrders:true},'เปิดรับออเดอร์ผ่าน QR แล้ว');}
  /* ประเภทธุรกิจ */
  else if(a==='bzpick'){
    var bp=(S.bizList||[]).filter(function(p){return p.key===b.dataset.v;})[0];
    if(bp){S.bz={pick:bp.key,modes:Object.assign({},bp.modes),err:''};renderBiz();}
  }
  else if(a==='bzmode'){
    var Z=S.bz||(S.bz={pick:null,modes:null,err:''}),mm2=Object.assign({},Z.modes||S.d.settings.modes),mk=b.dataset.v;
    mm2[mk]=!mm2[mk];
    if(mk==='buy'&&mm2.buy)mm2.counter=true;            // รับซื้อทำที่หน้าขายหน้าร้าน
    if(mk==='counter'&&!mm2.counter)mm2.buy=false;
    Z.modes=mm2;Z.err=!mm2.table&&!mm2.counter?'ต้องใช้อย่างน้อยหนึ่งทาง: ขายที่โต๊ะ หรือขายหน้าร้าน':'';renderBiz();
  }
  else if(a==='bzcancel'){S.bz={pick:null,modes:null,err:''};renderBiz();}
  else if(a==='bzsavemodes'){
    act('/api/settings',{modes:S.bz.modes},'บันทึกวิธีขายแล้ว').then(function(r){if(r&&r.ok){S.bz={pick:null,modes:null,err:''};load();}else if(r){S.bz.err=r.j.error||'';renderBiz();}});
  }
  else if(a==='bzapply'){bizApply(false);}
  else if(a==='bzsample'){
    var sp=(S.bizList||[]).filter(function(p){return p.key===S.bz.pick;})[0];if(!sp)return;
    var ti2=words().item,n2=S.d.menu.items.length;
    confirmBox({title:'แทนที่'+ti2+'ทั้งหมดด้วย'+sp.terms.item+'ตัวอย่างของ'+sp.name+'?',lines:[ti2+'ที่มีอยู่ทั้งหมด '+n2+' รายการ หมวดหมู่ และรูป ถูกลบ ใช้'+sp.terms.item+'ตัวอย่าง '+sp.sample.items+' รายการแทน',
      'ระบบสำรองข้อมูลปัจจุบันไว้ให้ก่อน กดผิดก็กู้กลับได้จากรายการไฟล์สำรอง (ก่อนโหลดตัวอย่าง)','ยอดขายและออเดอร์ที่เปิดอยู่ไม่กระทบ ราคาตัวอย่างเป็นราคาสมมติ แก้ให้ตรงกับร้านก่อนขายจริง'],ok:'แทนที่ด้วยตัวอย่าง',no:'ไม่แทนที่'})
      .then(function(ok){if(ok)bizApply(true);});
  }
  else if(a==='sold'){act('/api/soldout',{id:id,soldOut:b.dataset.on==='true'});}
  /* menu manager */
  else if(a==='enew'){openEditor(null);}
  else if(a==='eopen'){openEditor(S.d.menu.items.filter(function(x){return x.id===id;})[0]);}
  else if(a==='ecancel'){closeEditor();renderMenu();}
  else if(a==='esave'){saveItem();}
  else if(a==='erec'){var r2=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',r2);b.textContent=r2?'เปิด':'ปิด';}
  else if(a==='etog'){var h2=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',h2);b.textContent=h2?'ซ่อนอยู่':'แสดง';}
  else if(a==='edec'){var d2=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',d2);b.textContent=d2?'เปิด':'ปิด';}
  else if(a==='eimgdel'){syncEditor();if(S.edit.preview)URL.revokeObjectURL(S.edit.preview);S.edit.preview='';S.edit.blob=null;S.edit.removeImage=true;renderMenu();}
  else if(a==='edel'){
    syncEditor();
    var dm=S.d.menu.items.filter(function(x){return x.id===id;})[0];
    var ti=words().item;
    confirmBox({title:'ลบ'+ti+' "'+(dm?dm.name:'')+'"?',lines:[ti+'และรูปถูกลบถาวร ย้อนกลับไม่ได้','ออเดอร์และยอดขายที่ผ่านมายังอยู่ครบ','ถ้าแค่หมดชั่วคราว ใช้ "ตั้งเป็นหมด" ถ้าเลิกขายชั่วคราว ใช้ "ซ่อน" แทน'],ok:'ลบ'+ti})
      .then(function(ok){if(ok)act('/api/menu/item/delete',{id:id},'ลบ'+ti+'แล้ว').then(function(r){if(r&&r.ok){closeEditor();load();}});});
  }
  else if(a==='catfilter'){S.mCat=S.mCat===id?null:id;renderMenu();}
  else if(a==='catmove'){act('/api/menu/category/move',{id:id,dir:+b.dataset.d});}
  else if(a==='catedit'){S.catEdit=id;renderMenu();var ce=$('#c-edit');if(ce){ce.focus();ce.select();}}
  else if(a==='catcancel'){S.catEdit=null;renderMenu();}
  else if(a==='catsave'){act('/api/menu/category',{id:id,name:$('#c-edit').value}).then(function(r){if(r&&r.ok){S.catEdit=null;if(document.activeElement)document.activeElement.blur();load();}});}
  else if(a==='catadd'){
    var nv=$('#c-new').value;
    act('/api/menu/category',{name:nv},'เพิ่มหมวด "'+nv.trim()+'" แล้ว').then(function(r){if(r&&r.ok){$('#c-new').value='';if(document.activeElement)document.activeElement.blur();load();}});
  }
  else if(a==='catdel'){
    var dc=S.d.menu.categories.filter(function(x){return x.id===id;})[0];
    confirmBox({title:'ลบหมวด "'+(dc?dc.name:'')+'"?',lines:['ลบได้เฉพาะหมวดที่ไม่มีเมนูเหลือแล้ว','ถ้าต้องการใช้อีกต้องสร้างหมวดใหม่'],ok:'ลบหมวด'})
      .then(function(ok){if(ok)act('/api/menu/category/delete',{id:id},'ลบหมวดแล้ว').then(function(r){if(r&&r.ok&&S.mCat===id)S.mCat=null;});});
  }
  else if(a==='notessave'){
    var notes=$('#n-notes').value.split(/[,\n]/).map(function(x){return x.trim();}).filter(Boolean);
    act('/api/menu/notes',{notes:notes},'บันทึกตัวเลือกหมายเหตุแล้ว').then(function(){if(document.activeElement)document.activeElement.blur();load();});
  }
  /* backups */
  else if(a==='bknow'){b.disabled=true;act('/api/backup',{},'สำรองข้อมูลแล้ว').then(function(){loadBackups();});}
  else if(a==='rscancel'){S.rs=null;disarm();renderBackups();}
  else if(a==='rsgo'){
    confirmBox({title:'กู้คืนข้อมูลจากไฟล์สำรองนี้?',lines:['ข้อมูลปัจจุบันทั้งหมดถูกแทนที่: เมนู รูป ออเดอร์ที่เปิดอยู่ ตั้งค่า พนักงาน และรหัส QR','ระบบสำรองข้อมูลปัจจุบันไว้ให้ก่อนเสมอ (กู้กลับได้จากรายการไฟล์สำรอง)','ระหว่างกู้คืนลูกค้าสั่งไม่ได้ไม่กี่วินาที และทุกเครื่องต้องเข้าสู่ระบบใหม่'],ok:'กู้คืนข้อมูล',no:'ไม่กู้คืน'})
      .then(function(ok){if(ok)doRestore();});
  }
  else if(a==='printqr'){qrLocalWarn();printMode('qr');}
  else if(a==='qrprint'){
    qrLocalWarn();
    var qc=document.querySelector('.qcard[data-t="'+b.dataset.t+'"]');if(qc)qc.classList.add('pick');
    printMode('qr','pm-one');
  }
  else if(a==='qrpng'){
    qrLocalWarn();
    qrPng(+b.dataset.t).then(function(bl){saveFile(bl,'QR-โต๊ะ-'+b.dataset.t+'.png');},function(e){toast(e.message);});
  }
  else if(a==='qrzip'){
    qrLocalWarn();b.disabled=true;var tot=S.d.settings.tables,list=[],i=0;
    var nextQr=function(){
      if(++i>tot){saveFile(makeZip(list),'QR-'+S.d.settings.shop.replace(/[\\/:*?"<>|]/g,'')+'-'+tot+'-โต๊ะ.zip');b.disabled=false;toast('ดาวน์โหลด QR '+tot+' โต๊ะแล้ว');return;}
      b.textContent='กำลังสร้าง '+i+'/'+tot+'…';
      qrPng(i).then(function(bl){return bl.arrayBuffer();}).then(function(ab){list.push({name:'QR-โต๊ะ-'+String(i).padStart(2,'0')+'.png',data:new Uint8Array(ab)});nextQr();},function(e){b.disabled=false;toast(e.message);render();});
    };
    nextQr();
  }
  else if(a==='seat'){act('/api/table/seat',{table:id,open:b.dataset.on==='1'},b.dataset.on==='1'?'เปิดโต๊ะ '+id+' แล้ว ลูกค้าสั่งผ่าน QR ได้':'ปิดโต๊ะ '+id+' แล้ว');}
  else if(a==='qrrekey'){
    var rt=+b.dataset.t;
    confirmBox({title:'เปลี่ยนรหัส QR โต๊ะ '+rt+'?',lines:['QR โต๊ะ '+rt+' แผ่นที่ติดอยู่และรูปที่เคยดาวน์โหลดจะใช้ไม่ได้ทันที ต้องพิมพ์แผ่นใหม่ไปติดแทน','ลูกค้าที่กำลังเปิดหน้าสั่งอาหารของโต๊ะนี้ต้องสแกน QR ใหม่','ใช้เมื่อรูป QR หลุดออกไป หรือสงสัยว่ามีคนแกล้งสั่ง โต๊ะอื่นไม่กระทบ'],ok:'เปลี่ยนรหัส QR',no:'ไม่เปลี่ยน'})
      .then(function(ok){if(ok)act('/api/table/rekey',{table:rt},'เปลี่ยนรหัส QR โต๊ะ '+rt+' แล้ว พิมพ์แผ่นใหม่ไปติดแทน').then(function(r){if(r&&r.ok)load();});});
  }
  else if(a==='deltable'){
    var lt=S.d.settings.tables;
    if(S.d.tickets.some(function(k){return k.table===lt;})||S.d.calls[lt]||(S.d.seated&&S.d.seated[lt])){toast('โต๊ะ '+lt+' ยังมีออเดอร์ การเรียก หรือเปิดโต๊ะค้างอยู่ ปิดบิล/รับทราบ/ปิดโต๊ะก่อนลบ');return;}
    confirmBox({title:'ลบโต๊ะ '+lt+'?',lines:['ลบได้เฉพาะโต๊ะเลขสุดท้าย เลขโต๊ะอื่นไม่เปลี่ยน','QR โต๊ะ '+lt+' ที่ติดอยู่จะสั่งอาหารไม่ได้ ควรเก็บแผ่น QR ออกจากโต๊ะ','ถ้าเพิ่มโต๊ะกลับมาภายหลัง QR แผ่นเดิมกลับมาใช้ได้'],ok:'ลบโต๊ะ '+lt})
      .then(function(ok){if(ok)act('/api/settings',{tables:lt-1},'ลบโต๊ะ '+lt+' แล้ว').then(function(r){if(r&&r.ok&&S.sel===lt)S.sel=null;});});
  }
  else if(a==='addtable'){var nt=S.d.settings.tables+1;act('/api/settings',{tables:nt},'เพิ่มโต๊ะ '+nt+' แล้ว พิมพ์ QR ของโต๊ะใหม่ได้ที่แท็บตั้งค่า');}
  else if(a==='stnew'){S.stEdit='new';S.stErr='';S.sf=null;renderStaff();var n1=$('#sf-name');if(n1)n1.focus();}
  else if(a==='stedit'){S.stEdit=b.dataset.id;S.stErr='';S.sf=null;renderStaff();}
  else if(a==='stcancel'){S.stEdit=null;S.sf=null;renderStaff();}
  else if(a==='stsave'){
    var body={name:$('#sf-name').value,role:$('#sf-role').value,pin:$('#sf-pin').value.trim()};
    if(b.dataset.id)body.id=b.dataset.id;
    act('/api/staff',body,'บันทึกพนักงานแล้ว').then(function(r){
      if(r&&r.ok){S.stEdit=null;S.sf=null;S.stErr='';if(document.activeElement)document.activeElement.blur();loadStaff();}
      else if(r){S.stErr=r.j.error||'บันทึกไม่สำเร็จ';S.sf={for:S.stEdit,name:body.name,role:body.role};renderStaff();}
    });
  }
  else if(a==='sttoggle'){
    var sa=S.staff.filter(function(x){return x.id===b.dataset.id;})[0];
    if(sa&&sa.active){
      confirmBox({title:'ปิดบัญชี '+sa.name+'?',lines:['คนนี้เข้าสู่ระบบไม่ได้อีก และเครื่องที่เข้าอยู่จะหลุดทันที','ประวัติการทำงานยังอยู่ เปิดบัญชีกลับได้ภายหลัง'],ok:'ปิดบัญชี',no:'ไม่ปิด'})
        .then(function(ok){if(ok)act('/api/staff',{id:sa.id,name:sa.name,role:sa.role,active:false},'ปิดบัญชี '+sa.name+' แล้ว').then(loadStaff);});
      return;
    }
    if(sa)act('/api/staff',{id:sa.id,name:sa.name,role:sa.role,active:!sa.active},sa.active?'ปิดบัญชี '+sa.name+' แล้ว':'เปิดบัญชี '+sa.name+' แล้ว').then(loadStaff);
  }
  else if(a==='stout'){
    act('/api/staff/logout-all',{id:b.dataset.id},'ออกจากระบบทุกเครื่องแล้ว').then(function(r){if(r&&r.ok&&r.j.self){S.d=null;showLogin();}else loadStaff();});
  }
  else if(a==='logout'){api('/api/logout',{}).then(function(){S.d=null;showLogin();});}
});
setInterval(function(){if(S.d&&S.tab==='kitchen')renderKitchen();},20000);
// หน้าเข้าสู่ระบบ: โลโก้และชื่อร้าน (ดูได้ก่อนเข้าสู่ระบบ ไม่มีข้อมูลลับ)
api('/api/brand').then(function(r){if(!r.ok)return;
  if(r.j.cover){$('#login').style.setProperty('--cover','url("/img/'+String(r.j.cover).replace(/[^a-z0-9.-]/gi,'')+'")');$('#login').classList.add('has-cover');}
  setLogo($('#login-logo'),r.j.logo);$('#login-logo').alt=r.j.logo?'โลโก้ '+r.j.shop:'';$('#login-shop').textContent=r.j.shop||'';},function(){});
load();
})();
</script>
</body>
</html>
